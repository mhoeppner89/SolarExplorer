                    ctx.strokeRect(-19, -3, 6, 9);
                    ctx.strokeRect(13, -3, 6, 9);
                    ctx.strokeRect(-3.5, -31, 7, 6);

                    ctx.strokeStyle = "rgba(255, 255, 255, 0.42)";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, -30);
                    ctx.lineTo(0, 22);
                    ctx.moveTo(-6, 4);
                    ctx.lineTo(6, 4);
                    ctx.stroke();
                }
                ctx.restore();
            }

            function getLaserBeamTexture() {
                if (laserBeamTexture) return laserBeamTexture;
                const texture = document.createElement("canvas");
                texture.width = 64;
                texture.height = 1024;
                const beamCtx = texture.getContext("2d");
                const center = texture.width / 2;
                const beam = beamCtx.createLinearGradient(center, 0, center, texture.height);
                beam.addColorStop(0, "rgba(109, 226, 255, 0.34)");
                beam.addColorStop(0.72, "rgba(97, 216, 255, 0.72)");
                beam.addColorStop(1, "rgba(225, 255, 255, 0.98)");
                beamCtx.lineCap = "round";
                beamCtx.shadowColor = "rgba(97, 216, 255, 0.95)";
                beamCtx.shadowBlur = 14;
                beamCtx.strokeStyle = "rgba(74, 197, 255, 0.24)";
                beamCtx.lineWidth = 11;
                beamCtx.beginPath();
                beamCtx.moveTo(center, -8);
                beamCtx.lineTo(center, texture.height + 8);
                beamCtx.stroke();
                beamCtx.shadowBlur = 7;
                beamCtx.strokeStyle = beam;
                beamCtx.lineWidth = 4.6;
                beamCtx.stroke();
                beamCtx.shadowBlur = 2;
                beamCtx.strokeStyle = "rgba(247, 255, 255, 0.98)";
                beamCtx.lineWidth = 1.55;
                beamCtx.stroke();
                laserBeamTexture = texture;
                return laserBeamTexture;
            }

            function drawLaserBeam() {
                if (!state.laser.active || state.mode !== "playing") return;
                const x = state.player.x;
                const bottom = state.player.y - SHIP_SPRITE_HEIGHT * 0.42;
                const pulse = 0.5 + Math.sin(state.survivalTime * 42) * 0.5;
                const beamWidth = 22 + pulse * 3;
                ctx.save();
                ctx.globalCompositeOperation = "lighter";
                ctx.globalAlpha = 0.86 + pulse * 0.14;
                ctx.drawImage(getLaserBeamTexture(), x - beamWidth / 2, -16, beamWidth, bottom + 16);
                ctx.fillStyle = "rgba(226, 255, 255, 0.96)";
                ctx.beginPath();
                ctx.arc(x, bottom, 2.8 + pulse * 0.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawJoystick() {
                if (!state.joystick.active) return;
                const joy = state.joystick;
                const dx = joy.x - joy.originX;
                const dy = joy.y - joy.originY;
                const length = Math.hypot(dx, dy);
                const max = 84;
                const scale = length > max ? max / length : 1;
                const knobX = joy.originX + dx * scale;
                const knobY = joy.originY + dy * scale;
                ctx.save();
                ctx.globalAlpha = 0.64;
                ctx.strokeStyle = "rgba(210, 240, 255, 0.42)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(joy.originX, joy.originY, max, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = "rgba(97, 216, 255, 0.18)";
                ctx.beginPath();
                ctx.arc(knobX, knobY, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
                ctx.stroke();
                ctx.restore();
            }

            function drawParticles() {
                ctx.save();
                ctx.globalCompositeOperation = "lighter";
                for (const particle of state.particles) {
                    const alpha = Math.max(0, particle.life / particle.maxLife);
                    if (particle.type === "shockwave") {
                        ctx.globalAlpha = alpha * 0.82;
                        ctx.strokeStyle = particle.color;
                        ctx.lineWidth = 2 + alpha * 7;
                        ctx.beginPath();
                        ctx.arc(particle.x, particle.y, particle.r, 0, Math.PI * 2);
                        ctx.stroke();
                        continue;
                    }
                    ctx.globalAlpha = Math.min(1, alpha);
                    ctx.fillStyle = particle.color;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.r * (0.6 + alpha), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            function drawVictoryCelebration() {
                if (state.mode !== "won") return;
                const time = state.victoryTime;
                ctx.save();
                ctx.globalCompositeOperation = "lighter";

                const horizonGlow = ctx.createRadialGradient(WORLD.width * 0.5, WORLD.height * 0.72, 24, WORLD.width * 0.5, WORLD.height * 0.72, 310);
                horizonGlow.addColorStop(0, "rgba(255, 238, 169, 0.3)");
                horizonGlow.addColorStop(0.45, "rgba(97, 216, 255, 0.12)");
                horizonGlow.addColorStop(1, "rgba(97, 216, 255, 0)");
                ctx.fillStyle = horizonGlow;
                ctx.fillRect(0, WORLD.height * 0.32, WORLD.width, WORLD.height * 0.68);

                ctx.lineWidth = 2.4;
                for (let ring = 0; ring < 3; ring += 1) {
                    const cycle = (time * 0.16 + ring / 3) % 1;
                    ctx.globalAlpha = (1 - cycle) * 0.38;
                    ctx.strokeStyle = ring % 2 === 0 ? "#7ee8ff" : "#ffe29a";
                    ctx.beginPath();
                    ctx.arc(state.player.x, state.player.y, 44 + cycle * 120, 0, Math.PI * 2);
                    ctx.stroke();
                }

                for (const sparkle of victorySparkles) {
                    const travel = (sparkle.phase + time * sparkle.speed) % 1;
                    const x = sparkle.x + Math.sin(time * 1.4 + sparkle.phase * Math.PI * 2) * sparkle.drift;
                    const y = WORLD.height + 24 - travel * (WORLD.height + 90);
                    const alpha = Math.sin(travel * Math.PI) * 0.78;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(time * 1.2 + sparkle.phase * Math.PI);
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = sparkle.color;
                    ctx.beginPath();
                    ctx.moveTo(0, -sparkle.size * 1.8);
                    ctx.lineTo(sparkle.size * 0.7, 0);
                    ctx.lineTo(0, sparkle.size * 1.8);
                    ctx.lineTo(-sparkle.size * 0.7, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
                ctx.restore();
            }

            function render() {
                const scaleX = canvas.width / WORLD.width;
                const scaleY = canvas.height / WORLD.height;
                ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
                ctx.clearRect(0, 0, WORLD.width, WORLD.height);
                const shakeX = state.shake > 0 ? Math.sin(state.survivalTime * 91.7) * 5 * state.shake : 0;
                const shakeY = state.shake > 0 ? Math.cos(state.survivalTime * 73.3) * 5 * state.shake : 0;
                ctx.save();
                ctx.translate(shakeX, shakeY);
                drawBackground();
                drawVictoryCelebration();
                drawLaserBeam();
                for (const debris of state.debris) drawDebris(debris);
                for (const astronaut of state.collectibles) drawAstronaut(astronaut);
                drawParticles();
                if (state.mode !== "gameover" || state.shields > 0) drawPlayer();
                drawJoystick();
                ctx.restore();
            }

            function frame(now) {
                if (!frame.last) frame.last = now;
                const dt = Math.min(0.05, (now - frame.last) / 1000);
                frame.last = now;
                update(dt);
                render();
                requestAnimationFrame(frame);
            }

            function resizeCanvas() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
                const rect = shell.getBoundingClientRect();
                canvas.width = Math.max(1, Math.round(rect.width * dpr));
                canvas.height = Math.max(1, Math.round(rect.height * dpr));
                render();
            }

            function eventToWorld(event) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (event.clientX - rect.left) / rect.width * WORLD.width,
                    y: (event.clientY - rect.top) / rect.height * WORLD.height
                };
            }

            function onPointerDown(event) {
                if (event.target !== canvas) return;
                if (state.mode === "ready") {
                    startGame();
                } else if (state.mode === "gameover" || state.mode === "won") {
                    restartGame();
                }
                if (state.mode !== "playing") return;
                const point = eventToWorld(event);
                state.joystick.active = true;
                state.joystick.id = event.pointerId;
                state.joystick.originX = point.x;
                state.joystick.originY = point.y;
                state.joystick.x = point.x;
                state.joystick.y = point.y;
                canvas.setPointerCapture(event.pointerId);
            }

            function onPointerMove(event) {
                if (!state.joystick.active || state.joystick.id !== event.pointerId) return;
                const point = eventToWorld(event);
                state.joystick.x = point.x;
                state.joystick.y = point.y;
            }

            function onPointerUp(event) {
                if (state.joystick.id === event.pointerId) {
                    state.joystick.active = false;
                    state.joystick.id = null;
                    try {
                        canvas.releasePointerCapture(event.pointerId);
                    } catch (error) {
                        // Some browser drivers release capture automatically.
                    }
                }
            }

            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    shell.requestFullscreen?.();
                } else {
                    document.exitFullscreen?.();
                }
            }

            function renderGameToText() {
                const cycle = dayCycleState();
                const relevantDebris = state.debris
                    .slice()
                    .sort((a, b) => Math.hypot(a.x - state.player.x, a.y - state.player.y) - Math.hypot(b.x - state.player.x, b.y - state.player.y))
                    .slice(0, 14)
                    .map((debris) => ({
                        x: Number(debris.x.toFixed(1)),
                        y: Number(debris.y.toFixed(1)),
                        vx: Number(debris.vx.toFixed(1)),
                        vy: Number(debris.vy.toFixed(1)),
                        rot: Number(debris.rot.toFixed(2)),
                        spin: Number(debris.spin.toFixed(2)),
                        speedFactor: Number(debris.speedFactor.toFixed(2)),
                        r: Number(debris.r.toFixed(1)),
                        size: debris.size,
                        kind: debris.kind,
                        satelliteVariant: debris.satelliteVariant,
                        wave: debris.waveKey,
                        canCollide: debris.canCollide,
                        canCascade: debris.canCascade,
                        laserDeflected: Number(debris.laserDeflected.toFixed(2)),
                        laserGlow: Number(debris.laserGlow.toFixed(2)),
                        laserHeat: debris.kind === "fuelTank" ? Number(debris.laserHeat.toFixed(2)) : null
                    }));
                return JSON.stringify({
                    mode: state.mode,
                    coordinates: `world units; origin top-left; x right; y down; canvas world ${WORLD.width}x${WORLD.height}`,
                    level: state.level,
                    phase: state.phase,
                    wave: {
                        key: currentWavePattern().key,
                        name: currentWaveName()
                    },
                    difficulty: Number(difficultyForLevel().toFixed(2)),
                    debrisSpeedMultiplier: DEBRIS_SPEED_MULTIPLIER,
                    review: {
                        mode: reviewMode,
                        invincible: state.reviewInvincible
                    },
                    scenery: backgroundSceneForLevel().key,
                    iss: {
                        visible: ISS_DAMAGE_LEVELS.has(state.level),
                        damageStage: ISS_DAMAGE_LEVELS.get(state.level) ?? null,
                        asset: ISS_DAMAGE_LEVELS.has(state.level) ? ISS_SPRITE_SOURCES[ISS_DAMAGE_LEVELS.get(state.level)] : null,
                        displaySize: ISS_DRAW_SIZE,
                        travel: ISS_DAMAGE_LEVELS.has(state.level) ? Number(backgroundObjectProgress().toFixed(2)) : null
                    },
                    orbit: {
                        approach: Number(campaignProgress().toFixed(2)),
                        atmosphereEntry: Number(lateAtmosphereProgress().toFixed(2)),
                        plasmaIntensity: Number(state.plasmaIntensity.toFixed(2)),
                        earthRadius: Number(earthOrbitState(state.survivalTime).radius.toFixed(1)),
                        textureScroll: Number(earthTextureScrollProgress().toFixed(2))
                    },
                    phaseRemaining: Number(Math.max(0, state.phaseDuration - state.phaseTimer).toFixed(2)),
                    score: Math.floor(state.score),
                    victoryBonus: VICTORY_BONUS,
                    best: Math.max(state.best, Math.floor(state.score)),
                    survivalTime: Number(state.survivalTime.toFixed(2)),
                    shields: state.shields,
                    maxShields: MAX_SHIELDS,
                    laser: {
                        active: state.laser.active,
                        duration: LASER_DURATION,
                        remaining: Number(state.laser.remaining.toFixed(2)),
                        cooldownDuration: LASER_COOLDOWN,
                        cooldown: Number(state.laser.cooldown.toFixed(2)),
                        ready: !state.laser.active && state.laser.cooldown <= 0,
                        disintegrated: state.laser.disintegrated,
                        deflected: state.laser.deflected
                    },
                    dayCycle: {
                        duration: DAY_CYCLE_DURATION,
                        phase: Number(cycle.phase.toFixed(3)),
                        name: cycle.name,
                        daylight: Number(cycle.daylight.toFixed(2)),
                        warmth: Number(cycle.warmth.toFixed(2))
                    },
                    player: {
                        x: Number(state.player.x.toFixed(1)),
                        y: Number(state.player.y.toFixed(1)),
                        vx: Number(state.player.vx.toFixed(1)),
                        vy: Number(state.player.vy.toFixed(1)),
                        r: PLAYER_RADIUS,
                        invulnerable: Number(state.player.invulnerable.toFixed(2))
                    },
                    input: {
                        keyboard: [...keys],
                        joystick: state.joystick.active,
                        tilt: {
                            enabled: state.tilt.enabled,
                            calibrated: state.tilt.calibrated,
                            pendingCalibration: state.tilt.pendingCalibration,
                            permission: state.tilt.permission,
                            wakeLockSupported: screenWakeLockSupported(),
                            wakeLockActive: Boolean(screenWakeLock && !screenWakeLock.released),
                            vector: {
                                x: Number(state.tilt.inputX.toFixed(2)),
                                y: Number(state.tilt.inputY.toFixed(2))
                            }
                        },
                        vector: {
                            x: Number(state.lastInput.x.toFixed(2)),
                            y: Number(state.lastInput.y.toFixed(2))
                        }
                    },
                    debrisCount: state.debris.length,
                    nearestDebris: relevantDebris,
                    astronauts: state.collectibles.map((astronaut) => ({
                        x: Number(astronaut.x.toFixed(1)),
                        y: Number(astronaut.y.toFixed(1)),
                        r: astronaut.r,
                        spriteIndex: astronaut.spriteIndex,
                        sprite: ASTRONAUT_SPRITE_SOURCES[astronaut.spriteIndex],
                        spriteReady: Boolean(astronautSprites[astronaut.spriteIndex]?.ready)
                    })),
                    astronautsRescued: state.astronautsRescued,
                    reentry: {
                        active: state.reentry.active,
                        phase: state.reentry.active && state.reentry.clearanceTimer < state.reentry.clearanceDuration
                            ? "orbital-clearance"
                            : state.reentry.active ? "atmospheric-entry" : "inactive",
                        clearanceProgress: Number(clamp(state.reentry.clearanceTimer / state.reentry.clearanceDuration, 0, 1).toFixed(2)),
                        clearanceDuration: state.reentry.clearanceDuration,
                        progress: Number(clamp(state.reentry.timer / state.reentry.duration, 0, 1).toFixed(2)),
                        stage: state.reentry.stage,
                        stageName: copy.reentryStages[state.reentry.stage],
                        duration: state.reentry.duration
                    },
                    particles: state.particles.length,
                    recentCascades: state.recentCascades,
                    controls: copy.controls
                });
            }

            window.render_game_to_text = renderGameToText;
            window.advanceTime = (ms) => {
                const steps = Math.max(1, Math.round(ms / (1000 / 60)));
                for (let i = 0; i < steps; i += 1) update(FIXED_DT);
                render();
            };

            startButton.addEventListener("click", () => {
                if (state.mode === "gameover" || state.mode === "won") {
                    restartGame();
                } else {
                    startGame();
                }
            });
            tiltToggleButton.addEventListener("click", toggleTiltControl);
            tiltCalibrateButton.addEventListener("click", calibrateTiltFromButton);
            restartButton.addEventListener("click", restartGame);
            pauseButton.addEventListener("click", togglePause);
            laserButton.addEventListener("click", activateLaser);
            canvas.addEventListener("pointerdown", onPointerDown);
            canvas.addEventListener("pointermove", onPointerMove);
            canvas.addEventListener("pointerup", onPointerUp);
            canvas.addEventListener("pointercancel", onPointerUp);

            window.addEventListener("keydown", (event) => {
                const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
                if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " ", "Spacebar"].includes(event.key)) {
                    event.preventDefault();
                }
                if (key === " ") {
                    if (state.mode === "ready") startGame();
                    else if (state.mode === "gameover" || state.mode === "won") restartGame();
                    else if (state.mode === "playing" && !event.repeat) activateLaser();
                } else if (key === "Enter") {
                    if (state.mode === "ready") startGame();
                    else if (state.mode === "gameover" || state.mode === "won") restartGame();
                } else if (key === "p") {
                    togglePause();
                } else if (key === "f") {
                    toggleFullscreen();
                } else {
                    keys.add(key);
                }
            });
            window.addEventListener("keyup", (event) => {
                const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
                keys.delete(key);
            });
            window.addEventListener("blur", () => {
                keys.clear();
                state.joystick.active = false;
            });
            window.addEventListener("resize", resizeCanvas);
            window.visualViewport?.addEventListener("resize", resizeCanvas);
            document.addEventListener("fullscreenchange", resizeCanvas);
            document.addEventListener("visibilitychange", syncScreenWakeLock);
            window.addEventListener("pagehide", releaseScreenWakeLock);

            loadBest();
            applyLanguage(language);
            resetGame();
            if (reviewMode) startGame();
            resizeCanvas();
            requestAnimationFrame(frame);
        })();
    </script>
</body>

</html>
