                state.lastInput.y = 0;
                state.bannerTimer = 2.2;
                levelBanner.textContent = copy.reentryStages[0];
                levelBanner.classList.add("is-visible");
            }

            function updateReentryDrift(dt) {
                const cinematicProgress = clamp(state.reentry.timer / 1.7, 0, 1);
                const cameraSeparation = smoothstep(cinematicProgress) * 480;
                for (const debris of state.debris) {
                    if (debris.remove) continue;
                    if (debris.kind === "fuelTank") {
                        debris.laserHeat = Math.max(0, debris.laserHeat - dt * 0.62);
                        debris.laserHeating = false;
                    }
                    if (debris.kind === "panel" || debris.kind === "solarWing" || debris.kind === "foil") {
                        const weavePower = debris.kind === "foil" ? 34 : debris.kind === "solarWing" ? 26 : 22;
                        debris.vx += Math.sin(debris.age * 3.1 + debris.seed) * debris.weave * weavePower * DEBRIS_SPEED_MULTIPLIER * dt;
                    }
                    debris.x += debris.vx * dt;
                    debris.y += (debris.vy - cameraSeparation) * dt;
                    debris.age += dt;
                    debris.vx *= Math.max(0, 1 - 0.52 * dt);
                    debris.vy *= Math.max(0, 1 - 0.03 * dt);
                    debris.rot += debris.spin * dt;
                    debris.flash = Math.max(0, debris.flash - dt);
                    debris.laserGlow = Math.max(0, debris.laserGlow - dt * 0.72);
                    debris.laserDeflected = Math.max(0, debris.laserDeflected - dt);
                    debris.laserHitCooldown = Math.max(0, debris.laserHitCooldown - dt);
                    if (
                        debris.y > WORLD.height + debris.r + DEBRIS_EXIT_MARGIN ||
                        debris.y < -debris.r - 140 ||
                        debris.x < -debris.r - 100 ||
                        debris.x > WORLD.width + debris.r + 100
                    ) {
                        debris.remove = true;
                    }
                }
                state.debris = state.debris.filter((debris) => !debris.remove);

                for (const astronaut of state.collectibles) {
                    astronaut.x += astronaut.vx * dt;
                    astronaut.y += (astronaut.vy - cameraSeparation) * dt;
                    if (
                        astronaut.y > WORLD.height + astronaut.r + DEBRIS_EXIT_MARGIN ||
                        astronaut.y < -astronaut.r - 140 ||
                        astronaut.x < -astronaut.r - 100 ||
                        astronaut.x > WORLD.width + astronaut.r + 100
                    ) {
                        astronaut.remove = true;
                    }
                }
                state.collectibles = state.collectibles.filter((astronaut) => !astronaut.remove);
            }

            function finishReentry() {
                state.mode = "won";
                state.reentry.active = false;
                state.score += VICTORY_BONUS;
                state.victoryTime = 0;
                state.bannerTimer = 0;
                levelBanner.classList.remove("is-visible");
                syncScreenWakeLock();
                saveBest();
                showWinMessage();
            }

            function updateReentry(dt) {
                const reentry = state.reentry;
                state.survivalTime += dt;
                state.score += dt * 24;
                updateReentryDrift(dt);

                if (reentry.clearanceTimer < reentry.clearanceDuration) {
                    reentry.clearanceTimer = Math.min(reentry.clearanceDuration, reentry.clearanceTimer + dt);
                    const clearance = smoothstep(reentry.clearanceTimer / reentry.clearanceDuration);
                    const previousX = state.player.x;
                    const previousY = state.player.y;
                    state.player.x += (WORLD.width * 0.5 - state.player.x) * (1 - Math.exp(-1.35 * dt));
                    state.player.y += (720 - state.player.y) * (1 - Math.exp(-1.05 * dt));
                    state.player.vx = (state.player.x - previousX) / Math.max(dt, 0.001);
                    state.player.vy = (state.player.y - previousY) / Math.max(dt, 0.001);
                    state.player.thrust = 0.3 + clearance * 0.34 + Math.sin(state.survivalTime * 9) * 0.05;
                    if (reentry.clearanceTimer >= reentry.clearanceDuration) {
                        reentry.startX = state.player.x;
                        reentry.startY = state.player.y;
                        shell.classList.add("is-cinematic");
                    }
                    return;
                }

                reentry.timer += dt;
                const progress = clamp(reentry.timer / reentry.duration, 0, 1);
                const stage = progress < 0.18 ? 0 : progress < 0.48 ? 1 : progress < 0.78 ? 2 : 3;
                if (stage !== reentry.stage) {
                    reentry.stage = stage;
                    state.bannerTimer = 1.8;
                    levelBanner.textContent = copy.reentryStages[stage];
                    levelBanner.classList.add("is-visible");
                }
                const entry = smoothstep(progress / 0.18);
                const descent = smoothstep((progress - 0.18) / 0.58);
                const glide = smoothstep((progress - 0.76) / 0.24);
                const plasma = reentryPlasmaProgress(progress);
                const previousX = state.player.x;
                const previousY = state.player.y;
                const centerApproach = reentry.startX + (WORLD.width * 0.5 - reentry.startX) * entry;
                state.player.x = centerApproach + Math.sin(progress * Math.PI * 5.2) * (24 - glide * 16);
                state.player.y = reentry.startY + (430 - reentry.startY) * entry + descent * 210 - glide * 80;
                state.player.vx = (state.player.x - previousX) / Math.max(dt, 0.001);
                state.player.vy = (state.player.y - previousY) / Math.max(dt, 0.001);
                state.player.thrust = 0.24 + plasma * 0.42 + Math.sin(progress * Math.PI * 4) * 0.08;
                state.shake = Math.max(state.shake, plasma * 0.18);
                if (progress >= 1) finishReentry();
            }

            function updatePlasmaIntensity(dt) {
                let target = lateAtmosphereProgress();
                if (state.mode === "reentry" && state.reentry.clearanceTimer >= state.reentry.clearanceDuration) {
                    const progress = clamp(state.reentry.timer / state.reentry.duration, 0, 1);
                    target = 1 - smoothstep((progress - 0.72) / 0.16);
                } else if (state.mode === "won" || state.mode === "gameover") {
                    target = 0;
                }
                const response = target > state.plasmaIntensity ? 0.58 : 1.5;
                state.plasmaIntensity += (target - state.plasmaIntensity) * (1 - Math.exp(-response * dt));
                if (state.plasmaIntensity < 0.001) state.plasmaIntensity = 0;
            }

            function updateParticles(dt) {
                for (const particle of state.particles) {
                    if (particle.type === "shockwave") {
                        const progress = 1 - particle.life / particle.maxLife;
                        particle.r = particle.startR + (particle.targetR - particle.startR) * smoothstep(progress);
                        particle.life -= dt;
                        continue;
                    }
                    particle.x += particle.vx * dt;
                    particle.y += particle.vy * dt;
                    particle.vx *= 0.982;
                    particle.vy *= 0.982;
                    particle.life -= dt;
                }
                state.particles = state.particles.filter((particle) => particle.life > 0);
            }

            function update(dt) {
                if (state.mode === "reentry") {
                    updateReentry(dt);
                    updatePlasmaIntensity(dt);
                    updateParticles(dt);
                    state.shake = Math.max(0, state.shake - dt * 2.8);
                    state.bannerTimer = Math.max(0, state.bannerTimer - dt);
                    if (state.bannerTimer <= 0) levelBanner.classList.remove("is-visible");
                    updateHud();
                    return;
                }
                if (state.mode !== "playing") {
                    if (state.mode === "won") state.victoryTime += dt;
                    updateParticles(dt);
                    return;
                }
                state.survivalTime += dt;
                state.score += dt * (9.4 + state.level * 1.55 + state.debris.length * 0.018);
                updatePhase(dt);
                updatePlasmaIntensity(dt);
                if (state.mode !== "playing") {
                    updateParticles(dt);
                    updateHud();
                    return;
                }
                updateSpawning(dt);
                updateInput(dt);
                updateLaser(dt);
                updateAstronautSpawning(dt);
                updateCollectibles(dt);
                updateDebris(dt);
                updateParticles(dt);
                state.shake = Math.max(0, state.shake - dt * 2.8);
                state.bannerTimer = Math.max(0, state.bannerTimer - dt);
                if (state.bannerTimer <= 0) levelBanner.classList.remove("is-visible");
                updateHud();
            }

            function smoothstep(value) {
                const t = clamp(value, 0, 1);
                return t * t * (3 - 2 * t);
            }

            function dayCycleState(time = state.survivalTime) {
                const phase = ((time / DAY_CYCLE_DURATION) % 1 + 1) % 1;
                const angle = phase * Math.PI * 2;
                const sunElevation = Math.sin(angle);
                const daylight = smoothstep((sunElevation + 0.16) / 0.42);
                const warmth = Math.pow(Math.max(0, 1 - Math.abs(sunElevation) / 0.72), 2);
                const name = phase < 0.065 || phase >= 0.94
                    ? "sunrise"
                    : phase < 0.44
                        ? "day"
                        : phase < 0.565 ? "sunset" : "night";
                return {
                    phase,
                    name,
                    daylight,
                    nightAmount: 1 - daylight,
                    warmth,
                    lightDirection: -Math.cos(angle)
                };
            }

            function backgroundSceneForLevel(level = state.level) {
                return state.backgroundScenes[level] || ORBITAL_SCENES[0];
            }

            function sceneBlend() {
                if (state.phase !== "calm" || state.level >= MAX_LEVEL) return 0;
                return smoothstep(state.phaseTimer / Math.max(0.001, state.phaseDuration));
            }

            function campaignProgress() {
                if (state.mode === "reentry" || state.mode === "won") return 1;
                const phaseProgress = clamp(state.phaseTimer / Math.max(0.001, state.phaseDuration), 0, 1);
                const withinLevel = state.phase === "calm"
                    ? 0.82 + phaseProgress * 0.18
                    : phaseProgress * 0.82;
                return clamp((state.level - 1 + withinLevel) / (MAX_LEVEL - 1), 0, 1);
            }

            function lateAtmosphereProgress() {
                if (state.mode === "reentry" || state.mode === "won") return 1;
                if (state.level < 22) return 0;
                const phaseProgress = clamp(state.phaseTimer / Math.max(0.001, state.phaseDuration), 0, 1);
                const withinLevel = state.phase === "calm" ? 0.82 + phaseProgress * 0.18 : phaseProgress * 0.82;
                return Math.pow(smoothstep((state.level - 22 + withinLevel) / 4), 0.7);
            }

            function reentryPlasmaProgress(progress) {
                const fadeIn = smoothstep((progress - 0.04) / 0.32);
                const fadeOut = 1 - smoothstep((progress - 0.72) / 0.16);
                return fadeIn * fadeOut;
            }

            function backgroundObjectProgress() {
                const phaseProgress = clamp(state.phaseTimer / Math.max(0.001, state.phaseDuration), 0, 1);
                return state.phase === "calm"
                    ? 0.82 + phaseProgress * 0.18
                    : 0.04 + phaseProgress * 0.78;
            }

            function earthTextureScrollProgress(time = state.survivalTime) {
                return ((time / 110) % 1 + 1) % 1;
            }

            function earthOrbitState(time) {
                const approach = campaignProgress();
                const radius = 685 + approach * 190;
                return {
                    x: WORLD.width * 0.5 + Math.sin(time * 0.047) * 48 + Math.cos(time * 0.021) * 10,
                    y: WORLD.height + 318 - approach * 140 + Math.sin(time * 0.036) * 14,
                    radius,
                    approach
                };
            }

            function paletteForScene(scene) {
                const palettes = {
                    earthDay: ["#071d30", "#123e59", "#14233d"],
                    terminator: ["#050b1d", "#152a42", "#3c2340"],
                    sunrise: ["#1a1430", "#9a4f43", "#e08a4f"],
                    moonPass: ["#0b1326", "#1c2941", "#2b4563"],
                    aurora: ["#071b24", "#0c3d45", "#14355b"],
                    highOrbit: ["#060a18", "#101c34", "#28304e"],
                    nightLights: ["#040817", "#16213a", "#31233d"]
                };
                return palettes[scene.key] || palettes.earthDay;
            }

            function drawSpaceGradient(scene, alpha = 1) {
                const [top, middle, bottom] = paletteForScene(scene);
                const gradient = ctx.createLinearGradient(0, 0, WORLD.width, WORLD.height);
                gradient.addColorStop(0, top);
                gradient.addColorStop(0.5, middle);
                gradient.addColorStop(1, bottom);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, WORLD.width, WORLD.height);
                ctx.restore();
            }

            function drawStars(time, alpha = 1) {
                ctx.save();
                ctx.globalAlpha = alpha;
                for (const star of stars) {
                    const y = (star.y + time * star.speed * 0.23) % WORLD.height;
                    ctx.fillStyle = `${star.hue}${star.alpha})`;
                    ctx.beginPath();
                    ctx.arc(star.x, y, star.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            function drawSun(x, y, radius, glowAlpha = 1) {
                ctx.save();
                ctx.globalAlpha = glowAlpha;
                const glow = ctx.createRadialGradient(x, y, radius * 0.22, x, y, radius * 3.1);
                glow.addColorStop(0, "rgba(255, 250, 203, 0.95)");
                glow.addColorStop(0.28, "rgba(255, 191, 98, 0.5)");
                glow.addColorStop(1, "rgba(255, 152, 70, 0)");
                ctx.fillStyle = glow;
                ctx.fillRect(x - radius * 3.1, y - radius * 3.1, radius * 6.2, radius * 6.2);
                ctx.globalAlpha = 1;
                ctx.fillStyle = "#ffe29a";
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawDayCycleGradient(cycle) {
                const night = ctx.createLinearGradient(0, 0, WORLD.width, WORLD.height);
                night.addColorStop(0, "#030714");
                night.addColorStop(0.52, "#0b1830");
                night.addColorStop(1, "#17152d");
                ctx.fillStyle = night;
                ctx.fillRect(0, 0, WORLD.width, WORLD.height);

                if (cycle.daylight > 0) {
                    const day = ctx.createLinearGradient(0, 0, WORLD.width, WORLD.height);
                    day.addColorStop(0, "#061b2f");
                    day.addColorStop(0.52, "#17445c");
                    day.addColorStop(1, "#263d59");
                    ctx.save();
                    ctx.globalAlpha = cycle.daylight;
                    ctx.fillStyle = day;
                    ctx.fillRect(0, 0, WORLD.width, WORLD.height);
                    ctx.restore();
                }

                if (cycle.warmth > 0) {
                    const warm = ctx.createLinearGradient(0, 0, WORLD.width, WORLD.height);
                    warm.addColorStop(0, "#25132c");
                    warm.addColorStop(0.48, "#8b4043");
                    warm.addColorStop(1, "#d77947");
                    ctx.save();
                    ctx.globalAlpha = cycle.warmth * 0.82;
                    ctx.fillStyle = warm;
                    ctx.fillRect(0, 0, WORLD.width, WORLD.height);
                    ctx.restore();
                }
            }

            function celestialArcPosition(earth, progress, reverse = false) {
                const horizon = earth.y - earth.radius;
                const travel = reverse ? 1 - progress : progress;
                return {
                    x: -78 + travel * (WORLD.width + 156),
                    y: horizon + 86 - Math.sin(progress * Math.PI) * (horizon + 220)
                };
            }

            function drawDayCycleCelestials(earth, cycle, time) {
                if (cycle.phase <= 0.5) {
                    const sun = celestialArcPosition(earth, cycle.phase / 0.5);
                    drawSun(sun.x, sun.y, 60, 1);
                } else {
                    const moonProgress = (cycle.phase - 0.5) / 0.5;
                    const moon = celestialArcPosition(earth, moonProgress, true);
                    drawMoon(moon.x, moon.y, 54 + earth.approach * 10, 1, time);
                }
            }

            function drawMoon(x, y, radius, alpha, time) {
                if (moonSpriteReady && moonSprite.complete && moonSprite.naturalWidth > 0) {
                    const spriteSize = radius * 2.4;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.drawImage(moonSprite, x - spriteSize / 2, y - spriteSize / 2, spriteSize, spriteSize);
                    ctx.restore();
                    return;
                }
                ctx.save();
                ctx.globalAlpha = alpha;
                const surface = ctx.createRadialGradient(x - radius * 0.28, y - radius * 0.3, radius * 0.1, x, y, radius);
                surface.addColorStop(0, "#f1e6cf");
                surface.addColorStop(0.54, "#b8ae9f");
                surface.addColorStop(1, "#5c5b65");
                ctx.fillStyle = surface;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.save();
                ctx.clip();
                ctx.fillStyle = "rgba(72, 72, 81, 0.34)";
                for (let index = 0; index < 8; index += 1) {
                    const angle = index * 1.7 + time * 0.01;
                    const distance = radius * (0.18 + (index % 4) * 0.17);
                    ctx.beginPath();
                    ctx.arc(x + Math.cos(angle) * distance, y + Math.sin(angle) * distance, radius * (0.06 + (index % 3) * 0.035), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
                ctx.restore();
            }

            function risingCelestialPosition(earth, travel, side, time) {
                const rise = clamp((travel - 0.04) / 0.96, 0, 1);
                const horizon = earth.y - earth.radius;
                const inwardTravel = (0.5 - side) * WORLD.width * 0.92 * rise;
                const orbitalCurve = Math.sin(rise * Math.PI) * (side < 0.5 ? 24 : -24);
                return {
                    x: WORLD.width * side + inwardTravel + orbitalCurve + Math.sin(time * 0.025 + side * 8) * 6,
                    y: horizon + 92 - rise * (horizon + 270)
                };
            }

            function mirroredTextureCoordinate(value) {
                const wrapped = ((value % 2) + 2) % 2;
                return wrapped <= 1 ? wrapped : 2 - wrapped;
            }

            function drawProjectedEarthTexture(x, y, radius, time) {
                const sourceSize = Math.min(earthSprite.naturalWidth, earthSprite.naturalHeight);
                const sourceX = (earthSprite.naturalWidth - sourceSize) / 2;
                const sourceY = (earthSprite.naturalHeight - sourceSize) / 2;
                const scroll = earthTextureScrollProgress(time) * 2;
                const bandHeight = radius > 1350 ? 4 : 2;
                const visibleTop = Math.max(0, Math.floor(y - radius));
                const visibleBottom = Math.min(WORLD.height, Math.ceil(y + radius));
                ctx.fillStyle = "#176f9f";
                ctx.fillRect(x - radius, visibleTop, radius * 2, visibleBottom - visibleTop);

                // Compress each texture band to the sphere chord so the surface recedes around the limb.
                for (let bandY = visibleTop; bandY < visibleBottom; bandY += bandHeight) {
                    const sampleY = bandY + bandHeight * 0.5;
                    const sphereY = clamp((sampleY - y) / radius, -1, 1);
                    const halfChord = radius * Math.sqrt(Math.max(0, 1 - sphereY * sphereY));
                    if (halfChord < 1) continue;
                    const latitude = Math.asin(sphereY) / Math.PI + 0.5;
                    const textureV = mirroredTextureCoordinate(latitude - scroll);
                    const sourceBandY = sourceY + textureV * (sourceSize - 2);
                    const destinationLeft = x - halfChord;
                    const destinationWidth = halfChord * 2;
                    const clippedLeft = Math.max(0, destinationLeft);
                    const clippedRight = Math.min(WORLD.width, destinationLeft + destinationWidth);
                    if (clippedRight <= clippedLeft) continue;
                    const sourceLeft = sourceX + (clippedLeft - destinationLeft) / destinationWidth * sourceSize;
                    const sourceWidth = (clippedRight - clippedLeft) / destinationWidth * sourceSize;
                    ctx.drawImage(
                        earthSprite,
                        sourceLeft,
                        sourceBandY,
                        sourceWidth,
                        2,
                        clippedLeft,
                        bandY,
                        clippedRight - clippedLeft,
                        bandHeight + 1
                    );
                }

                const limbShade = ctx.createRadialGradient(
                    x,
                    y - radius * 0.2,
                    radius * 0.34,
                    x,
                    y,
                    radius * 1.02
                );
                limbShade.addColorStop(0.56, "rgba(3, 19, 36, 0)");
                limbShade.addColorStop(0.82, "rgba(3, 19, 36, 0.08)");
                limbShade.addColorStop(1, "rgba(3, 12, 28, 0.34)");
                ctx.fillStyle = limbShade;
                ctx.fillRect(x - radius, visibleTop, radius * 2, visibleBottom - visibleTop);
            }

            function drawAtmosphereBand({ x, y, radius, alpha, warmth, darkness, lightDirection }) {
                const thickness = Math.max(10, radius * 0.032);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.globalCompositeOperation = "lighter";

                const haze = ctx.createRadialGradient(x, y, radius * 0.955, x, y, radius + thickness * 1.9);
                haze.addColorStop(0, "rgba(38, 126, 204, 0)");
                haze.addColorStop(0.3, `rgba(72, 185, 255, ${0.13 + darkness * 0.08})`);
                haze.addColorStop(0.48, `rgba(135, 229, 255, ${0.27 + darkness * 0.08})`);
                haze.addColorStop(0.68, "rgba(81, 184, 255, 0.12)");
                haze.addColorStop(1, "rgba(49, 133, 238, 0)");
                ctx.fillStyle = haze;
                ctx.beginPath();
                ctx.arc(x, y, radius + thickness * 1.9, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(190, 244, 255, ${0.52 + darkness * 0.2})`;
                ctx.lineWidth = Math.max(1.5, radius * 0.006);
                ctx.beginPath();
                ctx.arc(x, y, radius + Math.max(1.5, radius * 0.006), 0, Math.PI * 2);
                ctx.stroke();

                const warmSide = lightDirection < 0 ? Math.PI : Math.PI * 1.55;
                const warmArc = ctx.createLinearGradient(x - radius, y, x + radius, y);
                if (lightDirection < 0) {
                    warmArc.addColorStop(0, `rgba(255, 158, 83, ${0.48 + warmth * 0.36})`);
                    warmArc.addColorStop(0.52, "rgba(255, 213, 151, 0.08)");
                    warmArc.addColorStop(1, "rgba(255, 213, 151, 0)");
                } else {
                    warmArc.addColorStop(0, "rgba(255, 213, 151, 0)");
                    warmArc.addColorStop(0.48, "rgba(255, 213, 151, 0.08)");
                    warmArc.addColorStop(1, `rgba(255, 158, 83, ${0.48 + warmth * 0.36})`);
                }
                ctx.strokeStyle = warmArc;
                ctx.lineWidth = thickness * (0.34 + warmth * 0.18);
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.arc(x, y, radius + thickness * 0.34, warmSide, warmSide + Math.PI * 0.46);
                ctx.stroke();
                ctx.restore();
            }

            function drawEarthPlanet({ x, y, radius, alpha = 1, night = false, nightAmount = 0, sunrise = false, warmth = 0, cityLights = false, lightDirection = -1, time = 0 }) {
                const texturedEarth = earthSpriteReady && earthSprite.complete && earthSprite.naturalWidth > 0;
                const darkness = Math.max(night ? 1 : 0, nightAmount);
                const warmLight = Math.max(sunrise ? 1 : 0, warmth);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.clip();
                if (texturedEarth) {
                    drawProjectedEarthTexture(x, y, radius, time);
                    if (warmLight > 0) {
                        ctx.fillStyle = `rgba(255, 154, 89, ${warmLight * 0.18})`;
                        ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
                    }
                } else {
                    const lightX = x + lightDirection * radius * 0.28;
                    const surface = ctx.createRadialGradient(lightX, y - radius * 0.34, radius * 0.12, x, y, radius * 1.1);
                    surface.addColorStop(0, warmLight > 0.35 ? "#7cd5e8" : "#91d9ee");
                    surface.addColorStop(0.44, warmLight > 0.35 ? "#3c87a2" : "#327ba0");
                    surface.addColorStop(1, "#0b2545");
                    ctx.fillStyle = surface;
                    ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);

                    const continents = [
                        [-0.36, -0.08, 0.28, 0.12, -0.34],
                        [-0.1, 0.16, 0.21, 0.1, 0.62],
                        [0.22, -0.21, 0.29, 0.13, 0.28],
                        [0.37, 0.12, 0.15, 0.08, -0.58],
                        [-0.42, 0.25, 0.16, 0.08, 0.15]
                    ];
                    ctx.fillStyle = warmLight > 0.35 ? "rgba(113, 166, 96, 0.76)" : "rgba(67, 146, 100, 0.72)";
                    for (const [dx, dy, rx, ry, angle] of continents) {
                        ctx.beginPath();
                        ctx.ellipse(x + radius * (dx + Math.sin(time * 0.035) * 0.025), y + radius * dy, radius * rx, radius * ry, angle, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.strokeStyle = "rgba(242, 252, 255, 0.34)";
                    ctx.lineWidth = Math.max(1.1, radius * 0.011);
                    for (let index = 0; index < 6; index += 1) {
                        ctx.beginPath();
                        ctx.ellipse(x + Math.sin(time * 0.08 + index) * radius * 0.1, y + (index - 2.5) * radius * 0.14, radius * (0.46 - index * 0.018), radius * 0.075, -0.2 + index * 0.12, Math.PI * 0.1, Math.PI * 1.06);
                        ctx.stroke();
                    }
                }

                if (darkness > 0.02) {
                    ctx.save();
                    ctx.globalAlpha = alpha * (0.2 + darkness * 0.8);
                    const lightX = x + lightDirection * radius * 0.46;
                    const terminator = ctx.createRadialGradient(
                        lightX,
                        y - radius * 0.18,
                        radius * 0.08,
                        lightX,
                        y,
                        radius * 1.34
                    );
                    terminator.addColorStop(0, "rgba(3, 9, 24, 0.03)");
                    terminator.addColorStop(0.45, "rgba(3, 9, 24, 0.12)");
                    terminator.addColorStop(0.76, "rgba(3, 9, 24, 0.48)");
                    terminator.addColorStop(1, "rgba(3, 9, 24, 0.94)");
                    ctx.fillStyle = terminator;
                    ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
                    ctx.restore();
                }
                if (cityLights && darkness > 0.3) {
                    ctx.save();
                    ctx.globalAlpha = alpha * smoothstep((darkness - 0.3) / 0.7);
                    ctx.fillStyle = "rgba(255, 204, 103, 0.78)";
                    for (let index = 0; index < 18; index += 1) {
                        const angle = index * 2.41;
                        const distance = radius * (0.14 + (index % 5) * 0.11);
                        ctx.beginPath();
                        ctx.arc(x + Math.cos(angle) * distance, y + Math.sin(angle) * distance, 1.1 + (index % 3) * 0.45, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
                ctx.restore();

                drawAtmosphereBand({
                    x,
                    y,
                    radius,
                    alpha: alpha * (texturedEarth ? 0.82 : 1),
                    warmth: warmLight,
                    darkness,
                    lightDirection
                });
            }

            function drawOrbitalScene(scene, alpha, time, travel = backgroundObjectProgress(), drawCelestial = true) {
                const earth = earthOrbitState(time);
                if (scene.key === "earthDay") {
                    const sun = risingCelestialPosition(earth, travel, 0.84, time);
                    if (drawCelestial) drawSun(sun.x, sun.y, 44, alpha * 0.52);
                    drawEarthPlanet({ ...earth, alpha, lightDirection: -0.7, time });
                } else if (scene.key === "terminator") {
                    const sun = risingCelestialPosition(earth, travel, 0.15, time);
                    if (drawCelestial) drawSun(sun.x, sun.y, 70, alpha * 0.68);
                    drawEarthPlanet({ ...earth, alpha, night: true, cityLights: true, lightDirection: -1, time });
                } else if (scene.key === "sunrise") {
                    const sun = risingCelestialPosition(earth, travel, 0.16, time);
                    if (drawCelestial) drawSun(sun.x, sun.y, 70, alpha * 0.9);
                    drawEarthPlanet({ ...earth, alpha, night: true, sunrise: true, lightDirection: -1, time });
                } else if (scene.key === "moonPass") {
                    const moon = risingCelestialPosition(earth, travel, 0.72, time);
                    if (drawCelestial) drawMoon(moon.x, moon.y, 62 + earth.approach * 12, alpha * 0.9, time);
                    drawEarthPlanet({ ...earth, alpha, night: true, lightDirection: -0.64, time });
                } else if (scene.key === "aurora") {
                    drawEarthPlanet({ ...earth, alpha, lightDirection: -0.44, time });
                } else if (scene.key === "highOrbit") {
                    const moon = risingCelestialPosition(earth, travel, 0.2, time);
                    if (drawCelestial) drawMoon(moon.x, moon.y, 34, alpha * 0.7, time);
                    drawEarthPlanet({ ...earth, alpha, night: true, lightDirection: 1, time });
                } else {
                    drawEarthPlanet({ ...earth, alpha, night: true, cityLights: true, lightDirection: 1, time });
                }
            }

            function drawISSBackground() {
                const damageIndex = ISS_DAMAGE_LEVELS.get(state.level);
                if (damageIndex === undefined) return;
                const sprite = issSprites[damageIndex];
                if (!sprite.complete || !sprite.naturalWidth) return;
                const time = state.survivalTime;
                const travel = backgroundObjectProgress();
                const y = -ISS_DRAW_SIZE * 0.54 + travel * (WORLD.height + ISS_DRAW_SIZE * 1.08);
                ctx.save();
                ctx.globalAlpha = 1;
                ctx.translate(WORLD.width * 0.5 + Math.sin(time * 0.034 + damageIndex) * 54, y);
                ctx.rotate(Math.sin(time * 0.026 + damageIndex) * 0.022);
                ctx.drawImage(sprite, -ISS_DRAW_SIZE / 2, -ISS_DRAW_SIZE / 2, ISS_DRAW_SIZE, ISS_DRAW_SIZE);
                ctx.restore();
            }

            function drawReentryBackground() {
                const progress = clamp(state.reentry.timer / state.reentry.duration, 0, 1);
                const skyMix = smoothstep((progress - 0.56) / 0.36);
                const atmosphericFlight = smoothstep((progress - 0.68) / 0.25);
                const plasma = reentryPlasmaProgress(progress);
                const blackout = smoothstep((progress - 0.43) / 0.1) * (1 - smoothstep((progress - 0.67) / 0.12));
                const orbitEarth = earthOrbitState(state.survivalTime);
                const earthRadius = orbitEarth.radius + progress * 540;
                const closeEarthY = orbitEarth.y - progress * 92;
                const flightEarthY = WORLD.height + earthRadius * 0.7;
                const earth = {
                    x: WORLD.width * 0.5 + Math.sin(state.survivalTime * 0.05) * (12 - skyMix * 8),
                    y: closeEarthY + (flightEarthY - closeEarthY) * atmosphericFlight,
                    radius: earthRadius
                };
                const horizon = earth.y - earth.radius;
                const space = ctx.createLinearGradient(0, 0, 0, WORLD.height);
                space.addColorStop(0, "#030713");
                space.addColorStop(0.58, "#15162c");
                space.addColorStop(1, "#593343");
                ctx.fillStyle = space;
                ctx.fillRect(0, 0, WORLD.width, WORLD.height);
                if (skyMix > 0) {
                    const sky = ctx.createLinearGradient(0, 0, 0, WORLD.height);
                    sky.addColorStop(0, "#105078");
                    sky.addColorStop(0.52, "#3d91b4");
                    sky.addColorStop(1, "#a7ddea");
                    ctx.save();
                    ctx.globalAlpha = skyMix;
                    ctx.fillStyle = sky;
                    ctx.fillRect(0, 0, WORLD.width, WORLD.height);
                    ctx.restore();
                }
                drawStars(state.survivalTime * 0.35, 1 - skyMix);
                drawSun(WORLD.width * 0.13 + progress * 72, horizon + 80 - skyMix * 150, 66, 1);
                drawEarthPlanet({
                    ...earth,
                    alpha: 1,
                    sunrise: true,
                    nightAmount: Math.max(0, 0.8 - progress * 1.12),
                    warmth: Math.max(0.16, 1 - skyMix * 0.75),
                    lightDirection: -1,
                    time: state.survivalTime
                });

                if (skyMix > 0.06) {
                    ctx.save();
                    ctx.globalAlpha = skyMix * 0.34;
                    ctx.strokeStyle = "rgba(242, 252, 255, 0.82)";
                    ctx.lineCap = "round";
                    for (let index = 0; index < 9; index += 1) {
                        const y = ((index * 143 + state.survivalTime * (58 + index * 3)) % (WORLD.height + 220)) - 110;
                        const x = 40 + ((index * 97) % (WORLD.width - 80));
                        ctx.lineWidth = 8 + (index % 4) * 5;
                        ctx.beginPath();
                        ctx.moveTo(x - 52 - skyMix * 35, y - 18);
                        ctx.bezierCurveTo(x - 16, y + 4, x + 28, y - 8, x + 72 + skyMix * 42, y + 22);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                ctx.save();
                ctx.globalCompositeOperation = "lighter";
                ctx.globalAlpha = plasma * 0.88;
                const streakCount = 22;
                for (let index = 0; index < streakCount; index += 1) {
                    const x = (index * 73 + state.survivalTime * (45 + index * 3)) % (WORLD.width + 60) - 30;
                    const y = PLAY_TOP + ((index * 119 + state.survivalTime * 155) % 590);
                    const length = 30 + (index % 5) * 14 + plasma * 84;
                    const flare = ctx.createLinearGradient(x, y, x - 18, y - length);
                    flare.addColorStop(0, "rgba(255, 237, 176, 0)");
                    flare.addColorStop(0.48, "rgba(255, 126, 63, 0.56)");
                    flare.addColorStop(1, "rgba(255, 239, 194, 0.16)");
                    ctx.strokeStyle = flare;
                    ctx.lineWidth = 1.4 + (index % 3) * 0.8;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x - 18, y - length);
                    ctx.stroke();
                }
                ctx.restore();

                if (blackout > 0) {
                    const blackoutVignette = ctx.createRadialGradient(WORLD.width * 0.5, WORLD.height * 0.48, 70, WORLD.width * 0.5, WORLD.height * 0.48, WORLD.width * 0.82);
                    blackoutVignette.addColorStop(0, `rgba(16, 8, 20, ${blackout * 0.08})`);
                    blackoutVignette.addColorStop(1, `rgba(3, 4, 13, ${blackout * 0.56})`);
                    ctx.fillStyle = blackoutVignette;
                    ctx.fillRect(0, 0, WORLD.width, WORLD.height);
                }
            }

            function drawBackground() {
                const reentryCinematic = state.mode === "reentry" &&
                    state.reentry.clearanceTimer >= state.reentry.clearanceDuration;
                if (reentryCinematic || state.mode === "won") {
                    drawReentryBackground();
                    return;
                }
                const time = state.survivalTime;
                const scene = backgroundSceneForLevel();
                const blend = sceneBlend();
                const accentScene = blend > 0.5 ? backgroundSceneForLevel(state.level + 1) : scene;
                const cycle = dayCycleState(time);
                const earth = earthOrbitState(time);
                drawDayCycleGradient(cycle);
                drawStars(time, 0.18 + cycle.nightAmount * 0.82);
                drawDayCycleCelestials(earth, cycle, time);
                drawEarthPlanet({
                    ...earth,
                    alpha: 1,
                    nightAmount: cycle.nightAmount,
                    warmth: cycle.warmth,
                    cityLights: cycle.nightAmount > 0.3,
                    lightDirection: cycle.lightDirection,
                    time
                });
                drawISSBackground();
            }

            function drawSolarPanel(x, y, width, height, columns = 4, rows = 2, color = "#1c5d9d") {
                ctx.save();
                ctx.fillStyle = color;
                ctx.strokeStyle = "rgba(210, 240, 255, 0.82)";
                ctx.lineWidth = Math.max(1, height * 0.09);
                ctx.beginPath();
                ctx.roundRect(x, y, width, height, Math.min(2.5, height * 0.14));
                ctx.fill();
                ctx.stroke();
                ctx.strokeStyle = "rgba(113, 190, 246, 0.7)";
                ctx.lineWidth = Math.max(0.7, height * 0.045);
                for (let column = 1; column < columns; column += 1) {
                    const cellX = x + width * column / columns;
                    ctx.beginPath();
                    ctx.moveTo(cellX, y);
                    ctx.lineTo(cellX, y + height);
                    ctx.stroke();
                }
                for (let row = 1; row < rows; row += 1) {
                    const cellY = y + height * row / rows;
                    ctx.beginPath();
                    ctx.moveTo(x, cellY);
                    ctx.lineTo(x + width, cellY);
                    ctx.stroke();
                }
                ctx.restore();
            }

            function drawSatellite(debris) {
                const r = debris.r;
                const variant = debris.satelliteVariant ?? 0;
                const outline = "rgba(6, 17, 31, 0.88)";
                ctx.save();
                ctx.lineJoin = "round";
                ctx.lineCap = "round";

                if (variant === 0) {
                    const wingWidth = r * 1.28;
                    const wingHeight = r * 0.56;
                    drawSolarPanel(-r * 2.02, -wingHeight / 2, wingWidth, wingHeight, 4, 2);
                    drawSolarPanel(r * 0.74, -wingHeight / 2, wingWidth, wingHeight, 4, 2);
                    ctx.strokeStyle = "#c8d3d8";
                    ctx.lineWidth = r * 0.1;
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.72, 0);
                    ctx.lineTo(r * 0.72, 0);
                    ctx.stroke();
                    const bus = ctx.createLinearGradient(-r * 0.55, -r * 0.48, r * 0.58, r * 0.48);
                    bus.addColorStop(0, "#fff1b0");
                    bus.addColorStop(0.5, "#c9943f");
                    bus.addColorStop(1, "#765027");
                    ctx.fillStyle = bus;
                    ctx.strokeStyle = outline;
                    ctx.lineWidth = Math.max(1.4, r * 0.1);
                    ctx.beginPath();
                    ctx.roundRect(-r * 0.58, -r * 0.48, r * 1.16, r * 0.96, r * 0.12);
                    ctx.fill();
                    ctx.stroke();
                    ctx.strokeStyle = "#e9f2f3";
                    ctx.lineWidth = Math.max(1.2, r * 0.08);
                    ctx.beginPath();
                    ctx.moveTo(0, -r * 0.48);
                    ctx.lineTo(0, -r * 1.02);
                    ctx.stroke();
                    ctx.fillStyle = "#d8e6e9";
                    ctx.strokeStyle = outline;
                    ctx.beginPath();
                    ctx.ellipse(0, -r * 1.06, r * 0.52, r * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else if (variant === 1) {
                    drawSolarPanel(-r * 1.85, r * 0.36, r * 3.7, r * 0.54, 7, 2, "#244f91");
                    ctx.fillStyle = "#dce8eb";
                    ctx.strokeStyle = outline;
                    ctx.lineWidth = Math.max(1.4, r * 0.1);
                    ctx.beginPath();
                    ctx.roundRect(-r * 0.48, -r * 1.0, r * 0.96, r * 1.68, r * 0.32);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = "#f2b84b";
                    ctx.fillRect(-r * 0.37, -r * 0.55, r * 0.74, r * 0.3);
                    ctx.fillStyle = "#112f55";
                    ctx.beginPath();
                    ctx.arc(0, r * 0.52, r * 0.27, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = "#65dcff";
                    ctx.beginPath();
                    ctx.arc(-r * 0.07, r * 0.46, r * 0.1, 0, Math.PI * 2);
                    ctx.fill();
                } else if (variant === 2) {
                    for (let arm = 0; arm < 4; arm += 1) {
                        ctx.save();
                        ctx.rotate(Math.PI / 4 + arm * Math.PI / 2);
                        ctx.strokeStyle = "#d6e1e3";
                        ctx.lineWidth = r * 0.09;
                        ctx.beginPath();
                        ctx.moveTo(r * 0.38, 0);
                        ctx.lineTo(r * 0.72, 0);
                        ctx.stroke();
                        drawSolarPanel(r * 0.68, -r * 0.22, r * 0.92, r * 0.44, 3, 2, "#225c99");
                        ctx.restore();
                    }
                    ctx.fillStyle = "#d2a04f";
                    ctx.strokeStyle = outline;
                    ctx.lineWidth = Math.max(1.4, r * 0.1);
                    ctx.beginPath();
                    for (let point = 0; point < 6; point += 1) {
                        const angle = -Math.PI / 2 + point * Math.PI / 3;
                        const x = Math.cos(angle) * r * 0.58;
                        const y = Math.sin(angle) * r * 0.58;
                        if (point === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = "#edf5f3";
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 0.23, 0, Math.PI * 2);
                    ctx.fill();
                } else if (variant === 3) {
                    drawSolarPanel(-r * 1.85, r * 0.38, r * 1.35, r * 0.5, 4, 2, "#234f90");
                    drawSolarPanel(r * 0.5, r * 0.38, r * 1.35, r * 0.5, 4, 2, "#234f90");
                    const tube = ctx.createLinearGradient(-r * 0.5, 0, r * 0.5, 0);
                    tube.addColorStop(0, "#687984");
                    tube.addColorStop(0.45, "#edf3f1");
                    tube.addColorStop(1, "#8798a0");
                    ctx.fillStyle = tube;
                    ctx.strokeStyle = outline;
                    ctx.lineWidth = Math.max(1.4, r * 0.1);
                    ctx.beginPath();
                    ctx.roundRect(-r * 0.5, -r * 0.9, r, r * 1.45, r * 0.24);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = "#172d49";
                    ctx.beginPath();
                    ctx.ellipse(0, -r * 0.85, r * 0.48, r * 0.22, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = "#72dfff";
                    ctx.beginPath();
                    ctx.ellipse(-r * 0.08, -r * 0.9, r * 0.21, r * 0.09, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#d6a14e";
                    ctx.fillRect(-r * 0.42, r * 0.04, r * 0.84, r * 0.26);
                } else {
                    const panelScale = debris.kind === "cubesat" ? 0.72 : 1;
                    drawSolarPanel(-r * (1.55 * panelScale + 0.5), -r * 0.3, r * 1.1 * panelScale, r * 0.6, 3, 2, "#1f5a9b");
                    drawSolarPanel(r * 0.5, -r * 0.3, r * 1.1 * panelScale, r * 0.6, 3, 2, "#1f5a9b");
                    ctx.fillStyle = "#bf8f42";
                    ctx.strokeStyle = outline;
                    ctx.lineWidth = Math.max(1.4, r * 0.1);
                    ctx.beginPath();
                    ctx.roundRect(-r * 0.5, -r * 0.58, r, r * 1.16, r * 0.1);
                    ctx.fill();
                    ctx.stroke();
                    ctx.strokeStyle = "rgba(255, 239, 187, 0.78)";
                    ctx.lineWidth = Math.max(0.8, r * 0.05);
                    ctx.strokeRect(-r * 0.32, -r * 0.4, r * 0.64, r * 0.8);
                    ctx.strokeStyle = "#e7eff0";
                    ctx.lineWidth = r * 0.07;
                    ctx.beginPath();
                    ctx.moveTo(0, -r * 0.58);
                    ctx.lineTo(r * 0.2, -r * 1.24);
                    ctx.lineTo(r * 0.54, -r * 1.5);
                    ctx.stroke();
                }

                if (debris.kind === "operationalSatellite") {
                    ctx.fillStyle = Math.sin(state.survivalTime * 6 + debris.seed) > 0 ? "#8ef088" : "#eaffef";
                    ctx.beginPath();
                    ctx.arc(r * 0.28, r * 0.25, Math.max(1.5, r * 0.1), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            function drawDebrisAtmosphericGlow(debris) {
                if (state.mode !== "playing" || state.plasmaIntensity <= 0.02) return;
                const speed = Math.hypot(debris.vx, debris.vy);
                const speedFactor = clamp(speed / 360, 0.32, 1);
                const strength = state.plasmaIntensity * (0.54 + speedFactor * 0.46);
                const visibility = Math.pow(strength, 0.62);
                const heat = smoothstep((strength - 0.18) / 0.72);
                const r = debris.r;
                const wakeLength = r * (1.7 + strength * 2.2);
                const flowAngle = Math.atan2(debris.vy, debris.vx) + Math.PI / 2;
                const flicker = 0.92 + Math.sin(state.survivalTime * 18 + debris.seed) * 0.08;

                ctx.save();
                ctx.rotate(flowAngle);
                ctx.globalCompositeOperation = "lighter";

                const wake = ctx.createLinearGradient(0, -r * 1.25, 0, wakeLength);
                wake.addColorStop(0, heat > 0.36 ? "rgba(255, 244, 198, 0.78)" : "rgba(203, 251, 255, 0.72)");
                wake.addColorStop(0.28, heat > 0.36 ? "rgba(255, 126, 68, 0.46)" : "rgba(91, 214, 255, 0.38)");
                wake.addColorStop(1, "rgba(67, 154, 255, 0)");
                ctx.globalAlpha = visibility * (0.22 + strength * 0.34) * flicker;
                ctx.fillStyle = wake;
                ctx.beginPath();
                ctx.moveTo(0, -r * 1.36);
                ctx.bezierCurveTo(r * 0.92, -r * 1.08, r * 1.18, -r * 0.18, r * 0.78, r * 0.68);
                ctx.bezierCurveTo(r * 0.48, r * 1.18, r * 0.34, wakeLength * 0.78, 0, wakeLength);
                ctx.bezierCurveTo(-r * 0.34, wakeLength * 0.78, -r * 0.48, r * 1.18, -r * 0.78, r * 0.68);
                ctx.bezierCurveTo(-r * 1.18, -r * 0.18, -r * 0.92, -r * 1.08, 0, -r * 1.36);
                ctx.closePath();
                ctx.fill();

                ctx.globalAlpha = visibility * (0.4 + strength * 0.45);
                ctx.strokeStyle = heat > 0.34 ? "rgba(255, 196, 112, 0.94)" : "rgba(190, 248, 255, 0.88)";
                ctx.lineWidth = Math.max(1, r * (0.1 + strength * 0.09));
                ctx.lineCap = "round";
                ctx.shadowColor = heat > 0.34 ? "#ff7448" : "#73e6ff";
                ctx.shadowBlur = 4 + strength * 9;
                ctx.beginPath();
                ctx.arc(0, -r * 0.12, r * (1.02 + strength * 0.12), Math.PI * 1.08, Math.PI * 1.92);
                ctx.stroke();

                if (heat > 0.18) {
                    ctx.globalAlpha = visibility * heat * 0.68;
                    ctx.strokeStyle = "rgba(255, 91, 53, 0.78)";
                    ctx.lineWidth = Math.max(1, r * 0.09);
                    ctx.shadowColor = "#ff5739";
                    ctx.shadowBlur = 7;
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.62, -r * 0.76);
                    ctx.quadraticCurveTo(0, -r * 1.2, r * 0.62, -r * 0.76);
                    ctx.stroke();
                }
                ctx.restore();
            }

            function getDebrisLaserGlowTexture() {
                if (debrisLaserGlowTexture) return debrisLaserGlowTexture;
                const texture = document.createElement("canvas");
                texture.width = 128;
                texture.height = 128;
                const glowCtx = texture.getContext("2d");
                const glow = glowCtx.createRadialGradient(64, 64, 8, 64, 64, 64);
                glow.addColorStop(0, "rgba(224, 255, 255, 0.82)");
                glow.addColorStop(0.36, "rgba(97, 216, 255, 0.46)");
                glow.addColorStop(1, "rgba(65, 177, 255, 0)");
                glowCtx.fillStyle = glow;
                glowCtx.fillRect(0, 0, 128, 128);
                debrisLaserGlowTexture = texture;
                return debrisLaserGlowTexture;
            }

            function drawDebris(debris) {
                ctx.save();
                ctx.translate(debris.x, debris.y);
                const r = debris.r;
                const fuelHeat = debris.kind === "fuelTank" ? clamp(debris.laserHeat, 0, 1) : 0;
                drawDebrisAtmosphericGlow(debris);
                if (debris.laserGlow > 0) {
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    ctx.globalAlpha = clamp(debris.laserGlow / 0.28, 0, 1);
                    const glowSize = r * 4.7;
                    ctx.drawImage(getDebrisLaserGlowTexture(), -glowSize / 2, -glowSize / 2, glowSize, glowSize);
                    ctx.restore();
                }
                if (fuelHeat > 0) {
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    ctx.globalAlpha = fuelHeat;
                    const heatGlow = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 2.25);
                    heatGlow.addColorStop(0, "rgba(255, 242, 178, 0.74)");
                    heatGlow.addColorStop(0.35, "rgba(255, 87, 45, 0.42)");
                    heatGlow.addColorStop(1, "rgba(255, 52, 32, 0)");
                    ctx.fillStyle = heatGlow;
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 2.25, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                ctx.rotate(debris.rot);
                ctx.globalAlpha = debris.flash > 0 ? 1 : 0.92;
                const metal = debris.kind === "chunk" ? "#aeb9c2" :
                    debris.kind === "fuelTank" ? "#d9d2bb" :
                    debris.kind === "antenna" ? "#c5d0d9" :
                    debris.kind === "foil" ? "rgba(199, 229, 245, 0.66)" :
                    debris.kind === "panel" || debris.kind === "solarWing" ? "#7f96a5" :
                    debris.kind === "satellite" || debris.kind === "cubesat" || debris.kind === "operationalSatellite" ? "#d6c29b" :
                    "#dbe7f2";
                ctx.fillStyle = metal;
                ctx.strokeStyle = debris.laserGlow > 0 ? "#9cefff" : debris.flash > 0 ? "#ffffff" : "rgba(9, 16, 28, 0.72)";
                ctx.lineWidth = Math.max(1.4, r * 0.12);

                if (debris.kind === "chunk") {
                    ctx.beginPath();
                    for (let i = 0; i < 8; i += 1) {
                        const angle = i / 8 * Math.PI * 2;
                        const wobble = 0.72 + 0.28 * Math.sin(debris.seed + i * 1.7);
                        const px = Math.cos(angle) * r * wobble;
                        const py = Math.sin(angle) * r * (0.66 + 0.22 * Math.cos(debris.seed + i));
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.strokeStyle = "rgba(255, 238, 185, 0.35)";
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.44, -r * 0.18);
                    ctx.lineTo(r * 0.48, r * 0.12);
                    ctx.stroke();
                } else if (debris.kind === "fuelTank") {
                    const tank = ctx.createLinearGradient(-r * 1.05, 0, r * 1.05, 0);
                    tank.addColorStop(0, "#797f86");
                    tank.addColorStop(0.28, "#eee2c3");
                    tank.addColorStop(0.72, "#d6c69b");
                    tank.addColorStop(1, "#6d747c");
                    ctx.fillStyle = tank;
                    ctx.beginPath();
                    ctx.roundRect(-r * 1.05, -r * 0.46, r * 2.1, r * 0.92, r * 0.42);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = "#ff9f43";
                    ctx.fillRect(-r * 0.22, -r * 0.45, r * 0.18, r * 0.9);
                    ctx.fillRect(r * 0.2, -r * 0.45, r * 0.18, r * 0.9);
                    ctx.strokeStyle = "rgba(255, 235, 178, 0.72)";
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.82, -r * 0.1);
                    ctx.lineTo(r * 0.82, -r * 0.1);
                    ctx.stroke();
                    if (fuelHeat > 0) {
                        ctx.save();
                        ctx.globalCompositeOperation = "lighter";
                        ctx.globalAlpha = fuelHeat * 0.84;
                        ctx.fillStyle = "#ff4d2f";
                        ctx.beginPath();
                        ctx.roundRect(-r * 1.05, -r * 0.46, r * 2.1, r * 0.92, r * 0.42);
                        ctx.fill();
                        ctx.strokeStyle = "#fff1ba";
                        ctx.lineWidth = Math.max(1.4, r * 0.1);
                        ctx.stroke();
                        ctx.restore();
                    }
                } else if (debris.kind === "antenna") {
                    ctx.strokeStyle = "#d9edf8";
                    ctx.lineWidth = Math.max(2, r * 0.18);
                    ctx.beginPath();
                    ctx.moveTo(-r * 1.9, 0);
                    ctx.lineTo(r * 1.9, 0);
                    ctx.moveTo(-r * 0.65, -r * 0.55);
                    ctx.lineTo(r * 0.65, r * 0.55);
                    ctx.moveTo(-r * 0.65, r * 0.55);
                    ctx.lineTo(r * 0.65, -r * 0.55);
                    ctx.stroke();
                    ctx.fillStyle = "#ffcf6d";
                    for (const px of [-1.35, 0, 1.35]) {
                        ctx.beginPath();
                        ctx.arc(px * r, 0, r * 0.16, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (debris.kind === "panel" || debris.kind === "solarWing") {
                    const width = debris.kind === "solarWing" ? r * 3.25 : r * 2.48;
                    const height = debris.kind === "solarWing" ? r * 0.72 : r * 0.84;
                    ctx.fillRect(-width / 2, -height / 2, width, height);
                    ctx.strokeRect(-width / 2, -height / 2, width, height);
                    ctx.fillStyle = "rgba(78, 155, 223, 0.78)";
                    const cells = debris.kind === "solarWing" ? 6 : 4;
                    for (let i = 0; i < cells; i += 1) {
                        const cellWidth = width / cells;
                        ctx.fillRect(-width / 2 + i * cellWidth + cellWidth * 0.16, -height * 0.32, cellWidth * 0.68, height * 0.64);
                    }
                    ctx.strokeStyle = "rgba(209, 236, 255, 0.42)";
                    ctx.beginPath();
                    ctx.moveTo(-width * 0.44, 0);
                    ctx.lineTo(width * 0.44, 0);
                    ctx.stroke();
                    if (debris.kind === "solarWing") {
                        ctx.strokeStyle = "rgba(255, 255, 255, 0.42)";
                        ctx.beginPath();
                        ctx.moveTo(-width * 0.12, -height * 0.5);
                        ctx.lineTo(width * 0.04, height * 0.5);
                        ctx.stroke();
                    }
                } else if (debris.kind === "foil") {
                    ctx.fillStyle = "rgba(192, 228, 243, 0.48)";
                    ctx.strokeStyle = "rgba(232, 248, 255, 0.72)";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-r * 1.25, -r * 0.35);
                    ctx.lineTo(-r * 0.45, -r * 0.72);
                    ctx.lineTo(r * 1.2, -r * 0.28);
                    ctx.lineTo(r * 0.7, r * 0.55);
                    ctx.lineTo(-r * 1.05, r * 0.5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.strokeStyle = "rgba(97, 216, 255, 0.5)";
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.9, 0);
                    ctx.quadraticCurveTo(-r * 0.1, -r * 0.35, r * 0.78, r * 0.08);
                    ctx.stroke();
                } else if (debris.kind === "battery") {
                    ctx.fillStyle = "#dbe5ea";
                    ctx.fillRect(-r * 0.62, -r, r * 1.24, r * 2);
                    ctx.strokeRect(-r * 0.62, -r, r * 1.24, r * 2);
                    ctx.fillStyle = "#8ef088";
                    ctx.fillRect(-r * 0.38, -r * 0.55, r * 0.76, r * 0.28);
                    ctx.fillStyle = "#ffcf6d";
                    ctx.fillRect(-r * 0.38, r * 0.2, r * 0.76, r * 0.28);
                    ctx.fillStyle = "#aeb9c2";
                    ctx.fillRect(-r * 0.28, -r * 1.22, r * 0.56, r * 0.22);
                } else if (debris.kind === "shard") {
                    ctx.fillStyle = "#dcefff";
                    ctx.beginPath();
                    ctx.moveTo(0, -r * 1.65);
                    ctx.lineTo(r * 0.46, r * 0.18);
                    ctx.lineTo(0, r * 1.25);
                    ctx.lineTo(-r * 0.38, r * 0.05);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.strokeStyle = "rgba(97, 216, 255, 0.78)";
                    ctx.beginPath();
                    ctx.moveTo(0, -r);
                    ctx.lineTo(0, r * 0.72);
                    ctx.stroke();
                } else if (SATELLITE_KINDS.has(debris.kind)) {
                    drawSatellite(debris);
                }
                ctx.restore();
            }

            function drawAstronaut(astronaut) {
                const bob = Math.sin(astronaut.age * 2.2 + astronaut.seed) * 0.12;
                const sprite = astronautSprites[astronaut.spriteIndex] || astronautSprites[0];
                ctx.save();
                ctx.translate(astronaut.x, astronaut.y);
                ctx.rotate(bob);
                ctx.globalCompositeOperation = "lighter";
                const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, astronaut.r * 1.8);
                glow.addColorStop(0, "rgba(235, 255, 244, 0.72)");
                glow.addColorStop(0.5, "rgba(142, 240, 136, 0.2)");
                glow.addColorStop(1, "rgba(142, 240, 136, 0)");
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(0, 0, astronaut.r * 1.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalCompositeOperation = "source-over";
                if (sprite?.ready && sprite.complete && sprite.naturalWidth > 0) {
                    const spriteHeight = astronaut.r * 3.7;
                    const spriteWidth = spriteHeight * sprite.naturalWidth / sprite.naturalHeight;
                    ctx.drawImage(sprite, -spriteWidth / 2, -spriteHeight / 2, spriteWidth, spriteHeight);
                    ctx.restore();
                    return;
                }
                ctx.strokeStyle = "rgba(235, 247, 255, 0.88)";
                ctx.lineWidth = 3;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(-5, 5);
                ctx.lineTo(-11, 13);
                ctx.moveTo(5, 5);
                ctx.lineTo(11, 13);
                ctx.moveTo(-7, -1);
                ctx.lineTo(-14, 4);
                ctx.moveTo(7, -1);
                ctx.lineTo(14, 4);
                ctx.stroke();
                ctx.fillStyle = "#f4f7f1";
                ctx.strokeStyle = "rgba(20, 45, 68, 0.9)";
                ctx.lineWidth = 1.6;
                ctx.fillRect(-7, -2, 14, 15);
                ctx.strokeRect(-7, -2, 14, 15);
                ctx.fillStyle = "#9bb2bd";
                ctx.fillRect(-10, 0, 3, 10);
                ctx.strokeRect(-10, 0, 3, 10);
                ctx.fillStyle = "#f5f7f4";
                ctx.beginPath();
                ctx.arc(0, -9, 8.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = "#1d6f94";
                ctx.beginPath();
                ctx.arc(0, -9.5, 5.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ffcf6d";
                ctx.fillRect(-3.2, 3, 6.4, 2.4);
                ctx.restore();
            }

            function drawAtmosphericPlasma(strength, heat) {
                const visibility = Math.pow(clamp(strength, 0, 1), 0.55);
                if (visibility <= 0.002) return;
                const pulse = 0.94 + Math.sin(state.survivalTime * 17) * 0.06;
                const orangeMix = smoothstep((heat - 0.28) / 0.6);
                const wakeLength = 38 + strength * 72;
                const hullWidth = 28 + strength * 5;
                const wakeWidth = 8 + strength * 7;

                ctx.save();
                ctx.globalCompositeOperation = "lighter";

                ctx.save();
                ctx.scale(1, 1.42);
                const ionHalo = ctx.createRadialGradient(0, -12, 3, 0, -3, 48 + strength * 14);
                ionHalo.addColorStop(0, orangeMix > 0.38 ? "rgba(255, 183, 108, 0.38)" : "rgba(210, 252, 255, 0.3)");
                ionHalo.addColorStop(0.48, orangeMix > 0.38 ? "rgba(255, 76, 46, 0.18)" : "rgba(87, 207, 255, 0.12)");
                ionHalo.addColorStop(1, "rgba(66, 154, 255, 0)");
                ctx.globalAlpha = visibility * (0.38 + strength * 0.24) * pulse;
                ctx.fillStyle = ionHalo;
                ctx.beginPath();
                ctx.arc(0, -3, 48 + strength * 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                const envelope = ctx.createLinearGradient(0, -62, 0, wakeLength);
                envelope.addColorStop(0, "rgba(226, 255, 255, 0.94)");
                envelope.addColorStop(0.18, "rgba(100, 225, 255, 0.52)");
                envelope.addColorStop(0.52, orangeMix > 0.42 ? "rgba(255, 126, 72, 0.24)" : "rgba(69, 179, 255, 0.2)");
                envelope.addColorStop(1, "rgba(60, 154, 255, 0)");
                ctx.globalAlpha = visibility * (0.14 + strength * 0.23) * pulse;
                ctx.fillStyle = envelope;
                ctx.beginPath();
                ctx.moveTo(0, -60 - strength * 4);
                ctx.bezierCurveTo(hullWidth * 0.54, -57, hullWidth * 0.92, -30, hullWidth, -4);
                ctx.bezierCurveTo(hullWidth * 1.04, 17, hullWidth * 0.72, 37, wakeWidth, 54);
                ctx.bezierCurveTo(wakeWidth * 0.8, 71, wakeWidth * 0.42, wakeLength * 0.9, 0, wakeLength);
                ctx.bezierCurveTo(-wakeWidth * 0.42, wakeLength * 0.9, -wakeWidth * 0.8, 71, -wakeWidth, 54);
                ctx.bezierCurveTo(-hullWidth * 0.72, 37, -hullWidth * 1.04, 17, -hullWidth, -4);
                ctx.bezierCurveTo(-hullWidth * 0.92, -30, -hullWidth * 0.54, -57, 0, -60 - strength * 4);
                ctx.closePath();
                ctx.fill();

                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                ctx.shadowColor = orangeMix > 0.42 ? "#ff7147" : "#79e8ff";
                ctx.shadowBlur = 7 + strength * 11;
                ctx.lineWidth = 1.6 + strength * 2.2;
                for (const side of [-1, 1]) {
                    const leadingEdge = ctx.createLinearGradient(0, -56, side * hullWidth, 34);
                    leadingEdge.addColorStop(0, "rgba(248, 255, 237, 0.94)");
                    leadingEdge.addColorStop(0.34, orangeMix > 0.34 ? "rgba(255, 177, 86, 0.94)" : "rgba(145, 241, 255, 0.88)");
                    leadingEdge.addColorStop(0.74, orangeMix > 0.34 ? "rgba(255, 70, 42, 0.72)" : "rgba(80, 199, 255, 0.54)");
                    leadingEdge.addColorStop(1, "rgba(63, 159, 255, 0)");
                    ctx.globalAlpha = visibility * (0.38 + strength * 0.5) * pulse;
                    ctx.strokeStyle = leadingEdge;
                    ctx.beginPath();
                    ctx.moveTo(side * 2, -56);
                    ctx.bezierCurveTo(side * 17, -50, side * 23, -29, side * hullWidth, -7);
                    ctx.bezierCurveTo(side * (hullWidth + 1), 12, side * 22, 30, side * 12, 46);
                    ctx.bezierCurveTo(side * 10, 61, side * wakeWidth, wakeLength * 0.76, side * 3, wakeLength);
                    ctx.stroke();
                }

                ctx.globalAlpha = visibility * (0.32 + strength * 0.42);
                ctx.strokeStyle = orangeMix > 0.48 ? "rgba(255, 224, 154, 0.96)" : "rgba(226, 255, 255, 0.9)";
                ctx.lineWidth = 1.5 + strength * 1.7;
                ctx.shadowBlur = 6 + strength * 8;
                ctx.beginPath();
                ctx.moveTo(-18 - strength * 3, -47);
                ctx.bezierCurveTo(-11, -64 - strength * 5, 11, -64 - strength * 5, 18 + strength * 3, -47);
                ctx.stroke();

                const noseBloomRadius = 19 + strength * 6;
                const noseBloom = ctx.createRadialGradient(0, -51, 1, 0, -49, noseBloomRadius);
                noseBloom.addColorStop(0, "rgba(255, 244, 209, 0.72)");
                noseBloom.addColorStop(0.3, orangeMix > 0.3 ? "rgba(255, 205, 126, 0.56)" : "rgba(165, 245, 255, 0.5)");
                noseBloom.addColorStop(1, "rgba(255, 91, 48, 0)");
                ctx.globalAlpha = visibility * (0.1 + orangeMix * 0.2) * pulse;
                ctx.fillStyle = noseBloom;
                ctx.beginPath();
                ctx.arc(0, -49, noseBloomRadius, 0, Math.PI * 2);
                ctx.fill();

                if (orangeMix > 0.16) {
                    ctx.globalAlpha = visibility * orangeMix * 0.72;
                    ctx.strokeStyle = "rgba(255, 247, 204, 0.9)";
                    ctx.lineWidth = 0.9 + strength * 0.9;
                    ctx.shadowColor = "#ffb26d";
                    ctx.shadowBlur = 6;
                    for (const side of [-1, 1]) {
                        ctx.beginPath();
                        ctx.moveTo(side * 3, -52);
                        ctx.bezierCurveTo(side * 13, -43, side * 19, -19, side * 22, 2);
                        ctx.bezierCurveTo(side * 20, 20, side * 13, 34, side * 8, 46);
                        ctx.stroke();
                    }
                }

                if (orangeMix > 0.08) {
                    const hotWake = ctx.createLinearGradient(0, 28, 0, wakeLength);
                    hotWake.addColorStop(0, "rgba(255, 225, 151, 0.72)");
                    hotWake.addColorStop(0.44, "rgba(255, 105, 58, 0.46)");
                    hotWake.addColorStop(1, "rgba(255, 75, 46, 0)");
                    ctx.globalAlpha = visibility * orangeMix * 0.7;
                    ctx.strokeStyle = hotWake;
                    ctx.lineWidth = 2 + strength * 2.4;
                    ctx.shadowColor = "#ff623d";
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.moveTo(0, 34);
                    ctx.bezierCurveTo(Math.sin(state.survivalTime * 12) * 3, 52, -3, wakeLength * 0.78, 0, wakeLength * 0.96);
                    ctx.stroke();

                    ctx.lineWidth = 1.1 + strength * 1.2;
                    for (let ribbon = 0; ribbon < 3; ribbon += 1) {
                        const side = ribbon % 2 === 0 ? -1 : 1;
                        const wobble = Math.sin(state.survivalTime * (8.5 + ribbon) + ribbon * 2.3) * (2 + strength * 4);
                        ctx.globalAlpha = visibility * orangeMix * (0.26 + ribbon * 0.08);
                        ctx.strokeStyle = ribbon === 1 ? "rgba(255, 211, 132, 0.7)" : "rgba(255, 83, 48, 0.62)";
                        ctx.beginPath();
                        ctx.moveTo(side * (10 + ribbon * 2), 16 + ribbon * 5);
                        ctx.bezierCurveTo(
                            side * (17 + strength * 7) + wobble,
                            38,
                            side * (10 + ribbon * 3) - wobble,
                            wakeLength * 0.7,
                            side * (3 + ribbon),
                            wakeLength * (0.86 + ribbon * 0.04)
                        );
                        ctx.stroke();
                    }
                }

                ctx.shadowBlur = 0;
                if (strength > 0.42) {
                    const sparkCount = 1 + Math.floor(strength * 5);
                    ctx.fillStyle = orangeMix > 0.42 ? "#ffd28d" : "#b7f6ff";
                    for (let index = 0; index < sparkCount; index += 1) {
                        const travel = (state.survivalTime * (0.62 + index * 0.04) + index * 0.19) % 1;
                        const sparkY = 28 + travel * wakeLength;
                        const sparkX = Math.sin(state.survivalTime * (8 + index) + index) * (5 + travel * strength * 13);
                        ctx.globalAlpha = visibility * (1 - travel) * 0.72;
                        ctx.beginPath();
                        ctx.arc(sparkX, sparkY, 0.9 + index % 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.restore();
            }

            function drawPlayer() {
                const player = state.player;
                const flicker = player.invulnerable > 0 && Math.floor(player.invulnerable * 18) % 2 === 0;
                if (flicker && state.mode === "playing") return;
                const input = state.lastInput;

                function drawFlame(points, power) {
                    if (power <= 0.04 || state.mode !== "playing") return;
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    const gradient = ctx.createLinearGradient(points[0].x, points[0].y, points[1].x, points[1].y);
                    gradient.addColorStop(0, "rgba(255, 246, 168, 0.78)");
                    gradient.addColorStop(0.48, "rgba(97, 216, 255, 0.56)");
                    gradient.addColorStop(1, "rgba(97, 216, 255, 0)");
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.moveTo(points[0].x, points[0].y);
                    ctx.lineTo(points[1].x, points[1].y);
                    ctx.lineTo(points[2].x, points[2].y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }

                ctx.save();
                ctx.translate(player.x, player.y);

                const lateEntry = state.plasmaIntensity;
                const reentryProgress = clamp(state.reentry.timer / state.reentry.duration, 0, 1);
                const cutscenePlasma = reentryPlasmaProgress(reentryProgress);
                const plasmaStrength = state.mode === "won" ? 0 : lateEntry;
                const plasmaHeat = state.mode === "reentry"
                    ? 0.2 + cutscenePlasma * 0.8
                    : 0.12 + lateEntry * 0.82;
                drawAtmosphericPlasma(plasmaStrength, plasmaHeat);

                const sidePower = Math.min(1, Math.abs(input.x));
                const verticalPower = Math.min(1, Math.abs(input.y));
                const sideNozzleX = SHIP_SPRITE_WIDTH * 0.46;
                const sideNozzleY = SHIP_SPRITE_HEIGHT * 0.14;
                const noseNozzleY = -SHIP_SPRITE_HEIGHT * 0.43;
                const tailNozzleY = SHIP_SPRITE_HEIGHT * 0.43;
                drawFlame([{ x: -sideNozzleX, y: sideNozzleY - 4 }, { x: -sideNozzleX - 16 - sidePower * 9, y: sideNozzleY + 1 }, { x: -sideNozzleX, y: sideNozzleY + 6 }], input.x > 0 ? sidePower : 0);
                drawFlame([{ x: sideNozzleX, y: sideNozzleY - 4 }, { x: sideNozzleX + 16 + sidePower * 9, y: sideNozzleY + 1 }, { x: sideNozzleX, y: sideNozzleY + 6 }], input.x < 0 ? sidePower : 0);
                drawFlame([{ x: -4, y: noseNozzleY }, { x: 0, y: noseNozzleY - 13 - verticalPower * 6 }, { x: 4, y: noseNozzleY }], input.y > 0 ? verticalPower : 0);
                drawFlame([{ x: -6, y: tailNozzleY }, { x: 0, y: tailNozzleY + 17 + verticalPower * 8 }, { x: 6, y: tailNozzleY }], input.y < 0 ? verticalPower : 0);

                if (shipSpriteReady && shipSprite.complete && shipSprite.naturalWidth > 0) {
                    ctx.drawImage(
                        shipSprite,
                        -SHIP_SPRITE_WIDTH / 2,
                        -SHIP_SPRITE_HEIGHT / 2,
                        SHIP_SPRITE_WIDTH,
                        SHIP_SPRITE_HEIGHT
                    );
                } else {
                    ctx.fillStyle = "#263a5d";
                    ctx.strokeStyle = "rgba(3, 10, 22, 0.78)";
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(-34, 9);
                    ctx.lineTo(-9, -9);
                    ctx.lineTo(-8, 9);
                    ctx.lineTo(-27, 20);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(34, 9);
                    ctx.lineTo(9, -9);
                    ctx.lineTo(8, 9);
                    ctx.lineTo(27, 20);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = "#7ab8ff";
                    ctx.beginPath();
                    ctx.moveTo(-27, 8);
                    ctx.lineTo(-14, 0);
                    ctx.lineTo(-12, 6);
                    ctx.lineTo(-25, 14);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(27, 8);
                    ctx.lineTo(14, 0);
                    ctx.lineTo(12, 6);
                    ctx.lineTo(25, 14);
                    ctx.closePath();
                    ctx.fill();

                    const hull = ctx.createLinearGradient(-12, -32, 12, 28);
                    hull.addColorStop(0, "#ffffff");
                    hull.addColorStop(0.38, "#d9f8ff");
                    hull.addColorStop(0.78, "#8eb8db");
                    hull.addColorStop(1, "#516f93");
                    ctx.fillStyle = hull;
                    ctx.strokeStyle = "rgba(3, 10, 22, 0.78)";
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(0, -34);
                    ctx.bezierCurveTo(11, -24, 13, -3, 8, 21);
                    ctx.quadraticCurveTo(0, 29, -8, 21);
                    ctx.bezierCurveTo(-13, -3, -11, -24, 0, -34);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = "#123052";
                    ctx.beginPath();
                    ctx.ellipse(0, -13, 6.6, 12.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#61d8ff";
                    ctx.beginPath();
                    ctx.ellipse(0, -15, 4, 7.5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#182842";
                    ctx.fillRect(-4.5, 20, 9, 8);
                    ctx.fillRect(-19, -3, 6, 9);
                    ctx.fillRect(13, -3, 6, 9);
                    ctx.fillRect(-3.5, -31, 7, 6);
                    ctx.strokeStyle = "rgba(151, 224, 255, 0.7)";
                    ctx.lineWidth = 1.4;
                    ctx.strokeRect(-4.5, 20, 9, 8);
