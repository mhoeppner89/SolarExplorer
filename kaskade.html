                    drawEarthPlanet({ ...earth, alpha, lightDirection: -0.7, time });
                } else if (scene.key === "terminator") {
                    const sun = risingCelestialPosition(earth, travel, 0.15, time);
                    if (drawCelestial) drawSun(sun.x, sun.y, 70, alpha * 0.68);
                    drawEarthPlanet({ ...earth, alpha, night: true, cityLights: true, lightDirection: -1, time });
                } else if (scene.key === "sunrise") {
                    const sun = risingCelestialPosition(earth, travel, 0.16, time);
                    if (drawCelestial) drawSun(sun.x, sun.y, 70, alpha * 0.9);
                    drawEarthPlanet({ ...earth, alpha, night: true, sunrise: true, lightDirection: -1, time });
                } else if (scene.key === "moonPass") {
                    const moon = risingCelestialPosition(earth, travel, 0.72, time);
                    if (drawCelestial) drawMoon(moon.x, moon.y, 62 + earth.approach * 12, alpha * 0.9, time);
                    drawEarthPlanet({ ...earth, alpha, night: true, lightDirection: -0.64, time });
                } else if (scene.key === "aurora") {
                    drawEarthPlanet({ ...earth, alpha, aurora: true, lightDirection: -0.44, time });
                } else if (scene.key === "highOrbit") {
                    const moon = risingCelestialPosition(earth, travel, 0.2, time);
                    if (drawCelestial) drawMoon(moon.x, moon.y, 34, alpha * 0.7, time);
                    drawEarthPlanet({ ...earth, alpha, night: true, lightDirection: 1, time });
                } else {
                    drawEarthPlanet({ ...earth, alpha, night: true, cityLights: true, lightDirection: 1, time });
                }
            }

            function drawISSBackground() {
                const damageIndex = ISS_DAMAGE_LEVELS.get(state.level);
                if (damageIndex === undefined) return;
                const sprite = issSprites[damageIndex];
                if (!sprite.complete || !sprite.naturalWidth) return;
                const time = state.survivalTime;
                const travel = backgroundObjectProgress();
                const y = -ISS_DRAW_SIZE * 0.54 + travel * (WORLD.height + ISS_DRAW_SIZE * 1.08);
                ctx.save();
                ctx.globalAlpha = 1;
                ctx.translate(WORLD.width * 0.5 + Math.sin(time * 0.034 + damageIndex) * 54, y);
                ctx.rotate(Math.sin(time * 0.026 + damageIndex) * 0.022);
                ctx.drawImage(sprite, -ISS_DRAW_SIZE / 2, -ISS_DRAW_SIZE / 2, ISS_DRAW_SIZE, ISS_DRAW_SIZE);
                ctx.restore();
            }

            function drawReentryBackground() {
                const progress = clamp(state.reentry.timer / state.reentry.duration, 0, 1);
                const orbitEarth = earthOrbitState(state.survivalTime);
                const earth = {
                    x: orbitEarth.x + Math.sin(state.survivalTime * 0.05) * 12,
                    y: orbitEarth.y - progress * 44,
                    radius: orbitEarth.radius + progress * 440
                };
                const horizon = earth.y - earth.radius;
                drawSpaceGradient({ key: "sunrise" });
                drawStars(state.survivalTime * 0.35);
                drawSun(WORLD.width * 0.15 + Math.sin(state.survivalTime * 0.03) * 48, horizon + 72, 66, 0.66 + progress * 0.22);
                drawEarthPlanet({
                    ...earth,
                    alpha: 1,
                    sunrise: true,
                    night: progress < 0.42,
                    lightDirection: -1,
                    time: state.survivalTime
                });
                ctx.save();
                ctx.globalCompositeOperation = "lighter";
                const streakCount = 16;
                for (let index = 0; index < streakCount; index += 1) {
                    const x = (index * 73 + state.survivalTime * (45 + index * 3)) % (WORLD.width + 60) - 30;
                    const y = PLAY_TOP + ((index * 119 + state.survivalTime * 155) % 590);
                    const length = 28 + (index % 5) * 13 + progress * 42;
                    const flare = ctx.createLinearGradient(x, y, x - 14, y - length);
                    flare.addColorStop(0, "rgba(255, 237, 176, 0)");
                    flare.addColorStop(0.55, "rgba(255, 159, 92, 0.34)");
                    flare.addColorStop(1, "rgba(255, 229, 181, 0.06)");
                    ctx.strokeStyle = flare;
                    ctx.lineWidth = 1.2 + (index % 3) * 0.65;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x - 14, y - length);
                    ctx.stroke();
                }
                ctx.restore();
            }

            function drawBackground() {
                if (state.mode === "reentry" || state.mode === "won") {
                    drawReentryBackground();
                    return;
                }
                const time = state.survivalTime;
                const scene = backgroundSceneForLevel();
                const blend = sceneBlend();
                const travel = backgroundObjectProgress();
                drawSpaceGradient(scene);
                if (blend > 0) drawSpaceGradient(backgroundSceneForLevel(state.level + 1), blend);
                drawStars(time);
                drawOrbitalScene(scene, 1, time, travel);
                if (blend > 0) drawOrbitalScene(backgroundSceneForLevel(state.level + 1), blend, time, travel, false);
                drawISSBackground();
            }

            function drawDebris(debris) {
                ctx.save();
                ctx.translate(debris.x, debris.y);
                ctx.rotate(debris.rot);
                const warning = (debris.kind === "satellite" || debris.kind === "cubesat") && debris.fuse < 0.85;
                ctx.globalAlpha = debris.flash > 0 || warning ? 1 : 0.92;
                const r = debris.r;
                const metal = debris.kind === "chunk" ? "#aeb9c2" :
                    debris.kind === "fuelTank" ? "#d9d2bb" :
                    debris.kind === "antenna" ? "#c5d0d9" :
                    debris.kind === "foil" ? "rgba(199, 229, 245, 0.66)" :
                    debris.kind === "panel" || debris.kind === "solarWing" ? "#7f96a5" :
                    debris.kind === "satellite" || debris.kind === "cubesat" || debris.kind === "operationalSatellite" ? "#d6c29b" :
                    "#dbe7f2";
                ctx.fillStyle = metal;
                ctx.strokeStyle = debris.flash > 0 ? "#ffffff" : "rgba(9, 16, 28, 0.72)";
                ctx.lineWidth = Math.max(1.4, r * 0.12);

                if (debris.kind === "chunk") {
                    ctx.beginPath();
                    for (let i = 0; i < 8; i += 1) {
                        const angle = i / 8 * Math.PI * 2;
                        const wobble = 0.72 + 0.28 * Math.sin(debris.seed + i * 1.7);
                        const px = Math.cos(angle) * r * wobble;
                        const py = Math.sin(angle) * r * (0.66 + 0.22 * Math.cos(debris.seed + i));
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.strokeStyle = "rgba(255, 238, 185, 0.35)";
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.44, -r * 0.18);
                    ctx.lineTo(r * 0.48, r * 0.12);
                    ctx.stroke();
                } else if (debris.kind === "fuelTank") {
                    const tank = ctx.createLinearGradient(-r * 1.05, 0, r * 1.05, 0);
                    tank.addColorStop(0, "#797f86");
                    tank.addColorStop(0.28, "#eee2c3");
                    tank.addColorStop(0.72, "#d6c69b");
                    tank.addColorStop(1, "#6d747c");
                    ctx.fillStyle = tank;
                    ctx.beginPath();
                    ctx.roundRect(-r * 1.05, -r * 0.46, r * 2.1, r * 0.92, r * 0.42);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = "#ff9f43";
                    ctx.fillRect(-r * 0.22, -r * 0.45, r * 0.18, r * 0.9);
                    ctx.fillRect(r * 0.2, -r * 0.45, r * 0.18, r * 0.9);
                    ctx.strokeStyle = "rgba(255, 235, 178, 0.72)";
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.82, -r * 0.1);
                    ctx.lineTo(r * 0.82, -r * 0.1);
                    ctx.stroke();
                } else if (debris.kind === "antenna") {
                    ctx.strokeStyle = "#d9edf8";
                    ctx.lineWidth = Math.max(2, r * 0.18);
                    ctx.beginPath();
                    ctx.moveTo(-r * 1.9, 0);
                    ctx.lineTo(r * 1.9, 0);
                    ctx.moveTo(-r * 0.65, -r * 0.55);
                    ctx.lineTo(r * 0.65, r * 0.55);
                    ctx.moveTo(-r * 0.65, r * 0.55);
                    ctx.lineTo(r * 0.65, -r * 0.55);
                    ctx.stroke();
                    ctx.fillStyle = "#ffcf6d";
                    for (const px of [-1.35, 0, 1.35]) {
                        ctx.beginPath();
                        ctx.arc(px * r, 0, r * 0.16, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (debris.kind === "panel" || debris.kind === "solarWing") {
                    const width = debris.kind === "solarWing" ? r * 3.25 : r * 2.48;
                    const height = debris.kind === "solarWing" ? r * 0.72 : r * 0.84;
                    ctx.fillRect(-width / 2, -height / 2, width, height);
                    ctx.strokeRect(-width / 2, -height / 2, width, height);
                    ctx.fillStyle = "rgba(78, 155, 223, 0.78)";
                    const cells = debris.kind === "solarWing" ? 6 : 4;
                    for (let i = 0; i < cells; i += 1) {
                        const cellWidth = width / cells;
                        ctx.fillRect(-width / 2 + i * cellWidth + cellWidth * 0.16, -height * 0.32, cellWidth * 0.68, height * 0.64);
                    }
                    ctx.strokeStyle = "rgba(209, 236, 255, 0.42)";
                    ctx.beginPath();
                    ctx.moveTo(-width * 0.44, 0);
                    ctx.lineTo(width * 0.44, 0);
                    ctx.stroke();
                    if (debris.kind === "solarWing") {
                        ctx.strokeStyle = "rgba(255, 255, 255, 0.42)";
                        ctx.beginPath();
                        ctx.moveTo(-width * 0.12, -height * 0.5);
                        ctx.lineTo(width * 0.04, height * 0.5);
                        ctx.stroke();
                    }
                } else if (debris.kind === "foil") {
                    ctx.fillStyle = "rgba(192, 228, 243, 0.48)";
                    ctx.strokeStyle = "rgba(232, 248, 255, 0.72)";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-r * 1.25, -r * 0.35);
                    ctx.lineTo(-r * 0.45, -r * 0.72);
                    ctx.lineTo(r * 1.2, -r * 0.28);
                    ctx.lineTo(r * 0.7, r * 0.55);
                    ctx.lineTo(-r * 1.05, r * 0.5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.strokeStyle = "rgba(97, 216, 255, 0.5)";
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.9, 0);
                    ctx.quadraticCurveTo(-r * 0.1, -r * 0.35, r * 0.78, r * 0.08);
                    ctx.stroke();
                } else if (debris.kind === "battery") {
                    ctx.fillStyle = "#dbe5ea";
                    ctx.fillRect(-r * 0.62, -r, r * 1.24, r * 2);
                    ctx.strokeRect(-r * 0.62, -r, r * 1.24, r * 2);
                    ctx.fillStyle = "#8ef088";
                    ctx.fillRect(-r * 0.38, -r * 0.55, r * 0.76, r * 0.28);
                    ctx.fillStyle = "#ffcf6d";
                    ctx.fillRect(-r * 0.38, r * 0.2, r * 0.76, r * 0.28);
                    ctx.fillStyle = "#aeb9c2";
                    ctx.fillRect(-r * 0.28, -r * 1.22, r * 0.56, r * 0.22);
                } else if (debris.kind === "shard") {
                    ctx.fillStyle = "#dcefff";
                    ctx.beginPath();
                    ctx.moveTo(0, -r * 1.65);
                    ctx.lineTo(r * 0.46, r * 0.18);
                    ctx.lineTo(0, r * 1.25);
                    ctx.lineTo(-r * 0.38, r * 0.05);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.strokeStyle = "rgba(97, 216, 255, 0.78)";
                    ctx.beginPath();
                    ctx.moveTo(0, -r);
                    ctx.lineTo(0, r * 0.72);
                    ctx.stroke();
                } else if (debris.kind === "operationalSatellite") {
                    const busWidth = r * 1.18;
                    const busHeight = r * 0.82;
                    const wingWidth = r * 1.08;
                    const wingHeight = r * 0.58;
                    ctx.fillStyle = "#1d5f9a";
                    ctx.fillRect(-r * 1.82, -wingHeight / 2, wingWidth, wingHeight);
                    ctx.fillRect(r * 0.74, -wingHeight / 2, wingWidth, wingHeight);
                    ctx.strokeStyle = "rgba(215, 241, 255, 0.66)";
                    ctx.lineWidth = Math.max(1, r * 0.07);
                    ctx.strokeRect(-r * 1.82, -wingHeight / 2, wingWidth, wingHeight);
                    ctx.strokeRect(r * 0.74, -wingHeight / 2, wingWidth, wingHeight);
                    ctx.strokeStyle = "rgba(119, 194, 255, 0.72)";
                    for (const offset of [-r * 1.82, r * 0.74]) {
                        for (let cell = 1; cell < 4; cell += 1) {
                            const cellX = offset + wingWidth * cell / 4;
                            ctx.beginPath();
                            ctx.moveTo(cellX, -wingHeight / 2);
                            ctx.lineTo(cellX, wingHeight / 2);
                            ctx.stroke();
                        }
                    }
                    const bus = ctx.createLinearGradient(-busWidth / 2, -busHeight / 2, busWidth / 2, busHeight / 2);
                    bus.addColorStop(0, "#f2f5f2");
                    bus.addColorStop(0.5, "#b5c3cb");
                    bus.addColorStop(1, "#647a88");
                    ctx.fillStyle = bus;
                    ctx.fillRect(-busWidth / 2, -busHeight / 2, busWidth, busHeight);
                    ctx.strokeStyle = "rgba(10, 25, 40, 0.82)";
                    ctx.strokeRect(-busWidth / 2, -busHeight / 2, busWidth, busHeight);
                    ctx.fillStyle = "#ffcf6d";
                    ctx.fillRect(-busWidth * 0.14, -busHeight * 0.42, busWidth * 0.28, busHeight * 0.16);
                    ctx.strokeStyle = "rgba(242, 247, 255, 0.78)";
                    ctx.beginPath();
                    ctx.moveTo(0, -busHeight / 2);
                    ctx.lineTo(0, -r * 1.34);
                    ctx.lineTo(r * 0.34, -r * 1.56);
                    ctx.stroke();
                    ctx.fillStyle = Math.sin(state.survivalTime * 6 + debris.seed) > 0 ? "#8ef088" : "#e7fff0";
                    ctx.beginPath();
                    ctx.arc(0, busHeight * 0.12, Math.max(1.8, r * 0.14), 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    const isCubesat = debris.kind === "cubesat";
                    const bodySize = isCubesat ? r * 0.86 : r * 1.04;
                    if (warning) {
                        ctx.save();
                        ctx.rotate(-debris.rot);
                        ctx.globalAlpha = 0.35 + 0.28 * Math.sin(state.survivalTime * 18);
                        ctx.strokeStyle = "#ff7d6e";
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(0, 0, r * 1.55, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.restore();
                    }
                    ctx.fillStyle = "#d6c29b";
                    ctx.fillRect(-bodySize / 2, -bodySize / 2, bodySize, bodySize);
                    ctx.strokeRect(-bodySize / 2, -bodySize / 2, bodySize, bodySize);
                    ctx.fillStyle = "#5d9bff";
                    const wingScale = isCubesat ? 0.62 : 1;
                    ctx.fillRect(-r * 1.7 * wingScale, -r * 0.34, r * 0.9 * wingScale, r * 0.68);
                    ctx.fillRect(r * 0.8 * wingScale, -r * 0.34, r * 0.9 * wingScale, r * 0.68);
                    ctx.strokeRect(-r * 1.7 * wingScale, -r * 0.34, r * 0.9 * wingScale, r * 0.68);
                    ctx.strokeRect(r * 0.8 * wingScale, -r * 0.34, r * 0.9 * wingScale, r * 0.68);
                    ctx.strokeStyle = "rgba(255, 240, 190, 0.8)";
                    ctx.beginPath();
                    ctx.moveTo(0, -r * 0.52);
                    ctx.lineTo(0, -r * 1.18);
                    ctx.moveTo(0, -r * 1.18);
                    ctx.lineTo(r * 0.38, -r * 1.46);
                    ctx.stroke();
                    ctx.fillStyle = warning ? "#ff6969" : "#8ef088";
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            function drawAstronaut(astronaut) {
                const bob = Math.sin(astronaut.age * 2.2 + astronaut.seed) * 0.12;
                ctx.save();
                ctx.translate(astronaut.x, astronaut.y);
                ctx.rotate(bob);
                ctx.globalCompositeOperation = "lighter";
                const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, astronaut.r * 1.8);
                glow.addColorStop(0, "rgba(235, 255, 244, 0.72)");
                glow.addColorStop(0.5, "rgba(142, 240, 136, 0.2)");
                glow.addColorStop(1, "rgba(142, 240, 136, 0)");
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(0, 0, astronaut.r * 1.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalCompositeOperation = "source-over";
                ctx.strokeStyle = "rgba(235, 247, 255, 0.88)";
                ctx.lineWidth = 3;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(-5, 5);
                ctx.lineTo(-11, 13);
                ctx.moveTo(5, 5);
                ctx.lineTo(11, 13);
                ctx.moveTo(-7, -1);
                ctx.lineTo(-14, 4);
                ctx.moveTo(7, -1);
                ctx.lineTo(14, 4);
                ctx.stroke();
                ctx.fillStyle = "#f4f7f1";
                ctx.strokeStyle = "rgba(20, 45, 68, 0.9)";
                ctx.lineWidth = 1.6;
                ctx.fillRect(-7, -2, 14, 15);
                ctx.strokeRect(-7, -2, 14, 15);
                ctx.fillStyle = "#9bb2bd";
                ctx.fillRect(-10, 0, 3, 10);
                ctx.strokeRect(-10, 0, 3, 10);
                ctx.fillStyle = "#f5f7f4";
                ctx.beginPath();
                ctx.arc(0, -9, 8.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = "#1d6f94";
                ctx.beginPath();
                ctx.arc(0, -9.5, 5.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ffcf6d";
                ctx.fillRect(-3.2, 3, 6.4, 2.4);
                ctx.restore();
            }

            function drawPlayer() {
                const player = state.player;
                const flicker = player.invulnerable > 0 && Math.floor(player.invulnerable * 18) % 2 === 0;
                if (flicker && state.mode === "playing") return;
                const input = state.lastInput;

                function drawFlame(points, power) {
                    if (power <= 0.04 || state.mode !== "playing") return;
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    const gradient = ctx.createLinearGradient(points[0].x, points[0].y, points[1].x, points[1].y);
                    gradient.addColorStop(0, "rgba(255, 246, 168, 0.78)");
                    gradient.addColorStop(0.48, "rgba(97, 216, 255, 0.56)");
                    gradient.addColorStop(1, "rgba(97, 216, 255, 0)");
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.moveTo(points[0].x, points[0].y);
                    ctx.lineTo(points[1].x, points[1].y);
                    ctx.lineTo(points[2].x, points[2].y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }

                ctx.save();
                ctx.translate(player.x, player.y);

                if (state.mode === "reentry" || state.mode === "won") {
                    const progress = clamp(state.reentry.timer / state.reentry.duration, 0, 1);
                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";
                    const plasma = ctx.createRadialGradient(0, 0, 8, 0, 0, 52 + progress * 18);
                    plasma.addColorStop(0, "rgba(255, 245, 197, 0.7)");
                    plasma.addColorStop(0.42, "rgba(255, 151, 86, 0.33)");
                    plasma.addColorStop(1, "rgba(255, 105, 105, 0)");
                    ctx.fillStyle = plasma;
                    ctx.beginPath();
                    ctx.arc(0, 0, 52 + progress * 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                const sidePower = Math.min(1, Math.abs(input.x));
                const verticalPower = Math.min(1, Math.abs(input.y));
                const sideNozzleX = SHIP_SPRITE_WIDTH * 0.46;
                const sideNozzleY = SHIP_SPRITE_HEIGHT * 0.14;
                const noseNozzleY = -SHIP_SPRITE_HEIGHT * 0.43;
                const tailNozzleY = SHIP_SPRITE_HEIGHT * 0.43;
                drawFlame([{ x: -sideNozzleX, y: sideNozzleY - 4 }, { x: -sideNozzleX - 16 - sidePower * 9, y: sideNozzleY + 1 }, { x: -sideNozzleX, y: sideNozzleY + 6 }], input.x > 0 ? sidePower : 0);
                drawFlame([{ x: sideNozzleX, y: sideNozzleY - 4 }, { x: sideNozzleX + 16 + sidePower * 9, y: sideNozzleY + 1 }, { x: sideNozzleX, y: sideNozzleY + 6 }], input.x < 0 ? sidePower : 0);
                drawFlame([{ x: -4, y: noseNozzleY }, { x: 0, y: noseNozzleY - 13 - verticalPower * 6 }, { x: 4, y: noseNozzleY }], input.y > 0 ? verticalPower : 0);
                drawFlame([{ x: -6, y: tailNozzleY }, { x: 0, y: tailNozzleY + 17 + verticalPower * 8 }, { x: 6, y: tailNozzleY }], input.y < 0 ? verticalPower : 0);

                if (shipSpriteReady && shipSprite.complete && shipSprite.naturalWidth > 0) {
                    ctx.drawImage(
                        shipSprite,
                        -SHIP_SPRITE_WIDTH / 2,
                        -SHIP_SPRITE_HEIGHT / 2,
                        SHIP_SPRITE_WIDTH,
                        SHIP_SPRITE_HEIGHT
                    );
                } else {
                    ctx.fillStyle = "#263a5d";
                    ctx.strokeStyle = "rgba(3, 10, 22, 0.78)";
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(-34, 9);
                    ctx.lineTo(-9, -9);
                    ctx.lineTo(-8, 9);
                    ctx.lineTo(-27, 20);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(34, 9);
                    ctx.lineTo(9, -9);
                    ctx.lineTo(8, 9);
                    ctx.lineTo(27, 20);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = "#7ab8ff";
                    ctx.beginPath();
                    ctx.moveTo(-27, 8);
                    ctx.lineTo(-14, 0);
                    ctx.lineTo(-12, 6);
                    ctx.lineTo(-25, 14);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(27, 8);
                    ctx.lineTo(14, 0);
                    ctx.lineTo(12, 6);
                    ctx.lineTo(25, 14);
                    ctx.closePath();
                    ctx.fill();

                    const hull = ctx.createLinearGradient(-12, -32, 12, 28);
                    hull.addColorStop(0, "#ffffff");
                    hull.addColorStop(0.38, "#d9f8ff");
                    hull.addColorStop(0.78, "#8eb8db");
                    hull.addColorStop(1, "#516f93");
                    ctx.fillStyle = hull;
                    ctx.strokeStyle = "rgba(3, 10, 22, 0.78)";
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(0, -34);
                    ctx.bezierCurveTo(11, -24, 13, -3, 8, 21);
                    ctx.quadraticCurveTo(0, 29, -8, 21);
                    ctx.bezierCurveTo(-13, -3, -11, -24, 0, -34);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = "#123052";
                    ctx.beginPath();
                    ctx.ellipse(0, -13, 6.6, 12.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#61d8ff";
                    ctx.beginPath();
                    ctx.ellipse(0, -15, 4, 7.5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#182842";
                    ctx.fillRect(-4.5, 20, 9, 8);
                    ctx.fillRect(-19, -3, 6, 9);
                    ctx.fillRect(13, -3, 6, 9);
                    ctx.fillRect(-3.5, -31, 7, 6);
                    ctx.strokeStyle = "rgba(151, 224, 255, 0.7)";
                    ctx.lineWidth = 1.4;
                    ctx.strokeRect(-4.5, 20, 9, 8);
                    ctx.strokeRect(-19, -3, 6, 9);
                    ctx.strokeRect(13, -3, 6, 9);
                    ctx.strokeRect(-3.5, -31, 7, 6);

                    ctx.strokeStyle = "rgba(255, 255, 255, 0.42)";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, -30);
                    ctx.lineTo(0, 22);
                    ctx.moveTo(-6, 4);
                    ctx.lineTo(6, 4);
                    ctx.stroke();
                }
                ctx.restore();
            }

            function drawJoystick() {
                if (!state.joystick.active) return;
                const joy = state.joystick;
                const dx = joy.x - joy.originX;
                const dy = joy.y - joy.originY;
                const length = Math.hypot(dx, dy);
                const max = 84;
                const scale = length > max ? max / length : 1;
                const knobX = joy.originX + dx * scale;
                const knobY = joy.originY + dy * scale;
                ctx.save();
                ctx.globalAlpha = 0.64;
                ctx.strokeStyle = "rgba(210, 240, 255, 0.42)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(joy.originX, joy.originY, max, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = "rgba(97, 216, 255, 0.18)";
                ctx.beginPath();
                ctx.arc(knobX, knobY, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
                ctx.stroke();
                ctx.restore();
            }

            function drawParticles() {
                ctx.save();
                ctx.globalCompositeOperation = "lighter";
                for (const particle of state.particles) {
                    const alpha = Math.max(0, particle.life / particle.maxLife);
                    ctx.globalAlpha = Math.min(1, alpha);
                    ctx.fillStyle = particle.color;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.r * (0.6 + alpha), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            function drawCloudWarnings() {
                if (state.phase !== "cloud") return;
                const intensity = Math.min(0.34, 0.1 + state.level * 0.012);
                const wave = currentWavePattern();
                if (wave.key === "orbitalTraffic") {
                    ctx.save();
                    ctx.globalAlpha = 0.26 + Math.sin(state.survivalTime * 2.8) * 0.08;
                    ctx.strokeStyle = "rgba(142, 240, 136, 0.72)";
                    ctx.lineWidth = 1.4;
                    ctx.setLineDash([7, 12]);
                    for (const x of [WORLD.width * 0.25, WORLD.width * 0.5, WORLD.width * 0.75]) {
                        ctx.beginPath();
                        ctx.moveTo(x, PLAY_TOP + 18);
                        ctx.lineTo(x, PLAY_TOP + 94);
                        ctx.stroke();
                    }
                    ctx.setLineDash([]);
                    ctx.restore();
                    return;
                }
                ctx.save();
                ctx.globalAlpha = intensity * (0.65 + 0.35 * Math.sin(state.survivalTime * 4));
                ctx.fillStyle = "rgba(255, 207, 109, 0.18)";
                ctx.fillRect(0, PLAY_TOP, WORLD.width, 7);
                ctx.fillStyle = "rgba(255, 105, 105, 0.12)";
                ctx.fillRect(0, PLAY_TOP + 8, WORLD.width, 4);
                ctx.globalAlpha = 0.22 + intensity;
                ctx.lineWidth = 2;
                if (wave.key === "shardRain") {
                    ctx.strokeStyle = "rgba(142, 232, 255, 0.72)";
                    for (let x = 54; x < WORLD.width; x += 58) {
                        const offset = Math.sin(state.survivalTime * 4 + x) * 8;
                        ctx.beginPath();
                        ctx.moveTo(x + offset, PLAY_TOP + 18);
                        ctx.lineTo(x + offset * 0.35, PLAY_TOP + 54);
                        ctx.stroke();
                    }
                } else if (wave.key === "crosswind") {
                    ctx.strokeStyle = "rgba(255, 207, 109, 0.7)";
                    for (let y = PLAY_TOP + 28; y < PLAY_TOP + 120; y += 28) {
                        ctx.beginPath();
                        ctx.moveTo(20, y);
                        ctx.lineTo(46, y + 9);
                        ctx.lineTo(20, y + 18);
                        ctx.moveTo(WORLD.width - 20, y);
                        ctx.lineTo(WORLD.width - 46, y + 9);
                        ctx.lineTo(WORLD.width - 20, y + 18);
                        ctx.stroke();
                    }
                } else if (wave.key === "panelDrift") {
                    ctx.strokeStyle = "rgba(126, 174, 255, 0.58)";
                    for (let i = 0; i < 3; i += 1) {
                        ctx.beginPath();
                        for (let x = 24; x <= WORLD.width - 24; x += 18) {
                            const y = PLAY_TOP + 32 + i * 26 + Math.sin(x * 0.035 + state.survivalTime * 2.2 + i) * 8;
                            if (x === 24) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.stroke();
                    }
                } else if (wave.key === "cascadeBurst") {
                    ctx.strokeStyle = "rgba(255, 148, 116, 0.62)";
                    for (let i = 0; i < 4; i += 1) {
                        const x = 84 + i * 120;
                        const r = 8 + ((state.survivalTime * 18 + i * 8) % 24);
                        ctx.beginPath();
                        ctx.arc(x, PLAY_TOP + 42, r, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                } else {
                    ctx.strokeStyle = "rgba(255, 105, 105, 0.7)";
                    ctx.fillStyle = "rgba(255, 105, 105, 0.22)";
                    for (let x = 72; x < WORLD.width; x += 132) {
                        ctx.beginPath();
                        ctx.arc(x, PLAY_TOP + 40, 13 + Math.sin(state.survivalTime * 9 + x) * 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }

            function render() {
                const scaleX = canvas.width / WORLD.width;
                const scaleY = canvas.height / WORLD.height;
                ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
                ctx.clearRect(0, 0, WORLD.width, WORLD.height);
                const shakeX = state.shake > 0 ? Math.sin(state.survivalTime * 91.7) * 5 * state.shake : 0;
                const shakeY = state.shake > 0 ? Math.cos(state.survivalTime * 73.3) * 5 * state.shake : 0;
                ctx.save();
                ctx.translate(shakeX, shakeY);
                drawBackground();
                drawCloudWarnings();
                for (const debris of state.debris) drawDebris(debris);
                for (const astronaut of state.collectibles) drawAstronaut(astronaut);
                drawParticles();
                if (state.mode !== "gameover" || state.shields > 0) drawPlayer();
                drawJoystick();
                ctx.restore();
            }

            function frame(now) {
                if (!frame.last) frame.last = now;
                const dt = Math.min(0.05, (now - frame.last) / 1000);
                frame.last = now;
                update(dt);
                render();
                requestAnimationFrame(frame);
            }

            function resizeCanvas() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
                const rect = shell.getBoundingClientRect();
                canvas.width = Math.max(1, Math.round(rect.width * dpr));
                canvas.height = Math.max(1, Math.round(rect.height * dpr));
                render();
            }

            function eventToWorld(event) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (event.clientX - rect.left) / rect.width * WORLD.width,
                    y: (event.clientY - rect.top) / rect.height * WORLD.height
                };
            }

            function onPointerDown(event) {
                if (event.target !== canvas) return;
                if (state.mode === "ready") {
                    startGame();
                } else if (state.mode === "gameover" || state.mode === "won") {
                    restartGame();
                }
                if (state.mode !== "playing") return;
                const point = eventToWorld(event);
                state.joystick.active = true;
                state.joystick.id = event.pointerId;
                state.joystick.originX = point.x;
                state.joystick.originY = point.y;
                state.joystick.x = point.x;
                state.joystick.y = point.y;
                canvas.setPointerCapture(event.pointerId);
            }

            function onPointerMove(event) {
                if (!state.joystick.active || state.joystick.id !== event.pointerId) return;
                const point = eventToWorld(event);
                state.joystick.x = point.x;
                state.joystick.y = point.y;
            }

            function onPointerUp(event) {
                if (state.joystick.id === event.pointerId) {
                    state.joystick.active = false;
                    state.joystick.id = null;
                    try {
                        canvas.releasePointerCapture(event.pointerId);
                    } catch (error) {
                        // Some browser drivers release capture automatically.
                    }
                }
            }

            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    shell.requestFullscreen?.();
                } else {
                    document.exitFullscreen?.();
                }
            }

            function renderGameToText() {
                const relevantDebris = state.debris
                    .slice()
                    .sort((a, b) => Math.hypot(a.x - state.player.x, a.y - state.player.y) - Math.hypot(b.x - state.player.x, b.y - state.player.y))
                    .slice(0, 14)
                    .map((debris) => ({
                        x: Number(debris.x.toFixed(1)),
                        y: Number(debris.y.toFixed(1)),
                        vx: Number(debris.vx.toFixed(1)),
                        vy: Number(debris.vy.toFixed(1)),
                        r: Number(debris.r.toFixed(1)),
                        size: debris.size,
                        kind: debris.kind,
                        wave: debris.waveKey,
                        fuse: debris.kind === "satellite" || debris.kind === "cubesat" ? Number(debris.fuse.toFixed(2)) : null
                    }));
                return JSON.stringify({
                    mode: state.mode,
                    coordinates: `world units; origin top-left; x right; y down; canvas world ${WORLD.width}x${WORLD.height}`,
                    level: state.level,
                    phase: state.phase,
                    wave: {
                        key: currentWavePattern().key,
                        name: currentWaveName()
                    },
                    difficulty: Number(difficultyForLevel().toFixed(2)),
                    scenery: backgroundSceneForLevel().key,
                    iss: {
                        visible: ISS_DAMAGE_LEVELS.has(state.level),
                        damageStage: ISS_DAMAGE_LEVELS.get(state.level) ?? null,
                        asset: ISS_DAMAGE_LEVELS.has(state.level) ? ISS_SPRITE_SOURCES[ISS_DAMAGE_LEVELS.get(state.level)] : null,
                        displaySize: ISS_DRAW_SIZE,
                        travel: ISS_DAMAGE_LEVELS.has(state.level) ? Number(backgroundObjectProgress().toFixed(2)) : null
                    },
                    orbit: {
                        approach: Number(campaignProgress().toFixed(2)),
                        earthRadius: Number(earthOrbitState(state.survivalTime).radius.toFixed(1)),
                        textureScroll: Number(earthTextureScrollProgress().toFixed(2))
                    },
                    phaseRemaining: Number(Math.max(0, state.phaseDuration - state.phaseTimer).toFixed(2)),
                    score: Math.floor(state.score),
                    best: Math.max(state.best, Math.floor(state.score)),
                    survivalTime: Number(state.survivalTime.toFixed(2)),
                    shields: state.shields,
                    player: {
                        x: Number(state.player.x.toFixed(1)),
                        y: Number(state.player.y.toFixed(1)),
                        vx: Number(state.player.vx.toFixed(1)),
                        vy: Number(state.player.vy.toFixed(1)),
                        r: PLAYER_RADIUS,
                        invulnerable: Number(state.player.invulnerable.toFixed(2))
                    },
                    input: {
                        keyboard: [...keys],
                        joystick: state.joystick.active,
                        tilt: {
                            enabled: state.tilt.enabled,
                            calibrated: state.tilt.calibrated,
                            pendingCalibration: state.tilt.pendingCalibration,
                            permission: state.tilt.permission,
                            vector: {
                                x: Number(state.tilt.inputX.toFixed(2)),
                                y: Number(state.tilt.inputY.toFixed(2))
                            }
                        },
                        vector: {
                            x: Number(state.lastInput.x.toFixed(2)),
                            y: Number(state.lastInput.y.toFixed(2))
                        }
                    },
                    debrisCount: state.debris.length,
                    nearestDebris: relevantDebris,
                    astronauts: state.collectibles.map((astronaut) => ({
                        x: Number(astronaut.x.toFixed(1)),
                        y: Number(astronaut.y.toFixed(1)),
                        r: astronaut.r
                    })),
                    astronautsRescued: state.astronautsRescued,
                    reentry: {
                        active: state.reentry.active,
                        progress: Number(clamp(state.reentry.timer / state.reentry.duration, 0, 1).toFixed(2))
                    },
                    particles: state.particles.length,
                    recentCascades: state.recentCascades,
                    controls: copy.controls
                });
            }

            window.render_game_to_text = renderGameToText;
            window.advanceTime = (ms) => {
                const steps = Math.max(1, Math.round(ms / (1000 / 60)));
                for (let i = 0; i < steps; i += 1) update(FIXED_DT);
                render();
            };

            startButton.addEventListener("click", () => {
                if (state.mode === "gameover" || state.mode === "won") {
                    restartGame();
                } else {
                    startGame();
                }
            });
            tiltToggleButton.addEventListener("click", toggleTiltControl);
            tiltCalibrateButton.addEventListener("click", calibrateTiltFromButton);
            restartButton.addEventListener("click", restartGame);
            pauseButton.addEventListener("click", togglePause);
            canvas.addEventListener("pointerdown", onPointerDown);
            canvas.addEventListener("pointermove", onPointerMove);
            canvas.addEventListener("pointerup", onPointerUp);
            canvas.addEventListener("pointercancel", onPointerUp);

            window.addEventListener("keydown", (event) => {
                const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
                if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " ", "Spacebar"].includes(event.key)) {
                    event.preventDefault();
                }
                if (key === " " || key === "Enter") {
                    if (state.mode === "ready") startGame();
                    else if (state.mode === "gameover" || state.mode === "won") restartGame();
                } else if (key === "p") {
                    togglePause();
                } else if (key === "f") {
                    toggleFullscreen();
                } else {
                    keys.add(key);
                }
            });
            window.addEventListener("keyup", (event) => {
                const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
                keys.delete(key);
            });
            window.addEventListener("blur", () => {
                keys.clear();
                state.joystick.active = false;
            });
            window.addEventListener("resize", resizeCanvas);
            window.visualViewport?.addEventListener("resize", resizeCanvas);
            document.addEventListener("fullscreenchange", resizeCanvas);

            loadBest();
            applyLanguage(language);
            resetGame();
            resizeCanvas();
            requestAnimationFrame(frame);
        })();
    </script>
</body>

</html>
