<!doctype html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kaskade - Solar Explorer</title>
    <link rel="icon" href="data:," />
    <style>
        :root {
            color-scheme: dark;
            --ink: #f7fbff;
            --muted: #b7c8dd;
            --panel: rgba(9, 19, 35, 0.82);
            --line: rgba(184, 221, 255, 0.24);
            --green: #8ef088;
            --cyan: #61d8ff;
            --amber: #ffcf6d;
            --red: #ff6969;
            --blue: #6e9cff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            overflow: hidden;
        }

        body {
            width: 100vw;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            color: var(--ink);
            background:
                radial-gradient(circle at 22% 15%, rgba(36, 108, 168, 0.42), transparent 34%),
                radial-gradient(circle at 78% 78%, rgba(115, 61, 145, 0.34), transparent 40%),
                linear-gradient(155deg, #030711 0%, #08172a 48%, #101b36 100%);
            font-family: "Avenir Next Condensed", "Gill Sans", "Trebuchet MS", sans-serif;
            touch-action: none;
        }

        .game-shell {
            position: relative;
            width: min(100vw, calc(100dvh * 9 / 16));
            height: min(100dvh, calc(100vw * 16 / 9));
            max-width: 540px;
            max-height: 960px;
            overflow: hidden;
            border: 1px solid rgba(191, 222, 255, 0.26);
            border-radius: clamp(0px, 2.4vw, 18px);
            background: #050b17;
            box-shadow:
                0 26px 70px rgba(0, 0, 0, 0.48),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            isolation: isolate;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .topbar,
        .hud,
        .message,
        .level-banner {
            position: absolute;
            z-index: 3;
        }

        .topbar {
            top: max(0.5rem, env(safe-area-inset-top));
            left: 0.55rem;
            right: 0.55rem;
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            gap: 0.38rem;
            pointer-events: none;
        }

        .icon-button,
        .start-button,
        .tilt-button {
            appearance: none;
            border: 1px solid rgba(222, 242, 255, 0.32);
            color: var(--ink);
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04)),
                rgba(7, 18, 34, 0.76);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 10px 24px rgba(0, 0, 0, 0.28);
            font: inherit;
            cursor: pointer;
            pointer-events: auto;
        }

        .icon-button {
            width: 2.45rem;
            aspect-ratio: 1 / 1;
            border-radius: 999px;
            display: inline-grid;
            place-items: center;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 800;
            line-height: 1;
        }

        .icon-button:hover,
        .icon-button:focus-visible,
        .start-button:hover,
        .start-button:focus-visible,
        .tilt-button:hover,
        .tilt-button:focus-visible {
            border-color: rgba(255, 255, 255, 0.62);
            outline: none;
        }

        .title-chip {
            min-width: 0;
            padding: 0.52rem 0.68rem;
            border: 1px solid rgba(179, 218, 255, 0.22);
            border-radius: 999px;
            color: #dff5ff;
            background: rgba(7, 18, 34, 0.62);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
            font-size: clamp(0.73rem, 2.2vw, 0.88rem);
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hud {
            top: 3.55rem;
            left: 0.58rem;
            right: 0.58rem;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.45rem;
            align-items: start;
            pointer-events: none;
        }

        .score-stack {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.38rem;
            min-width: 0;
        }

        .chip {
            min-width: 0;
            padding: 0.44rem 0.56rem;
            border: 1px solid rgba(179, 218, 255, 0.2);
            border-radius: 0.7rem;
            background: rgba(7, 18, 34, 0.62);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .chip small {
            display: block;
            color: var(--muted);
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .chip strong {
            display: block;
            margin-top: 0.04rem;
            color: var(--ink);
            font-size: clamp(0.88rem, 3vw, 1.12rem);
            line-height: 1;
            white-space: nowrap;
        }

        .shield-panel {
            display: grid;
            justify-items: end;
            gap: 0.32rem;
        }

        .shield-row {
            display: flex;
            gap: 0.24rem;
        }

        .shield-dot {
            width: 0.72rem;
            aspect-ratio: 1 / 1;
            border-radius: 999px;
            background: radial-gradient(circle at 35% 30%, #f7ffff 0%, #8ae9ff 38%, #246fbd 100%);
            box-shadow: 0 0 12px rgba(97, 216, 255, 0.76);
            opacity: 0.28;
        }

        .shield-dot.is-live {
            opacity: 1;
        }

        .phase-pill {
            min-width: 5.8rem;
            padding: 0.4rem 0.52rem;
            border: 1px solid rgba(179, 218, 255, 0.2);
            border-radius: 999px;
            background: rgba(7, 18, 34, 0.62);
            color: #e6f6ff;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-align: center;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .message {
            left: 50%;
            top: 50%;
            width: min(86%, 24rem);
            transform: translate(-50%, -50%) scale(0.96);
            display: grid;
            gap: 0.72rem;
            padding: clamp(1rem, 4vw, 1.35rem);
            border: 1px solid rgba(213, 238, 255, 0.28);
            border-radius: 1rem;
            background:
                linear-gradient(145deg, rgba(18, 38, 66, 0.92), rgba(7, 18, 34, 0.78)),
                var(--panel);
            box-shadow:
                0 28px 62px rgba(0, 0, 0, 0.46),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .message.is-visible {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .message[hidden] {
            display: none;
        }

        .message h1 {
            margin: 0;
            font-family: "Copperplate", "Avenir Next Condensed", "Trebuchet MS", sans-serif;
            font-size: clamp(1.35rem, 6vw, 2rem);
            line-height: 1.06;
            letter-spacing: 0.01em;
        }

        .message p {
            margin: 0;
            color: #d8e8fb;
            font-size: clamp(0.88rem, 3.2vw, 1.02rem);
            line-height: 1.36;
        }

        .message .stat-line {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.42rem;
        }

        .message .stat-line span {
            padding: 0.48rem 0.38rem;
            border: 1px solid rgba(190, 224, 255, 0.2);
            border-radius: 0.62rem;
            background: rgba(255, 255, 255, 0.06);
            color: #f7fbff;
            font-size: 0.72rem;
            font-weight: 800;
            text-align: center;
        }

        .start-button {
            min-height: 2.8rem;
            border-radius: 999px;
            color: #06111f;
            background: linear-gradient(145deg, #b8ffd7, #61d8ff);
            font-size: 0.92rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .tilt-controls {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.42rem;
        }

        .tilt-controls[hidden] {
            display: none;
        }

        .tilt-button {
            min-width: 0;
            min-height: 2.25rem;
            border-radius: 0.68rem;
            color: #e9f7ff;
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .tilt-button[aria-pressed="true"] {
            border-color: rgba(142, 240, 136, 0.58);
            background:
                linear-gradient(145deg, rgba(142, 240, 136, 0.22), rgba(97, 216, 255, 0.12)),
                rgba(7, 18, 34, 0.82);
        }

        .tilt-button:disabled {
            cursor: default;
            opacity: 0.45;
        }

        .level-banner {
            left: 50%;
            bottom: 1.1rem;
            transform: translateX(-50%);
            width: max-content;
            max-width: 84%;
            padding: 0.48rem 0.72rem;
            border: 1px solid rgba(196, 231, 255, 0.24);
            border-radius: 999px;
            background: rgba(7, 18, 34, 0.7);
            color: #e9f7ff;
            font-size: 0.76rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .level-banner.is-visible {
            opacity: 1;
        }

        @media (max-width: 390px) {
            .topbar {
                gap: 0.28rem;
            }

            .icon-button {
                width: 2.25rem;
            }

            .hud {
                top: 3.25rem;
                grid-template-columns: 1fr;
            }

            .shield-panel {
                justify-items: start;
                grid-template-columns: auto auto;
                align-items: center;
            }

            .score-stack {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .chip {
                padding: 0.38rem 0.42rem;
            }

            .chip small {
                font-size: 0.54rem;
            }
        }
    </style>
</head>

<body>
    <main class="game-shell" id="gameShell" aria-label="Kaskade Spiel">
        <canvas id="game" width="540" height="960"></canvas>

        <nav class="topbar" aria-label="Spielsteuerung">
            <a id="backButton" class="icon-button" href="index.html" aria-label="Zurück zur Spielstation" title="Zurück">‹</a>
            <div class="title-chip" id="titleChip">Kaskade</div>
            <button id="pauseButton" class="icon-button" type="button" aria-label="Pause" title="Pause">Ⅱ</button>
            <button id="restartButton" class="icon-button" type="button" aria-label="Neu starten" title="Neu starten">↻</button>
        </nav>

        <section class="hud" aria-label="Status">
            <div class="score-stack">
                <div class="chip">
                    <small id="scoreLabel">Punkte</small>
                    <strong id="scoreValue">0</strong>
                </div>
                <div class="chip">
                    <small id="bestLabel">Bestwert</small>
                    <strong id="bestValue">0</strong>
                </div>
                <div class="chip">
                    <small id="levelLabel">Level</small>
                    <strong id="levelValue">1</strong>
                </div>
            </div>
            <div class="shield-panel">
                <div class="phase-pill" id="phasePill">Wolke</div>
                <div class="shield-row" id="shieldRow" aria-label="Schilde">
                    <span class="shield-dot is-live"></span>
                    <span class="shield-dot is-live"></span>
                    <span class="shield-dot is-live"></span>
                </div>
            </div>
        </section>

        <section class="message is-visible" id="messagePanel" aria-live="polite">
            <h1 id="messageTitle">Kaskade</h1>
            <p id="messageCopy">Steuere das Raumschiff durch Trümmerwolken. Wenn Teile kollidieren, entstehen neue Splitter.</p>
            <div class="stat-line" id="messageStats">
                <span id="statA">3 Schilde</span>
                <span id="statB">Wellen</span>
                <span id="statC">Kaskaden</span>
            </div>
            <button id="startButton" class="start-button" type="button">Start</button>
            <div class="tilt-controls" id="tiltControls">
                <button id="tiltToggleButton" class="tilt-button" type="button" aria-pressed="false">Neigung: Aus</button>
                <button id="tiltCalibrateButton" class="tilt-button" type="button">Kalibrieren</button>
            </div>
        </section>

        <div class="level-banner" id="levelBanner">Level 1</div>
    </main>

            function preferredLanguage() {
                const queryLang = new URLSearchParams(window.location.search).get("lang");
                if (supportedLanguages.has(queryLang)) return queryLang;
                try {
                    const stored = localStorage.getItem(LANGUAGE_STORAGE_KEY);
                    if (supportedLanguages.has(stored)) return stored;
                } catch (error) {
                    // Query parameters still work when storage is unavailable.
                }
                return "de";
            }

            function rememberLanguage(language) {
                try {
                    localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
                } catch (error) {
                    // Storage can be disabled in embedded browser contexts.
                }
            }

            function localizedUrl(path, language) {
                const url = new URL(path, window.location.href);
                url.searchParams.set("lang", language);
                return `${url.pathname.split("/").pop()}${url.search}`;
            }

            let language = preferredLanguage();
            rememberLanguage(language);
            let copy = copyByLanguage[language];

            function mulberry32(seed) {
                return () => {
                    seed |= 0;
                    seed = seed + 0x6D2B79F5 | 0;
                    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                };
            }

            const stars = Array.from({ length: 142 }, (_, index) => {
                const rand = mulberry32(9001 + index * 37);
                return {
                    x: rand() * WORLD.width,
                    y: rand() * WORLD.height,
                    r: 0.6 + rand() * 1.7,
                    speed: 8 + rand() * 34,
                    alpha: 0.25 + rand() * 0.65,
                    hue: rand() > 0.74 ? "rgba(133, 215, 255," : "rgba(255, 255, 255,"
                };
            });

            const ORBITAL_SCENES = [
                { key: "earthDay" },
                { key: "terminator" },
                { key: "sunrise" },
                { key: "moonPass" },
                { key: "aurora" },
                { key: "highOrbit" },
                { key: "nightLights" }
            ];

            const keys = new Set();
            const state = {
                mode: "ready",

                phaseTimer: 0,
                phaseDuration: 12,
                spawnTimer: 0,
                cascadeTimer: 0,
                score: 0,
                best: 0,
                survivalTime: 0,
                shields: 3,
                shake: 0,
                bannerTimer: 0,
                recentCascades: 0,
                rngSeed: 424242,
                rng: mulberry32(424242),
                levelThemes: {},
                backgroundScenes: {},
                astronautTimer: Infinity,
                astronautSpawned: false,
                astronautsRescued: 0,
                player: {
                    x: WORLD.width * 0.5,
                    y: 760,
                    vx: 0,
                    vy: 0,
                    invulnerable: 0,
                    thrust: 0,
                    angle: -Math.PI / 2
                },
                joystick: {

                    originX: 0,
                    originY: 0,
                    x: 0,
                    y: 0
                },
                debris: [],
                collectibles: [],
                particles: [],
                lastInput: { x: 0, y: 0 },
                reentry: {
                    timer: 0,
                    duration: REENTRY_DURATION,
                    active: false
                },
                tilt: {
                    enabled: false,
                    permission: "prompt",
                    listening: false,
                    calibrated: false,
                    pendingCalibration: false,
                    available: false,
                    beta: 0,
                    gamma: 0,
                    baseBeta: 0,
                    baseGamma: 0,
                    inputX: 0,
                    inputY: 0,
                    lastSeen: 0
                }
            };
            const earthSprite = new Image();
            let earthSpriteReady = false;
            earthSprite.addEventListener("load", () => {
                earthSpriteReady = true;
                render();
            });
            earthSprite.addEventListener("error", () => {
                earthSpriteReady = false;
            });
            earthSprite.src = EARTH_SPRITE_SRC;

            const moonSprite = new Image();
            let moonSpriteReady = false;
            moonSprite.addEventListener("load", () => {
                moonSpriteReady = true;
                render();
            });
            moonSprite.addEventListener("error", () => {
                moonSpriteReady = false;
            });
            moonSprite.src = MOON_SPRITE_SRC;

            const shipSprite = new Image();
            let shipSpriteReady = false;
            shipSprite.addEventListener("load", () => {
                shipSpriteReady = true;
                render();
            });
            shipSprite.addEventListener("error", () => {
                shipSpriteReady = false;
            });
            shipSprite.src = SHIP_SPRITE_SRC;

                const sprite = new Image();
                sprite.addEventListener("load", render);
                sprite.src = source;
                return sprite;
            });

            function loadBest() {
                try {
                    const value = Number(localStorage.getItem(BEST_STORAGE_KEY) || "0");
                    state.best = Number.isFinite(value) ? value : 0;
                } catch (error) {
                    state.best = 0;
                }
            }

            function saveBest() {
                if (Math.floor(state.score) <= state.best) return;
                state.best = Math.floor(state.score);
                try {
                    localStorage.setItem(BEST_STORAGE_KEY, String(state.best));
                } catch (error) {
                    // Best score remains visible for the current run.
                }
            }

            function rand(min = 0, max = 1) {
                return min + (max - min) * state.rng();
            }

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function tiltSupported() {
                return "DeviceOrientationEvent" in window || "ondeviceorientation" in window;
            }

            function ensureTiltListener() {
                if (state.tilt.listening) return;
                window.addEventListener("deviceorientation", handleDeviceOrientation);
                state.tilt.listening = true;
            }

            function calibrateTiltControl() {
                if (!state.tilt.lastSeen) {
                    state.tilt.pendingCalibration = true;
                    updateTiltControls();
                    return false;
                }
                state.tilt.baseBeta = state.tilt.beta;
                state.tilt.baseGamma = state.tilt.gamma;
                state.tilt.inputX = 0;
                state.tilt.inputY = 0;
                state.tilt.calibrated = true;
                state.tilt.pendingCalibration = false;
                updateTiltControls();
                return true;
            }

            function tiltAxis(value) {
                if (Math.abs(value) < TILT_DEADZONE) return 0;
                return clamp(value, -1, 1);
            }

            function currentTiltVector(now = performance.now()) {
                if (!state.tilt.enabled || !state.tilt.calibrated || now - state.tilt.lastSeen > TILT_STALE_MS) {
                    state.tilt.inputX = 0;
                    state.tilt.inputY = 0;
                    return { x: 0, y: 0 };
                }
                const x = tiltAxis((state.tilt.gamma - state.tilt.baseGamma) / TILT_RANGE_X);
                const y = tiltAxis((state.tilt.beta - state.tilt.baseBeta) / TILT_RANGE_Y);
                state.tilt.inputX = x;
                state.tilt.inputY = y;
                return { x, y };
            }

            function handleDeviceOrientation(event) {
                const beta = Number(event.beta);
                const gamma = Number(event.gamma);
                if (!Number.isFinite(beta) || !Number.isFinite(gamma)) return;
                state.tilt.available = true;
                state.tilt.permission = state.tilt.permission === "denied" ? "denied" : "granted";
                state.tilt.beta = beta;
                state.tilt.gamma = gamma;
                state.tilt.lastSeen = performance.now();
                if (state.tilt.enabled && (state.tilt.pendingCalibration || !state.tilt.calibrated)) {
                    calibrateTiltControl();
                } else {
                    updateTiltControls();
                }
            }

            async function enableTiltControl() {
                if (!tiltSupported()) {
                    state.tilt.permission = "unavailable";
                    updateTiltControls();
                    return false;
                }
                ensureTiltListener();
                try {
                    const orientationEvent = window.DeviceOrientationEvent;
                    if (orientationEvent && typeof orientationEvent.requestPermission === "function") {
                        const permission = await orientationEvent.requestPermission();
                        if (permission !== "granted") {
                            state.tilt.enabled = false;
                            state.tilt.permission = "denied";
                            updateTiltControls();
                            return false;
                        }
                    }
                } catch (error) {
                    state.tilt.enabled = false;
                    state.tilt.permission = "denied";
                    updateTiltControls();
                    return false;
                }
                state.tilt.enabled = true;
                state.tilt.permission = "granted";
                state.tilt.pendingCalibration = true;
                calibrateTiltControl();
                updateTiltControls();
                return true;
            }

            async function toggleTiltControl() {
                if (state.tilt.enabled) {
                    state.tilt.enabled = false;
                    state.tilt.pendingCalibration = false;
                    state.tilt.inputX = 0;
                    state.tilt.inputY = 0;
                    updateTiltControls();
                    return;
                }
                await enableTiltControl();
            }

            async function calibrateTiltFromButton() {
                if (!state.tilt.enabled) {
                    const enabled = await enableTiltControl();
                    if (!enabled) return;
                }
                calibrateTiltControl();
            }

            function updateTiltControls() {
                if (!tiltToggleButton || !tiltCalibrateButton) return;
                const unsupported = state.tilt.permission === "unavailable" || (!tiltSupported() && !state.tilt.enabled);
                const denied = state.tilt.permission === "denied";
                let label = state.tilt.enabled ? copy.tiltOn : copy.tiltOff;
                if (unsupported) label = copy.tiltUnavailable;
                else if (denied) label = copy.tiltDenied;
                else if (state.tilt.enabled && (state.tilt.pendingCalibration || !state.tilt.lastSeen)) label = copy.tiltWaiting;
                tiltToggleButton.textContent = label;
                tiltToggleButton.title = label;
                tiltToggleButton.setAttribute("aria-label", label);
                tiltToggleButton.setAttribute("aria-pressed", String(state.tilt.enabled));
                tiltToggleButton.disabled = unsupported || denied;
                tiltCalibrateButton.textContent = copy.tiltCalibrate;
                tiltCalibrateButton.title = copy.tiltCalibrate;
                tiltCalibrateButton.setAttribute("aria-label", copy.tiltCalibrate);
                tiltCalibrateButton.disabled = unsupported || denied;
            }

            function shuffle(items) {
                const shuffled = [...items];
                for (let index = shuffled.length - 1; index > 0; index -= 1) {
                    const other = Math.floor(rand(0, index + 1));
                    [shuffled[index], shuffled[other]] = [shuffled[other], shuffled[index]];
                }
                return shuffled;
            }

            function buildRunThemes() {
                const themes = {
                    1: ORBITAL_TRAFFIC_PATTERN,
                    2: WAVE_PATTERNS.find((pattern) => pattern.key === "satelliteBreakup")
                };
                let previous = themes[2].key;
                let bag = [];
                for (let level = 3; level <= MAX_LEVEL; level += 1) {
                    if (!bag.length) {
                        bag = shuffle(WAVE_PATTERNS);
                        if (bag[0].key === previous) {
                            [bag[0], bag[1]] = [bag[1], bag[0]];
                        }
                    }
                    const pattern = bag.shift();
                    themes[level] = pattern;
                    previous = pattern.key;
                }
                return themes;
            }

            function buildRunScenery() {
                const scenes = { 1: ORBITAL_SCENES.find((scene) => scene.key === "earthDay") };
                let previous = scenes[1].key;
                let bag = [];
                for (let level = 2; level <= MAX_LEVEL; level += 1) {
                    if (!bag.length) {
                        bag = shuffle(ORBITAL_SCENES);
                        if (bag[0].key === previous) {
                            [bag[0], bag[1]] = [bag[1], bag[0]];
                        }
                    }
                    const scene = bag.shift();
                    scenes[level] = scene;
                    previous = scene.key;
                }
                return scenes;
            }

            function difficultyForLevel(level = state.level) {
                const progress = clamp((level - 1) / (MAX_LEVEL - 1), 0, 1);
                return progress < 0.5
                    ? progress * 0.82
                    : 0.41 + (progress - 0.5) * 1.58;
            }

            function currentWavePattern(level = state.level) {
                return state.levelThemes[level] || (level === 1 ? ORBITAL_TRAFFIC_PATTERN : WAVE_PATTERNS[0]);
            }

            function currentWaveName(level = state.level) {
                return copy.waveNames[currentWavePattern(level).key];
            }

            function chooseDebrisKind(pattern = currentWavePattern()) {
                const roll = rand();
                let cursor = 0;
                for (const [kind, weight] of Object.entries(pattern.weights)) {
                    cursor += weight;
                    if (roll <= cursor) return kind;
                }
                return "chunk";
            }

            function astronautLevel(level = state.level) {
                return level >= 3 && level % 2 === 1;
            }

            function configureCloudPhase(level) {
                state.phase = "cloud";
                state.phaseTimer = 0;
                state.phaseDuration = cloudDurationForLevel(level);
                state.spawnTimer = level === 1 ? 0.42 : 0.24;
                state.astronautSpawned = false;
                state.astronautTimer = astronautLevel(level)
                    ? rand(state.phaseDuration * 0.28, state.phaseDuration * 0.62)
                    : Infinity;
            }

            function resetGame() {
                state.mode = "ready";
                state.level = 1;
                state.cascadeTimer = 0;
                state.score = 0;
                state.survivalTime = 0;
                state.shields = MAX_SHIELDS;
                state.shake = 0;
                state.bannerTimer = 0;
                state.recentCascades = 0;
                state.rngSeed = 424242 + Math.floor(performance.now()) % 100000;
                state.rng = mulberry32(state.rngSeed);
                state.levelThemes = buildRunThemes();
                state.backgroundScenes = buildRunScenery();
                state.astronautsRescued = 0;
                state.reentry.timer = 0;
                state.reentry.duration = REENTRY_DURATION;
                state.reentry.active = false;
                state.player.x = WORLD.width * 0.5;
                state.player.y = 760;
                state.player.vx = 0;
                state.player.vy = 0;
                state.player.invulnerable = 0;
                state.player.thrust = 0;
                state.player.angle = -Math.PI / 2;
                state.joystick.active = false;
                state.joystick.id = null;
                state.debris.length = 0;
                state.collectibles.length = 0;
                state.particles.length = 0;
                state.lastInput.x = 0;
                state.lastInput.y = 0;
                configureCloudPhase(state.level);
                showReadyMessage();
                updateHud();
                render();
            }

            function startGame() {
                if (state.mode === "playing") return;
                if (state.mode === "gameover" || state.mode === "won") {
                    restartGame();
                    return;
                }
                if (state.mode === "ready") {
                    state.mode = "playing";
                    state.bannerTimer = 1.8;
                    messagePanel.classList.remove("is-visible");
                    messagePanel.hidden = true;
                    levelBanner.textContent = copy.bannerCloud(state.level, currentWaveName());
                    levelBanner.classList.add("is-visible");
                    return;
                }
                if (state.mode === "paused") {
                    state.mode = "playing";
                    messagePanel.classList.remove("is-visible");
                    messagePanel.hidden = true;
                }
            }

            function restartGame() {
                resetGame();
                startGame();
            }

            function togglePause() {
                if (state.mode === "ready") {
                    startGame();
                    return;
                }
                if (state.mode === "gameover") {
                    restartGame();
                    return;
                }
                if (state.mode === "won") {
                    restartGame();
                    return;
                }
                if (state.mode === "reentry") return;
                if (state.mode === "paused") {
                    state.mode = "playing";
                    messagePanel.classList.remove("is-visible");
                    messagePanel.hidden = true;
                } else if (state.mode === "playing") {
                    state.mode = "paused";
                    showPausedMessage();
                }
                updateHud();
            }

            function cloudDurationForLevel(level) {
                return Math.min(20.4, 11.6 + level * 0.35);
            }

            function calmDurationForLevel(level) {
                return Math.max(1.5, 3.1 - level * 0.062);
            }

            function spawnIntervalForLevel(level) {
                const progress = clamp((level - 1) / (MAX_LEVEL - 1), 0, 1);
                const latePressure = Math.max(0, (progress - 0.46) / 0.54);
                return Math.max(0.18, 0.84 - progress * 0.37 - latePressure * 0.25);
            }

            function showReadyMessage() {
                messagePanel.hidden = false;
                tiltControls.hidden = false;

            function showGameOverMessage() {

                messageStats.hidden = false;

            }

            function showWinMessage() {
                messagePanel.hidden = false;
                tiltControls.hidden = false;
                messageTitle.textContent = copy.wonTitle;
                messageCopy.textContent = copy.wonCopy;
                statA.textContent = `${copy.level} ${MAX_LEVEL}`;
                statB.textContent = `${copy.score} ${Math.floor(state.score)}`;
                statC.textContent = `${copy.rescued} ${state.astronautsRescued}`;
                messageStats.hidden = false;
                startButton.textContent = copy.again;
                updateTiltControls();
                messagePanel.classList.add("is-visible");

            function updateHud() {
                scoreValue.textContent = String(Math.floor(state.score));
                bestValue.textContent = String(Math.max(state.best, Math.floor(state.score)));
                levelValue.textContent = String(state.level);
                phasePill.textContent = state.mode === "reentry"
                    ? copy.phaseReentry
                    : state.mode === "won"
                        ? copy.phaseWon
                        : state.phase === "cloud" ? currentWaveName() : copy.phaseCalm;
                pauseButton.textContent = state.mode === "paused" ? "▶" : "Ⅱ";
                pauseButton.setAttribute("aria-label", state.mode === "paused" ? copy.resume : copy.pause);
                pauseButton.title = state.mode === "paused" ? copy.resume : copy.pause;
                [...shieldRow.children].forEach((dot, index) => {
                    dot.classList.toggle("is-live", index < state.shields);
                });
            }

            function applyLanguage(nextLanguage) {
                language = nextLanguage;
                copy = copyByLanguage[language];
                document.documentElement.lang = language;
                document.title = copy.documentTitle;
                shell.setAttribute("aria-label", copy.shellAria);
                document.querySelector(".topbar").setAttribute("aria-label", copy.controlsAria);
                document.querySelector(".hud").setAttribute("aria-label", copy.statusAria);
                backButton.href = localizedUrl("index.html", language);
                backButton.setAttribute("aria-label", copy.back);
                backButton.title = copy.back;
                restartButton.setAttribute("aria-label", copy.restart);
                restartButton.title = copy.restart;
                scoreLabel.textContent = copy.score;
                bestLabel.textContent = copy.best;
                levelLabel.textContent = copy.level;
                shieldRow.setAttribute("aria-label", copy.shieldAria);
                if (state.mode === "ready") showReadyMessage();
                if (state.mode === "paused") showPausedMessage();
                if (state.mode === "gameover") showGameOverMessage();
                if (state.mode === "won") showWinMessage();
                updateTiltControls();
                updateHud();
            }

            function spawnDebris(options = {}) {
                if (state.debris.length >= MAX_DEBRIS) return null;
                const level = state.level;
                const pattern = options.pattern || currentWavePattern();
                const kind = options.kind || chooseDebrisKind(pattern);
                const difficulty = difficultyForLevel(level);
                const size = options.size || (
                    kind === "shard" || kind === "battery" || kind === "foil" ? 1 :
                    kind === "panel" || kind === "antenna" || kind === "solarWing" ? 2 :
                    kind === "satellite" || kind === "cubesat" || kind === "operationalSatellite" || kind === "fuelTank" ? 3 :
                    rand() < Math.min(0.58, 0.34 + level * 0.018) ? 3 : 2
                );
                const radius = options.radius || (
                    kind === "shard" ? rand(5.5, 9.2) :
                    kind === "battery" ? rand(4.8, 7.2) :
                    kind === "foil" ? rand(11, 16) :
                    kind === "antenna" ? rand(10, 15) :
                    kind === "panel" ? rand(12, 18) :
                    kind === "solarWing" ? rand(14, 20) :
                    kind === "fuelTank" ? rand(14, 20) :
                    kind === "cubesat" ? rand(13, 18) :
                    kind === "satellite" ? rand(18, 24) :
                    kind === "operationalSatellite" ? rand(15, 20) :
                    size === 3 ? rand(18, 27) : rand(12, 18)
                );
                const speed = options.speed ?? (
                    kind === "operationalSatellite" ? rand(72 + level * 1.5, 96 + level * 2) :
                    kind === "shard" ? rand(144 + difficulty * 155, 216 + difficulty * 195) :
                    kind === "battery" ? rand(168 + difficulty * 172, 238 + difficulty * 210) :
                    kind === "foil" ? rand(64 + difficulty * 54, 104 + difficulty * 78) :
                    kind === "antenna" ? rand(118 + difficulty * 112, 176 + difficulty * 142) :
                    kind === "panel" ? rand(92 + difficulty * 86, 142 + difficulty * 118) :
                    kind === "solarWing" ? rand(80 + difficulty * 72, 128 + difficulty * 105) :
                    kind === "fuelTank" ? rand(106 + difficulty * 102, 156 + difficulty * 136) :
                    kind === "cubesat" ? rand(114 + difficulty * 114, 166 + difficulty * 144) :
                    kind === "satellite" ? rand(84 + difficulty * 92, 128 + difficulty * 122) :
                    rand(102 + difficulty * 108, 164 + difficulty * 140)
                );
                const drift = Math.sin(level * 1.83) * (18 + difficulty * 42);
                const fromSide = options.fromSide ?? (rand() < pattern.sideChance);
                let x;
                let y;
                let vx;
                let vy;
                if (options.x !== undefined) {
                    x = options.x;
                    y = options.y;
                    vx = options.vx ?? 0;
                    vy = options.vy ?? speed;
                } else if (fromSide) {
                    const left = rand() < 0.5;
                    x = left ? -radius - 12 : WORLD.width + radius + 12;
                    y = rand(PLAY_TOP + 6, WORLD.height * 0.34);
                    vx = (left ? 1 : -1) * rand(44 + difficulty * 40, 92 + difficulty * 68);
                    vy = kind === "shard" || kind === "battery"
                        ? rand(142 + difficulty * 146, 218 + difficulty * 186)
                        : kind === "foil" || kind === "solarWing"
                            ? rand(78 + difficulty * 62, 132 + difficulty * 86)
                            : rand(90 + difficulty * 94, 154 + difficulty * 128);
                } else {
                    x = rand(28, WORLD.width - 28);
                    y = -radius - rand(8, 110);
                    vx = drift + rand(-42 - level * 2, 42 + level * 2);
                    vy = speed;
                    if (pattern.key === "shardRain") {
                        vx *= 0.42;
                    } else if (pattern.key === "crosswind") {
                        vx += rand() < 0.5 ? -rand(36, 80 + level * 4) : rand(36, 80 + level * 4);
                    } else if (pattern.key === "panelDrift") {
                        vx += Math.sin(x * 0.018) * 38;
                    } else if (pattern.key === "salvageStorm") {
                        vx += Math.sin(x * 0.03 + level) * 54;
                    }
                }

                const debris = {
                    kind,
                    waveKey: pattern.key,
                    x,
                    y,
                    vx,
                    vy,
                    r: radius,
                    size,
                    age: 0,
                    hitScale: kind === "battery" || kind === "shard" ? 0.82 : kind === "antenna" || kind === "solarWing" ? 1.18 : kind === "operationalSatellite" ? 0.9 : 1,
                    spin: kind === "operationalSatellite" ? rand(-0.24, 0.24) : kind === "panel" || kind === "solarWing" || kind === "foil" ? rand(-4.8, 4.8) : kind === "shard" || kind === "battery" ? rand(-2.2, 2.2) : rand(-3.2, 3.2),
                    rot: rand(0, Math.PI * 2),
                    seed: rand(0, 1000),
                    fuse: kind === "satellite" || kind === "cubesat" ? rand(1.9, 3.25) : 0,
                    weave: kind === "panel" || kind === "solarWing" || kind === "foil" ? rand(0.7, 1.4) * (rand() < 0.5 ? -1 : 1) : 0,
                    flash: 0,
                    canCascade: options.canCascade ?? (level >= 2 && kind !== "operationalSatellite"),
                    scoredNear: false
                };
                state.debris.push(debris);
                return debris;
            }

            function spawnFragment(source, angle, power, sizeOverride, kindOverride) {
                const size = sizeOverride || Math.max(1, source.size - 1);
                const radius = Math.max(4.5, source.r * rand(0.42, 0.62));
                const vx = source.vx * 0.46 + Math.cos(angle) * power;
                const vy = Math.max(54 + state.level * 5, source.vy * 0.5 + Math.sin(angle) * power);
                const kind = kindOverride || (size <= 1 ? "shard" : source.kind === "satellite" || source.kind === "cubesat" ? "panel" : "chunk");
                return spawnDebris({
                    x: source.x + Math.cos(angle) * source.r * 0.34,
                    y: source.y + Math.sin(angle) * source.r * 0.34,
                    vx,
                    vy,
                    kind,
                    size,
                    radius,
                    speed: power
                });
            }

            function splitDebris(debris, reason = "cascade") {
                if (!debris.canCascade) {
                    createBurst(debris.x, debris.y, reason === "hit" ? "#ffcf6d" : "#a7ecff", 10, 92);
                    debris.remove = true;
                    return 0;
                }
                if (state.debris.length >= MAX_DEBRIS - 2 || debris.size <= 1) {
                    debris.flash = 0.22;
                    return 0;
                }
                const count = debris.kind === "fuelTank" ? 5 : debris.kind === "satellite" ? 4 : debris.kind === "cubesat" ? 3 : debris.size === 3 ? 3 : 2;
                const base = Math.PI / 2 + rand(-0.26, 0.26);
                for (let i = 0; i < count; i += 1) {
                    const angle = base + (i - (count - 1) / 2) * rand(0.44, 0.84) + rand(-0.18, 0.18);
                    let fragmentKind;
                    if (debris.kind === "satellite" || debris.kind === "cubesat") {
                        fragmentKind = i % 3 === 0 ? "panel" : "shard";
                    } else if (debris.kind === "fuelTank") {
                        fragmentKind = i % 2 === 0 ? "battery" : "shard";
                    } else if (debris.kind === "solarWing") {
                        fragmentKind = i === 0 ? "panel" : "shard";
                    } else if (debris.kind === "antenna") {
                        fragmentKind = "shard";
                    }
                    spawnFragment(debris, angle, rand(72, 150 + state.level * 8), undefined, fragmentKind);
                }
                const burstColor = reason === "hit"
                    ? "#ffcf6d"
                    : debris.kind === "satellite" || debris.kind === "cubesat" || debris.kind === "fuelTank"
                        ? "#ff7d6e"
                        : "#a7ecff";
                createBurst(debris.x, debris.y, burstColor, 12 + count * 4, debris.kind === "fuelTank" ? 190 : 120);
                debris.remove = true;
                state.recentCascades += 1;
                return count;
            }

            function createBurst(x, y, color, count, speed = 90) {
                for (let i = 0; i < count && state.particles.length < MAX_PARTICLES; i += 1) {
                    const angle = rand(0, Math.PI * 2);
                    const power = rand(speed * 0.25, speed);
                    state.particles.push({
                        x,
                        y,
                        vx: Math.cos(angle) * power,
                        vy: Math.sin(angle) * power,
                        r: rand(1.4, 4.8),
                        life: rand(0.32, 0.84),
                        maxLife: rand(0.5, 1.0),
                        color
                    });
                }
            }

            function updateInput(dt) {
                let ax = 0;
                let ay = 0;
                if (keys.has("ArrowLeft") || keys.has("a")) ax -= 1;
                if (keys.has("ArrowRight") || keys.has("d")) ax += 1;
                if (keys.has("ArrowUp") || keys.has("w")) ay -= 1;
                if (keys.has("ArrowDown") || keys.has("s")) ay += 1;

                if (state.joystick.active) {
                    const dx = state.joystick.x - state.joystick.originX;
                    const dy = state.joystick.y - state.joystick.originY;
                    const length = Math.hypot(dx, dy);
                    const max = 84;
                    if (length > 4) {
                        ax += dx / Math.max(max, length);
                        ay += dy / Math.max(max, length);
                    }
                }

                if (!state.joystick.active) {
                    const tilt = currentTiltVector();
                    ax += tilt.x;
                    ay += tilt.y;
                }

                const mag = Math.hypot(ax, ay);
                if (mag > 1) {
                    ax /= mag;
                    ay /= mag;
                }
                state.lastInput.x = ax;
                state.lastInput.y = ay;

                const player = state.player;
                if (mag > 0.02) {
                    player.vx += ax * PLAYER_ACCEL * dt;
                    player.vy += ay * PLAYER_ACCEL * dt;
                    player.thrust = Math.min(1, player.thrust + dt * 7);
                    player.angle = Math.atan2(ay, ax);
                } else {
                    player.thrust = Math.max(0, player.thrust - dt * 4.5);
                }

                const speed = Math.hypot(player.vx, player.vy);
                if (speed > PLAYER_MAX_SPEED) {
                    player.vx = player.vx / speed * PLAYER_MAX_SPEED;
                    player.vy = player.vy / speed * PLAYER_MAX_SPEED;
                }

                const drag = Math.max(0, 1 - PLAYER_DRAG * dt);
                player.vx *= drag;
                player.vy *= drag;
                player.x += player.vx * dt;
                player.y += player.vy * dt;

                if (player.x < PLAY_LEFT + PLAYER_RADIUS) {
                    player.x = PLAY_LEFT + PLAYER_RADIUS;
                    player.vx = Math.max(0, player.vx) * 0.45;
                }
                if (player.x > PLAY_RIGHT - PLAYER_RADIUS) {
                    player.x = PLAY_RIGHT - PLAYER_RADIUS;
                    player.vx = Math.min(0, player.vx) * 0.45;
                }
                const topLimit = playerTopLimit();
                if (player.y < topLimit + PLAYER_RADIUS) {
                    player.y = topLimit + PLAYER_RADIUS;
                    player.vy = Math.max(0, player.vy) * 0.45;
                }
                if (player.y > PLAY_BOTTOM - PLAYER_RADIUS) {
                    player.y = PLAY_BOTTOM - PLAYER_RADIUS;
                    player.vy = Math.min(0, player.vy) * 0.45;
                }
            }

            function playerTopLimit() {
                const canvasRect = canvas.getBoundingClientRect();
                const hudRect = document.querySelector(".hud").getBoundingClientRect();
                if (!canvasRect.height) return PLAY_TOP;
                const hudBottomWorld = (hudRect.bottom - canvasRect.top) / canvasRect.height * WORLD.height;
                return Math.max(PLAY_TOP, hudBottomWorld + 28);
            }

            function updatePhase(dt) {
                state.phaseTimer += dt;
                if (state.phase === "cloud" && state.phaseTimer >= state.phaseDuration) {
                    if (state.level >= MAX_LEVEL) {
                        beginReentry();
                        return;
                    }
                    state.phase = "calm";
                    state.phaseTimer = 0;
                    state.phaseDuration = calmDurationForLevel(state.level);
                    state.bannerTimer = 1.35;
                    levelBanner.textContent = copy.bannerCalm(state.level);
                    levelBanner.classList.add("is-visible");
                } else if (state.phase === "calm" && state.phaseTimer >= state.phaseDuration) {
                    state.level += 1;
                    configureCloudPhase(state.level);
                    if (state.level === 2) {
                        state.debris = state.debris.filter((debris) => debris.kind !== "operationalSatellite");
                    }
                    state.bannerTimer = 1.55;
                    levelBanner.textContent = copy.bannerCloud(state.level, currentWaveName());
                    levelBanner.classList.add("is-visible");
                }
            }

            function updateSpawning(dt) {
                state.spawnTimer -= dt;
                const calmFactor = state.phase === "calm" ? 3.3 : 1;
                if (state.spawnTimer <= 0) {
                    const pattern = currentWavePattern();
                    spawnDebris({ pattern });
                    const burstPressure = Math.min(0.2, Math.max(0, state.level - 5) * 0.013);
                    if (pattern.key !== "orbitalTraffic" && rand() < pattern.burstChance + burstPressure) {
                        for (let i = 0; i < pattern.burstCount; i += 1) {
                            spawnDebris({
                                pattern,
                                fromSide: pattern.key === "crosswind" ? true : undefined
                            });
                        }
                    }
                    state.spawnTimer += spawnIntervalForLevel(state.level) * pattern.spawnScale * calmFactor * rand(0.74, 1.28);
                }
            }

            function updateDebris(dt) {
                for (const debris of state.debris) {
                    if (debris.kind === "satellite" || debris.kind === "cubesat") {
                        debris.fuse -= dt;
                        if (debris.fuse < 0.82) {
                            debris.flash = Math.max(debris.flash, 0.08);
                        }
                        if (debris.fuse <= 0) {
                            splitDebris(debris, "cascade");
                            continue;
                        }
                    }
                    if (debris.kind === "panel" || debris.kind === "solarWing" || debris.kind === "foil") {
                        const weavePower = debris.kind === "foil" ? 34 : debris.kind === "solarWing" ? 26 : 22;
                        debris.vx += Math.sin(debris.age * 3.1 + debris.seed) * debris.weave * weavePower * dt;
                    }
                    debris.x += debris.vx * dt;
                    debris.y += debris.vy * dt;
                    debris.age += dt;
                    debris.vx *= Math.max(0, 1 - 0.52 * dt);
                    debris.vy *= Math.max(0, 1 - 0.03 * dt);
                    const kindSpeedBonus = debris.kind === "shard" || debris.kind === "battery"
                        ? 42
                        : debris.kind === "foil" || debris.kind === "solarWing" ? -18
                            : debris.kind === "operationalSatellite" ? -20
                                : debris.kind === "satellite" ? -8
                                : debris.kind === "chunk" || debris.kind === "fuelTank" ? 10 : 0;
                    const minimumDownSpeed = 58 + state.level * 7 + debris.size * 8 + kindSpeedBonus;
                    if (debris.vy < minimumDownSpeed) {
                        debris.vy += (minimumDownSpeed - debris.vy) * Math.min(1, dt * 2.8);
                    }
                    debris.rot += debris.spin * dt;
                    debris.flash = Math.max(0, debris.flash - dt);
                    if (
                        debris.y > WORLD.height + debris.r + DEBRIS_EXIT_MARGIN ||
                        debris.x < -debris.r - 100 ||
                        debris.x > WORLD.width + debris.r + 100 ||
                        (debris.age > 11 && debris.y > PLAY_BOTTOM)
                    ) {
                        debris.remove = true;
                    }
                }
                handleDebrisCollisions();
                handlePlayerCollisions();
                state.debris = state.debris.filter((debris) => !debris.remove);
            }

            function handleDebrisCollisions() {
                state.cascadeTimer -= FIXED_DT;
                if (state.cascadeTimer > 0 || state.debris.length < 2) return;
                let checks = 0;
                const maxChecks = Math.min(760, state.debris.length * 8);
                for (let i = 0; i < state.debris.length && checks < maxChecks; i += 1) {
                    const a = state.debris[i];
                    if (a.remove || !a.canCascade || a.size <= 1) continue;
                    for (let j = i + 1; j < state.debris.length && checks < maxChecks; j += 1) {
                        checks += 1;
                        const b = state.debris[j];
                        if (b.remove || !b.canCascade) continue;
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const rr = (a.r + b.r) * 0.72;
                        if (dx * dx + dy * dy > rr * rr) continue;
                        const rvx = a.vx - b.vx;
                        const rvy = a.vy - b.vy;
                        const relative = Math.hypot(rvx, rvy);
                        const chance = 0.28 + Math.min(0.24, state.level * 0.014);
                        if (relative > 58 && rand() < chance) {
                            splitDebris(a.size >= b.size ? a : b, "cascade");
                            state.cascadeTimer = Math.max(0.025, 0.12 - state.level * 0.004);
                            return;
                        }
                        a.vx += dx * 0.018;
                        a.vy += dy * 0.018;
                        b.vx -= dx * 0.018;
                        b.vy -= dy * 0.018;
                    }
                }
            }

            function handlePlayerCollisions() {
                const player = state.player;
                player.invulnerable = Math.max(0, player.invulnerable - FIXED_DT);
                for (const debris of state.debris) {
                    const dx = player.x - debris.x;
                    const dy = player.y - debris.y;
                    const hitRadius = PLAYER_RADIUS + debris.r * 0.78 * (debris.hitScale || 1);
                    const distanceSq = dx * dx + dy * dy;
                    if (!debris.scoredNear && distanceSq < (hitRadius + 24) * (hitRadius + 24) && distanceSq > hitRadius * hitRadius) {
                        debris.scoredNear = true;
                        state.score += 2 + state.level * 0.35;
                    }
                    if (distanceSq > hitRadius * hitRadius) continue;
                    if (player.invulnerable > 0) {
                        debris.vx -= dx * 2.4;
                        debris.vy -= dy * 2.4;
                        continue;
                    }
                    state.shields -= 1;
                    state.shake = 0.36;
                    player.invulnerable = 1.35;
                    createBurst(player.x, player.y, state.shields <= 0 ? "#ff6969" : "#61d8ff", state.shields <= 0 ? 58 : 34, 210);
                    splitDebris(debris, "hit");
                    debris.remove = true;
                    if (state.shields <= 0) {
                        state.mode = "gameover";
                        state.joystick.active = false;
                        showGameOverMessage();
                    }
                    updateHud();
                    return;
                }
            }

            function spawnAstronaut() {
                if (state.astronautSpawned) return;
                state.astronautSpawned = true;
                state.collectibles.push({
                    x: rand(76, WORLD.width - 76),
                    y: PLAY_TOP - 34,
                    vx: rand(-14, 14),
                    vy: rand(74, 94),
                    r: 15,
                    age: 0,
                    seed: rand(0, 1000),
                    remove: false
                });
            }

            function updateAstronautSpawning(dt) {
                if (state.phase !== "cloud" || state.astronautSpawned || !Number.isFinite(state.astronautTimer)) return;
                state.astronautTimer -= dt;
                if (state.astronautTimer <= 0) spawnAstronaut();
            }

            function rescueAstronaut(astronaut) {
                const restored = state.shields < MAX_SHIELDS;
                state.shields = Math.min(MAX_SHIELDS, state.shields + 1);
                state.astronautsRescued += 1;
                state.score += 100;
                astronaut.remove = true;
                createBurst(astronaut.x, astronaut.y, "#8ef088", 28, 138);
                state.bannerTimer = 1.55;
                levelBanner.textContent = copy.bannerRescue(restored);
                levelBanner.classList.add("is-visible");
            }

            function updateCollectibles(dt) {
                const player = state.player;
                for (const astronaut of state.collectibles) {
                    astronaut.age += dt;
                    astronaut.vx += Math.sin(astronaut.age * 1.8 + astronaut.seed) * 14 * dt;
                    astronaut.vx *= Math.max(0, 1 - dt * 0.42);
                    astronaut.x += astronaut.vx * dt;
                    astronaut.y += astronaut.vy * dt;
                    if (astronaut.x < 34 || astronaut.x > WORLD.width - 34) astronaut.vx *= -0.75;
                    if (astronaut.y > PLAY_BOTTOM + astronaut.r + 28) {
                        astronaut.remove = true;
                        continue;
                    }
                    const radius = PLAYER_RADIUS + astronaut.r * 0.86;
                    const dx = player.x - astronaut.x;
                    const dy = player.y - astronaut.y;
                    if (dx * dx + dy * dy <= radius * radius) rescueAstronaut(astronaut);
                }
                state.collectibles = state.collectibles.filter((astronaut) => !astronaut.remove);
            }

            function beginReentry() {
                state.mode = "reentry";
                state.reentry.active = true;
                state.reentry.timer = 0;
                state.debris.length = 0;
                state.collectibles.length = 0;
                state.joystick.active = false;
                state.player.vx = 0;
                state.player.vy = 0;
                state.player.invulnerable = 0;
                state.lastInput.x = 0;
                state.lastInput.y = 0;
                state.bannerTimer = 2.2;
                levelBanner.textContent = copy.bannerReentry;
                levelBanner.classList.add("is-visible");
            }

            function finishReentry() {
                state.mode = "won";
                state.reentry.active = false;
                state.bannerTimer = 0;
                levelBanner.classList.remove("is-visible");
                saveBest();
                showWinMessage();
            }

            function updateReentry(dt) {
                const reentry = state.reentry;
                reentry.timer += dt;
                state.survivalTime += dt;
                state.score += dt * 24;
                const progress = clamp(reentry.timer / reentry.duration, 0, 1);
                const eased = progress * progress * (3 - 2 * progress);
                const previousX = state.player.x;
                const previousY = state.player.y;
                state.player.x = WORLD.width * 0.5 + Math.sin(progress * Math.PI * 3.2) * (22 - eased * 12);
                state.player.y = 448 + eased * 172;
                state.player.vx = (state.player.x - previousX) / Math.max(dt, 0.001);
                state.player.vy = (state.player.y - previousY) / Math.max(dt, 0.001);
                state.player.thrust = 0.38 + Math.sin(progress * Math.PI * 4) * 0.12;
                if (progress >= 1) finishReentry();
            }

            function updateParticles(dt) {
                for (const particle of state.particles) {
                    particle.x += particle.vx * dt;
                    particle.y += particle.vy * dt;
                    particle.vx *= 0.982;
                    particle.vy *= 0.982;
                    particle.life -= dt;
                }
                state.particles = state.particles.filter((particle) => particle.life > 0);
            }

            function update(dt) {
                if (state.mode === "reentry") {
                    updateReentry(dt);
                    updateParticles(dt);
                    state.shake = Math.max(0, state.shake - dt * 2.8);
                    state.bannerTimer = Math.max(0, state.bannerTimer - dt);
                    if (state.bannerTimer <= 0) levelBanner.classList.remove("is-visible");
                    updateHud();
                    return;
                }
                if (state.mode !== "playing") {
                    updateParticles(dt);
                    return;
                }
                state.survivalTime += dt;
                state.score += dt * (9.4 + state.level * 1.55 + state.debris.length * 0.018);
                updatePhase(dt);
                if (state.mode !== "playing") {
                    updateParticles(dt);
                    updateHud();
                    return;
                }
                updateSpawning(dt);
                updateInput(dt);
                updateAstronautSpawning(dt);
                updateCollectibles(dt);
                updateDebris(dt);
                updateParticles(dt);
                state.shake = Math.max(0, state.shake - dt * 2.8);
                state.bannerTimer = Math.max(0, state.bannerTimer - dt);
                if (state.bannerTimer <= 0) levelBanner.classList.remove("is-visible");
                updateHud();
            }

            function smoothstep(value) {
                const t = clamp(value, 0, 1);
                return t * t * (3 - 2 * t);
            }

            function backgroundSceneForLevel(level = state.level) {
                return state.backgroundScenes[level] || ORBITAL_SCENES[0];
            }

            function sceneBlend() {
                if (state.phase !== "calm" || state.level >= MAX_LEVEL) return 0;
                return smoothstep(state.phaseTimer / Math.max(0.001, state.phaseDuration));
            }

            function campaignProgress() {
                if (state.mode === "reentry" || state.mode === "won") return 1;
                const phaseProgress = clamp(state.phaseTimer / Math.max(0.001, state.phaseDuration), 0, 1);
                const withinLevel = state.phase === "calm"
                    ? 0.82 + phaseProgress * 0.18
                    : phaseProgress * 0.82;
                return clamp((state.level - 1 + withinLevel) / (MAX_LEVEL - 1), 0, 1);
            }

            function backgroundObjectProgress() {
                const phaseProgress = clamp(state.phaseTimer / Math.max(0.001, state.phaseDuration), 0, 1);
                return state.phase === "calm"
                    ? 0.82 + phaseProgress * 0.18
                    : 0.04 + phaseProgress * 0.78;
            }

            function earthTextureScrollProgress(time = state.survivalTime) {
                return ((time / 110) % 1 + 1) % 1;
            }

            function earthOrbitState(time) {
                const approach = campaignProgress();
                const radius = 685 + approach * 190;
                return {
                    x: WORLD.width * 0.5 + Math.sin(time * 0.047) * 48 + Math.cos(time * 0.021) * 10,
                    y: WORLD.height + 318 - approach * 140 + Math.sin(time * 0.036) * 14,
                    radius,
                    approach
                };
            }

            function paletteForScene(scene) {
                const palettes = {
                    earthDay: ["#071d30", "#123e59", "#14233d"],
                    terminator: ["#050b1d", "#152a42", "#3c2340"],
                    sunrise: ["#1a1430", "#9a4f43", "#e08a4f"],
                    moonPass: ["#0b1326", "#1c2941", "#2b4563"],
                    aurora: ["#071b24", "#0c3d45", "#14355b"],
                    highOrbit: ["#060a18", "#101c34", "#28304e"],
                    nightLights: ["#040817", "#16213a", "#31233d"]
                };
                return palettes[scene.key] || palettes.earthDay;
            }

            function drawSpaceGradient(scene, alpha = 1) {
                const [top, middle, bottom] = paletteForScene(scene);
                const gradient = ctx.createLinearGradient(0, 0, WORLD.width, WORLD.height);
                gradient.addColorStop(0, top);
                gradient.addColorStop(0.5, middle);
                gradient.addColorStop(1, bottom);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, WORLD.width, WORLD.height);
                ctx.restore();
            }

            function drawStars(time) {
                ctx.save();
                for (const star of stars) {
                    const y = (star.y + time * star.speed * 0.23) % WORLD.height;
                    ctx.fillStyle = `${star.hue}${star.alpha})`;
                    ctx.beginPath();
                    ctx.arc(star.x, y, star.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            function drawSun(x, y, radius, alpha = 1) {
                ctx.save();
                ctx.globalAlpha = alpha;
                const glow = ctx.createRadialGradient(x, y, radius * 0.22, x, y, radius * 3.1);
                glow.addColorStop(0, "rgba(255, 250, 203, 0.95)");
                glow.addColorStop(0.28, "rgba(255, 191, 98, 0.5)");
                glow.addColorStop(1, "rgba(255, 152, 70, 0)");
                ctx.fillStyle = glow;
                ctx.fillRect(x - radius * 3.1, y - radius * 3.1, radius * 6.2, radius * 6.2);
                ctx.fillStyle = "#ffe29a";
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawMoon(x, y, radius, alpha, time) {
                if (moonSpriteReady && moonSprite.complete && moonSprite.naturalWidth > 0) {
                    const spriteSize = radius * 2.4;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.drawImage(moonSprite, x - spriteSize / 2, y - spriteSize / 2, spriteSize, spriteSize);
                    ctx.restore();
                    return;
                }
                ctx.save();
                ctx.globalAlpha = alpha;
                const surface = ctx.createRadialGradient(x - radius * 0.28, y - radius * 0.3, radius * 0.1, x, y, radius);
                surface.addColorStop(0, "#f1e6cf");
                surface.addColorStop(0.54, "#b8ae9f");
                surface.addColorStop(1, "#5c5b65");
                ctx.fillStyle = surface;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.save();
                ctx.clip();
                ctx.fillStyle = "rgba(72, 72, 81, 0.34)";
                for (let index = 0; index < 8; index += 1) {
                    const angle = index * 1.7 + time * 0.01;
                    const distance = radius * (0.18 + (index % 4) * 0.17);
                    ctx.beginPath();
                    ctx.arc(x + Math.cos(angle) * distance, y + Math.sin(angle) * distance, radius * (0.06 + (index % 3) * 0.035), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
                ctx.restore();
            }

            function risingCelestialPosition(earth, travel, side, time) {
                const rise = clamp((travel - 0.04) / 0.96, 0, 1);
                const horizon = earth.y - earth.radius;
                const inwardTravel = (0.5 - side) * WORLD.width * 0.92 * rise;
                const orbitalCurve = Math.sin(rise * Math.PI) * (side < 0.5 ? 24 : -24);
                return {
                    x: WORLD.width * side + inwardTravel + orbitalCurve + Math.sin(time * 0.025 + side * 8) * 6,
                    y: horizon + 92 - rise * (horizon + 270)
                };
            }

            function mirroredTextureCoordinate(value) {
                const wrapped = ((value % 2) + 2) % 2;
                return wrapped <= 1 ? wrapped : 2 - wrapped;
            }

            function drawProjectedEarthTexture(x, y, radius, time) {
                const sourceSize = Math.min(earthSprite.naturalWidth, earthSprite.naturalHeight) * 0.54;
                const sourceX = (earthSprite.naturalWidth - sourceSize) / 2;
                const sourceY = (earthSprite.naturalHeight - sourceSize) / 2;
                const scroll = earthTextureScrollProgress(time) * 2;
                const bandHeight = radius > 1000 ? 4 : 2;
                const visibleTop = Math.max(0, Math.floor(y - radius));
                const visibleBottom = Math.min(WORLD.height, Math.ceil(y + radius));
                ctx.fillStyle = "#176f9f";
                ctx.fillRect(x - radius, visibleTop, radius * 2, visibleBottom - visibleTop);

                // Compress each texture band to the sphere chord so the surface recedes around the limb.
                for (let bandY = visibleTop; bandY < visibleBottom; bandY += bandHeight) {
                    const sampleY = bandY + bandHeight * 0.5;
                    const sphereY = clamp((sampleY - y) / radius, -1, 1);
                    const halfChord = radius * Math.sqrt(Math.max(0, 1 - sphereY * sphereY));
                    if (halfChord < 1) continue;
                    const latitude = Math.asin(sphereY) / Math.PI + 0.5;
                    const textureV = mirroredTextureCoordinate(latitude - scroll);
                    const sourceBandY = sourceY + textureV * (sourceSize - 2);
                    ctx.drawImage(
                        earthSprite,
                        sourceX,
                        sourceBandY,
                        sourceSize,
                        2,
                        x - halfChord,
                        bandY,
                        halfChord * 2,
                        bandHeight + 1
                    );
                }

                const limbShade = ctx.createRadialGradient(
                    x,
                    y - radius * 0.2,
                    radius * 0.34,
                    x,
                    y,
                    radius * 1.02
                );
                limbShade.addColorStop(0.56, "rgba(3, 19, 36, 0)");
                limbShade.addColorStop(0.82, "rgba(3, 19, 36, 0.08)");
                limbShade.addColorStop(1, "rgba(3, 12, 28, 0.34)");
                ctx.fillStyle = limbShade;
                ctx.fillRect(x - radius, visibleTop, radius * 2, visibleBottom - visibleTop);
            }

            function drawEarthPlanet({ x, y, radius, alpha = 1, night = false, sunrise = false, aurora = false, cityLights = false, lightDirection = -1, time = 0 }) {
                const texturedEarth = earthSpriteReady && earthSprite.complete && earthSprite.naturalWidth > 0;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.clip();
                if (texturedEarth) {
                    drawProjectedEarthTexture(x, y, radius, time);
                    if (sunrise) {
                        ctx.fillStyle = "rgba(255, 154, 89, 0.16)";
                        ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
                    }
                } else {
                    const lightX = x + lightDirection * radius * 0.28;
                    const surface = ctx.createRadialGradient(lightX, y - radius * 0.34, radius * 0.12, x, y, radius * 1.1);
                    surface.addColorStop(0, sunrise ? "#7cd5e8" : "#91d9ee");
                    surface.addColorStop(0.44, sunrise ? "#3c87a2" : "#327ba0");
                    surface.addColorStop(1, "#0b2545");
                    ctx.fillStyle = surface;
                    ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);

                    const continents = [
                        [-0.36, -0.08, 0.28, 0.12, -0.34],
                        [-0.1, 0.16, 0.21, 0.1, 0.62],
                        [0.22, -0.21, 0.29, 0.13, 0.28],
                        [0.37, 0.12, 0.15, 0.08, -0.58],
                        [-0.42, 0.25, 0.16, 0.08, 0.15]
                    ];
                    ctx.fillStyle = sunrise ? "rgba(113, 166, 96, 0.76)" : "rgba(67, 146, 100, 0.72)";
                    for (const [dx, dy, rx, ry, angle] of continents) {
                        ctx.beginPath();
                        ctx.ellipse(x + radius * (dx + Math.sin(time * 0.035) * 0.025), y + radius * dy, radius * rx, radius * ry, angle, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.strokeStyle = "rgba(242, 252, 255, 0.34)";
                    ctx.lineWidth = Math.max(1.1, radius * 0.011);
                    for (let index = 0; index < 6; index += 1) {
                        ctx.beginPath();
                        ctx.ellipse(x + Math.sin(time * 0.08 + index) * radius * 0.1, y + (index - 2.5) * radius * 0.14, radius * (0.46 - index * 0.018), radius * 0.075, -0.2 + index * 0.12, Math.PI * 0.1, Math.PI * 1.06);
                        ctx.stroke();
                    }
                }

                if (night) {
                    const terminator = ctx.createLinearGradient(x - radius, y, x + radius, y);
                    if (lightDirection < 0) {
                        terminator.addColorStop(0, "rgba(3, 9, 24, 0.04)");
                        terminator.addColorStop(0.48, "rgba(3, 9, 24, 0.26)");
                        terminator.addColorStop(1, "rgba(3, 9, 24, 0.94)");
                    } else {
                        terminator.addColorStop(0, "rgba(3, 9, 24, 0.94)");
                        terminator.addColorStop(0.52, "rgba(3, 9, 24, 0.26)");
                        terminator.addColorStop(1, "rgba(3, 9, 24, 0.04)");
                    }
                    ctx.fillStyle = terminator;
                    ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
                }
                if (cityLights) {
                    ctx.fillStyle = "rgba(255, 204, 103, 0.78)";
                    for (let index = 0; index < 18; index += 1) {
                        const angle = index * 2.41;
                        const distance = radius * (0.14 + (index % 5) * 0.11);
                        ctx.beginPath();
                        ctx.arc(x + Math.cos(angle) * distance, y + Math.sin(angle) * distance, 1.1 + (index % 3) * 0.45, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                if (aurora) {
                    ctx.globalCompositeOperation = "lighter";
                    ctx.strokeStyle = "rgba(108, 255, 171, 0.58)";
                    ctx.lineWidth = Math.max(2, radius * 0.024);
                    for (let index = 0; index < 4; index += 1) {
                        ctx.beginPath();
                        ctx.ellipse(x, y - radius * 0.48 + index * radius * 0.06, radius * (0.45 + index * 0.05), radius * 0.11, 0.02, Math.PI * 1.08, Math.PI * 1.92);
                        ctx.stroke();
                    }
                }
                ctx.restore();

                ctx.save();
                ctx.globalAlpha = alpha * (texturedEarth ? 0.38 : 0.78);
                ctx.strokeStyle = sunrise ? "rgba(255, 204, 129, 0.86)" : "rgba(121, 224, 255, 0.74)";
                ctx.lineWidth = Math.max(1.5, radius * 0.018);
                ctx.beginPath();
                ctx.arc(x, y, radius + Math.max(2, radius * 0.018), 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            function drawOrbitalScene(scene, alpha, time, travel = backgroundObjectProgress(), drawCelestial = true) {
                const earth = earthOrbitState(time);
                if (scene.key === "earthDay") {
                    const sun = risingCelestialPosition(earth, travel, 0.84, time);
                    if (drawCelestial) drawSun(sun.x, sun.y, 44, alpha * 0.52);
