<!doctype html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kaskade - Solar Explorer</title>
    <link rel="icon" href="data:," />
    <style>
        :root {
            color-scheme: dark;
            --ink: #f7fbff;
            --muted: #b7c8dd;
            --panel: rgba(9, 19, 35, 0.82);
            --line: rgba(184, 221, 255, 0.24);
            --green: #8ef088;
            --cyan: #61d8ff;
            --amber: #ffcf6d;
            --red: #ff6969;
            --blue: #6e9cff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            overflow: hidden;
        }

        body {
            width: 100vw;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            color: var(--ink);
            background:
                radial-gradient(circle at 22% 15%, rgba(36, 108, 168, 0.42), transparent 34%),
                radial-gradient(circle at 78% 78%, rgba(115, 61, 145, 0.34), transparent 40%),
                linear-gradient(155deg, #030711 0%, #08172a 48%, #101b36 100%);
            font-family: "Avenir Next Condensed", "Gill Sans", "Trebuchet MS", sans-serif;
            touch-action: none;
        }

        .game-shell {
            position: relative;
            width: min(100vw, calc(100dvh * 9 / 16));
            height: min(100dvh, calc(100vw * 16 / 9));
            max-width: 540px;
            max-height: 960px;
            overflow: hidden;
            border: 1px solid rgba(191, 222, 255, 0.26);
            border-radius: clamp(0px, 2.4vw, 18px);
            background: #050b17;
            box-shadow:
                0 26px 70px rgba(0, 0, 0, 0.48),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            isolation: isolate;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .topbar,
        .hud,
        .message,
        .level-banner {
            position: absolute;
            z-index: 3;
        }

        .topbar {
            top: max(0.5rem, env(safe-area-inset-top));
            left: 0.55rem;
            right: 0.55rem;
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            gap: 0.38rem;
            pointer-events: none;
            transition: opacity 0.28s ease;
        }

        .icon-button,
        .start-button,
        .tilt-button {
            appearance: none;
            border: 1px solid rgba(222, 242, 255, 0.32);
            color: var(--ink);
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04)),
                rgba(7, 18, 34, 0.76);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 10px 24px rgba(0, 0, 0, 0.28);
            font: inherit;
            cursor: pointer;
            pointer-events: auto;
        }

        .icon-button {
            width: 2.45rem;
            aspect-ratio: 1 / 1;
            border-radius: 999px;
            display: inline-grid;
            place-items: center;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 800;
            line-height: 1;
        }

        .icon-button.laser-button {
            --laser-charge: 1turn;
            position: absolute;
            right: max(0.9rem, env(safe-area-inset-right));
            bottom: max(1rem, env(safe-area-inset-bottom));
            z-index: 4;
            width: 4.5rem;
            isolation: isolate;
            background:
                radial-gradient(circle at 42% 32%, rgba(255, 255, 255, 0.18), transparent 42%),
                rgba(7, 18, 34, 0.82);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                0 12px 30px rgba(0, 0, 0, 0.38),
                0 0 18px rgba(97, 216, 255, 0.18);
            transition: opacity 0.2s ease, border-color 0.2s ease, filter 0.2s ease;
        }

        .laser-button::before {
            content: "";
            position: absolute;
            inset: 3px;
            border-radius: inherit;
            background: conic-gradient(from -90deg, #61d8ff var(--laser-charge), rgba(97, 216, 255, 0.12) 0);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
            pointer-events: none;
        }

        .laser-icon {
            position: relative;
            width: 1.55rem;
            height: 1.75rem;
            filter: drop-shadow(0 0 5px rgba(97, 216, 255, 0.68));
        }

        .laser-icon::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 0;
            width: 0.24rem;
            height: 1.1rem;
            border-radius: 999px;
            transform: translateX(-50%);
            background: linear-gradient(#ffffff, #61d8ff);
        }

        .laser-icon::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 0.78rem;
            height: 0.5rem;
            border: 2px solid #dffaff;
            border-radius: 0.18rem 0.18rem 0.3rem 0.3rem;
            transform: translateX(-50%);
            background: #174b6c;
        }

        .laser-timer {
            position: absolute;
            inset: 0;
            display: none;
            place-items: center;
            color: #dffaff;
            font-size: 0.94rem;
            font-weight: 900;
            text-shadow: 0 1px 4px #030711;
        }

        .laser-button.is-cooling .laser-icon {
            opacity: 0.42;
        }

        .laser-button.is-cooling .laser-timer {
            display: grid;
        }

        .laser-button.is-active {
            opacity: 1;
            border-color: rgba(220, 255, 255, 0.9);
            box-shadow: 0 0 18px rgba(97, 216, 255, 0.7), inset 0 0 12px rgba(255, 255, 255, 0.2);
            animation: laser-button-pulse 0.36s ease-in-out infinite alternate;
        }

        .laser-button:disabled {
            cursor: default;
        }

        .laser-button.is-cooling {
            opacity: 0.38;
        }

        @keyframes laser-button-pulse {
            from { filter: brightness(0.92); }
            to { filter: brightness(1.24); }
        }

        .icon-button:hover,
        .icon-button:focus-visible,
        .start-button:hover,
        .start-button:focus-visible,
        .tilt-button:hover,
        .tilt-button:focus-visible {
            border-color: rgba(255, 255, 255, 0.62);
            outline: none;
        }

        .title-chip {
            min-width: 0;
            padding: 0.52rem 0.68rem;
            border: 1px solid rgba(179, 218, 255, 0.22);
            border-radius: 999px;
            color: #dff5ff;
            background: rgba(7, 18, 34, 0.62);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
            font-size: clamp(0.73rem, 2.2vw, 0.88rem);
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hud {
            top: 3.55rem;
            left: 0.58rem;
            right: 0.58rem;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.45rem;
            align-items: start;
            pointer-events: none;
            transition: opacity 0.28s ease;
        }

        .game-shell.is-cinematic .topbar,
        .game-shell.is-cinematic .hud,
        .game-shell.is-cinematic .laser-button {
            opacity: 0;
            pointer-events: none;
        }

        .score-stack {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.38rem;
            min-width: 0;
        }

        .chip {
            min-width: 0;
            padding: 0.44rem 0.56rem;
            border: 1px solid rgba(179, 218, 255, 0.2);
            border-radius: 0.7rem;
            background: rgba(7, 18, 34, 0.62);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .chip small {
            display: block;
            color: var(--muted);
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .chip strong {
            display: block;
            margin-top: 0.04rem;
            color: var(--ink);
            font-size: clamp(0.88rem, 3vw, 1.12rem);
            line-height: 1;
            white-space: nowrap;
        }

        .shield-panel {
            display: grid;
            justify-items: end;
            gap: 0.32rem;
        }

        .shield-row {
            display: flex;
            gap: 0.24rem;
        }

        .shield-dot {
            width: 0.72rem;
            aspect-ratio: 1 / 1;
            border-radius: 999px;
            background: radial-gradient(circle at 35% 30%, #f7ffff 0%, #8ae9ff 38%, #246fbd 100%);
            box-shadow: 0 0 12px rgba(97, 216, 255, 0.76);
            opacity: 0.28;
        }

        .shield-dot.is-live {
            opacity: 1;
        }

        .phase-pill {
            width: 8rem;
            box-sizing: border-box;
            padding: 0.4rem 0.52rem;
            border: 1px solid rgba(179, 218, 255, 0.2);
            border-radius: 999px;
            background: rgba(7, 18, 34, 0.62);
            color: #e6f6ff;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-align: center;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
        }

        .message {
            left: 50%;
            top: 50%;
            width: min(86%, 24rem);
            transform: translate(-50%, -50%) scale(0.96);
            display: grid;
            gap: 0.72rem;
            padding: clamp(1rem, 4vw, 1.35rem);
            border: 1px solid rgba(213, 238, 255, 0.28);
            border-radius: 1rem;
            background:
                linear-gradient(145deg, rgba(18, 38, 66, 0.92), rgba(7, 18, 34, 0.78)),
                var(--panel);
            box-shadow:
                0 28px 62px rgba(0, 0, 0, 0.46),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .message.is-visible {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .message.is-win {
            border-color: rgba(255, 218, 128, 0.58);
            background:
                linear-gradient(145deg, rgba(31, 56, 84, 0.96), rgba(9, 27, 46, 0.9)),
                var(--panel);
            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.48),
                0 0 34px rgba(255, 207, 109, 0.2),
                0 0 48px rgba(97, 216, 255, 0.15),
                inset 0 1px 0 rgba(255, 244, 199, 0.2);
        }

        .message.is-win h1 {
            color: #fff2bd;
            text-align: center;
            text-shadow: 0 0 18px rgba(255, 207, 109, 0.24);
        }

        .message.is-win > p {
            text-align: center;
        }

        .message.is-win .stat-line span {
            display: grid;
            gap: 0.2rem;
            border-color: rgba(255, 218, 128, 0.3);
            background: rgba(255, 218, 128, 0.08);
        }

        .message.is-win .stat-line small {
            color: rgba(231, 244, 255, 0.72);
            font-size: 0.58rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .message.is-win .stat-line strong {
            color: #fff8dc;
            font-size: 0.94rem;
        }

        .message.is-win .start-button {
            background: linear-gradient(145deg, #ffe19a, #72e6ff);
        }

        .message[hidden] {
            display: none;
        }

        .message h1 {
            margin: 0;
            font-family: "Copperplate", "Avenir Next Condensed", "Trebuchet MS", sans-serif;
            font-size: clamp(1.35rem, 6vw, 2rem);
            line-height: 1.06;
            letter-spacing: 0.01em;
        }

        .message p {
            margin: 0;
            color: #d8e8fb;
            font-size: clamp(0.88rem, 3.2vw, 1.02rem);
            line-height: 1.36;
        }

        .message .stat-line {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.42rem;
        }

        .message .stat-line[hidden] {
            display: none;
        }

        .message .stat-line span {
            padding: 0.48rem 0.38rem;
            border: 1px solid rgba(190, 224, 255, 0.2);
            border-radius: 0.62rem;
            background: rgba(255, 255, 255, 0.06);
            color: #f7fbff;
            font-size: 0.72rem;
            font-weight: 800;
            text-align: center;
        }

        .start-button {
            min-height: 2.8rem;
            border-radius: 999px;
            color: #06111f;
            background: linear-gradient(145deg, #b8ffd7, #61d8ff);
            font-size: 0.92rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .tilt-controls {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.42rem;
        }

        .tilt-controls[hidden] {
            display: none;
        }

        .tilt-button {
            min-width: 0;
            min-height: 2.25rem;
            border-radius: 0.68rem;
            color: #e9f7ff;
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .tilt-button[aria-pressed="true"] {
            border-color: rgba(142, 240, 136, 0.58);
            background:
                linear-gradient(145deg, rgba(142, 240, 136, 0.22), rgba(97, 216, 255, 0.12)),
                rgba(7, 18, 34, 0.82);
        }

        .tilt-button:disabled {
            cursor: default;
            opacity: 0.45;
        }

        .level-banner {
            left: 50%;
            bottom: 1.1rem;
            transform: translateX(-50%);
            width: max-content;
            max-width: 84%;
            padding: 0.48rem 0.72rem;
            border: 1px solid rgba(196, 231, 255, 0.24);
            border-radius: 999px;
            background: rgba(7, 18, 34, 0.7);
            color: #e9f7ff;
            font-size: 0.76rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .level-banner.is-visible {
            opacity: 1;
        }

        @media (max-width: 390px) {
            .topbar {
                gap: 0.28rem;
            }

            .icon-button {
                width: 2.25rem;
            }

            .icon-button.laser-button {
                right: max(0.75rem, env(safe-area-inset-right));
                bottom: max(0.8rem, env(safe-area-inset-bottom));
                width: 4.1rem;
            }

            .hud {
                top: 3.25rem;
                grid-template-columns: 1fr;
            }

            .shield-panel {
                justify-items: start;
                grid-template-columns: auto auto;
                align-items: center;
            }

            .score-stack {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .chip {
                padding: 0.38rem 0.42rem;
            }

            .chip small {
                font-size: 0.54rem;
            }
        }
    </style>
</head>

<body>
    <main class="game-shell" id="gameShell" aria-label="Kaskade Spiel">
        <canvas id="game" width="540" height="960"></canvas>

        <nav class="topbar" aria-label="Spielsteuerung">
            <a id="backButton" class="icon-button" href="index.html" aria-label="Zurück zur Spielstation" title="Zurück">‹</a>
            <div class="title-chip" id="titleChip">Kaskade</div>
            <button id="pauseButton" class="icon-button" type="button" aria-label="Pause" title="Pause">Ⅱ</button>
            <button id="restartButton" class="icon-button" type="button" aria-label="Neu starten" title="Neu starten">↻</button>
        </nav>

        <button id="laserButton" class="icon-button laser-button" type="button" aria-label="Laser" title="Laser">
            <span class="laser-icon" aria-hidden="true"></span>
            <span class="laser-timer" id="laserTimer" aria-hidden="true"></span>
        </button>

        <section class="hud" aria-label="Status">
            <div class="score-stack">
                <div class="chip">
                    <small id="scoreLabel">Punkte</small>
                    <strong id="scoreValue">0</strong>
                </div>
                <div class="chip">
                    <small id="bestLabel">Bestwert</small>
                    <strong id="bestValue">0</strong>
                </div>
                <div class="chip">
                    <small id="levelLabel">Level</small>
                    <strong id="levelValue">1</strong>
                </div>
            </div>
            <div class="shield-panel">
                <div class="phase-pill" id="phasePill">Wolke</div>
                <div class="shield-row" id="shieldRow" aria-label="Schilde">
                    <span class="shield-dot is-live"></span>
                    <span class="shield-dot is-live"></span>
                    <span class="shield-dot is-live"></span>
                    <span class="shield-dot"></span>
                    <span class="shield-dot"></span>
                    <span class="shield-dot"></span>
                    <span class="shield-dot"></span>
                </div>
            </div>
        </section>

        <section class="message is-visible" id="messagePanel" aria-live="polite">
            <h1 id="messageTitle">Kaskade</h1>
            <p id="messageCopy">Steuere das Raumschiff durch Trümmerwolken. Wenn Teile kollidieren, entstehen neue Splitter.</p>
            <div class="stat-line" id="messageStats" hidden>
                <span id="statA">3 Schilde</span>
                <span id="statB">Wellen</span>
                <span id="statC">Kaskaden</span>
            </div>
            <button id="startButton" class="start-button" type="button">Start</button>
            <div class="tilt-controls" id="tiltControls">
                <button id="tiltToggleButton" class="tilt-button" type="button" aria-pressed="false">Neigung: Aus</button>
                <button id="tiltCalibrateButton" class="tilt-button" type="button">Kalibrieren</button>
            </div>
        </section>

        <div class="level-banner" id="levelBanner">Level 1</div>
    </main>

                    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                };

            function tiltSupported() {
                return "DeviceOrientationEvent" in window || "ondeviceorientation" in window;

            function screenWakeLockSupported() {
                return Boolean(navigator.wakeLock?.request);

            function shouldHoldScreenWakeLock() {
                return state.tilt.enabled &&
                    document.visibilityState === "visible" &&
                    (state.mode === "playing" || state.mode === "reentry");
            }

            async function requestScreenWakeLock() {
                if (!shouldHoldScreenWakeLock() || !screenWakeLockSupported() || screenWakeLock || screenWakeLockRequest) return;
                screenWakeLockRequest = navigator.wakeLock.request("screen");
                try {
                    const lock = await screenWakeLockRequest;
                    if (!shouldHoldScreenWakeLock()) {
                        await lock.release();
                        return;
                    }
                    screenWakeLock = lock;
                    lock.addEventListener("release", () => {
                        if (screenWakeLock === lock) screenWakeLock = null;
                    });
                } catch (error) {
                    // Unsupported policies and low-power modes may reject wake locks.
                } finally {
                    screenWakeLockRequest = null;
                }
            }

            function releaseScreenWakeLock() {
                const lock = screenWakeLock;
                screenWakeLock = null;
                if (lock && !lock.released) lock.release().catch(() => {});
            }

            function syncScreenWakeLock() {
                if (shouldHoldScreenWakeLock()) {
                    void requestScreenWakeLock();
                } else {
                    releaseScreenWakeLock();
                }
            }

            function ensureTiltListener() {
                if (state.tilt.listening) return;
                window.addEventListener("deviceorientation", handleDeviceOrientation);
                state.tilt.listening = true;
            }

            function calibrateTiltControl() {
                if (!state.tilt.lastSeen) {
                    state.tilt.pendingCalibration = true;
                    updateTiltControls();
                    return false;
                }
                state.tilt.baseBeta = state.tilt.beta;
                state.tilt.baseGamma = state.tilt.gamma;
                state.tilt.inputX = 0;
                state.tilt.inputY = 0;
                state.tilt.calibrated = true;
                state.tilt.pendingCalibration = false;
                updateTiltControls();
                return true;
            }

            function tiltAxis(value) {
                if (Math.abs(value) < TILT_DEADZONE) return 0;
                return clamp(value, -1, 1);
            }

            function currentTiltVector(now = performance.now()) {
                if (!state.tilt.enabled || !state.tilt.calibrated || now - state.tilt.lastSeen > TILT_STALE_MS) {
                    state.tilt.inputX = 0;
                    state.tilt.inputY = 0;
                    return { x: 0, y: 0 };
                }
                const x = tiltAxis((state.tilt.gamma - state.tilt.baseGamma) / TILT_RANGE_X);
                const y = tiltAxis((state.tilt.beta - state.tilt.baseBeta) / TILT_RANGE_Y);
                state.tilt.inputX = x;
                state.tilt.inputY = y;
                return { x, y };
            }

            function handleDeviceOrientation(event) {
                const beta = Number(event.beta);
                const gamma = Number(event.gamma);
                if (!Number.isFinite(beta) || !Number.isFinite(gamma)) return;
                state.tilt.available = true;
                state.tilt.permission = state.tilt.permission === "denied" ? "denied" : "granted";
                state.tilt.beta = beta;
                state.tilt.gamma = gamma;
                state.tilt.lastSeen = performance.now();
                if (state.tilt.enabled && (state.tilt.pendingCalibration || !state.tilt.calibrated)) {
                    calibrateTiltControl();
                } else {
                    updateTiltControls();
                }
            }

            async function enableTiltControl() {
                if (!tiltSupported()) {
                    state.tilt.permission = "unavailable";
                    updateTiltControls();
                    return false;
                }
                ensureTiltListener();
                try {
                    const orientationEvent = window.DeviceOrientationEvent;
                    if (orientationEvent && typeof orientationEvent.requestPermission === "function") {
                        const permission = await orientationEvent.requestPermission();
                        if (permission !== "granted") {
                            state.tilt.enabled = false;
                            state.tilt.permission = "denied";
                            updateTiltControls();
                            return false;
                        }
                    }
                } catch (error) {
                    state.tilt.enabled = false;
                    state.tilt.permission = "denied";
                    updateTiltControls();
                    return false;
                }
                state.tilt.enabled = true;
                state.tilt.permission = "granted";
                state.tilt.pendingCalibration = true;
                calibrateTiltControl();
                updateTiltControls();
                syncScreenWakeLock();
                return true;
            }

            function shuffle(items) {
                const shuffled = [...items];
                for (let index = shuffled.length - 1; index > 0; index -= 1) {
                    const other = Math.floor(rand(0, index + 1));
                    [shuffled[index], shuffled[other]] = [shuffled[other], shuffled[index]];
                }
                return shuffled;
            }

            function buildRunThemes() {
                const themes = {
                    1: ORBITAL_TRAFFIC_PATTERN,
                    2: WAVE_PATTERNS.find((pattern) => pattern.key === "satelliteBreakup")
                };
                let previous = themes[2].key;
                let bag = [];
                for (let level = 3; level <= MAX_LEVEL; level += 1) {
                    if (!bag.length) {
                        bag = shuffle(WAVE_PATTERNS);
                        if (bag[0].key === previous) {
                            [bag[0], bag[1]] = [bag[1], bag[0]];
                        }
                    }
                    const pattern = bag.shift();
                    themes[level] = pattern;
                    previous = pattern.key;
                }
                return themes;
            }

            function buildRunScenery() {
                const scenes = { 1: ORBITAL_SCENES.find((scene) => scene.key === "earthDay") };
                let previous = scenes[1].key;
                let bag = [];
                for (let level = 2; level <= MAX_LEVEL; level += 1) {
                    if (!bag.length) {
                        bag = shuffle(ORBITAL_SCENES);
                        if (bag[0].key === previous) {
                            [bag[0], bag[1]] = [bag[1], bag[0]];
                        }
                    }
                    const scene = bag.shift();
                    scenes[level] = scene;
                    previous = scene.key;
                }
                return scenes;
            }

                state.reentry.startX = WORLD.width * 0.5;
                state.reentry.startY = 760;
                state.player.x = WORLD.width * 0.5;
                state.player.y = 760;
                state.player.vx = 0;
                state.player.vy = 0;
                state.player.invulnerable = 0;
                state.player.thrust = 0;
                state.player.angle = -Math.PI / 2;
                state.joystick.active = false;
                state.joystick.id = null;
                state.debris.length = 0;
                state.collectibles.length = 0;
                state.particles.length = 0;
                state.lastInput.x = 0;
                state.lastInput.y = 0;
                configureCloudPhase(state.level);
                if (reviewMode === "ending") {
                    state.phase = "cloud";
                    state.phaseDuration = cloudDurationForLevel(state.level);
                    state.phaseTimer = Math.max(0, state.phaseDuration - 2.4);
                    state.spawnTimer = 999;
                    state.astronautTimer = Infinity;
                    [
                        { kind: "panel", x: 112, y: 168, vx: 38, vy: 104, size: 2, radius: 15 },
                        { kind: "chunk", x: 398, y: 246, vx: -52, vy: 132, size: 3, radius: 21 },
                        { kind: "shard", x: 252, y: 412, vx: 74, vy: 92, size: 1, radius: 7 },
                        { kind: "fuelTank", x: 458, y: 66, vx: -24, vy: 126, size: 3, radius: 18 }
                    ].forEach((debris) => spawnDebris({
                        ...debris,
                        velocityScale: 1,
                        canCollide: false,
                        canCascade: false
                    }));
                }
                showReadyMessage();
                updateHud();
                syncScreenWakeLock();
                render();
            }

            function startGame() {
                if (state.mode === "playing") return;
                if (state.mode === "gameover" || state.mode === "won") {
                    restartGame();
                    return;
                }
                if (state.mode === "ready") {
                    state.mode = "playing";
                    state.bannerTimer = 0;
                    messagePanel.classList.remove("is-visible");
                    messagePanel.hidden = true;
                    levelBanner.classList.remove("is-visible");
                    syncScreenWakeLock();
                    return;
                }
                if (state.mode === "paused") {
                    state.mode = "playing";
                    messagePanel.classList.remove("is-visible");
                    messagePanel.hidden = true;
                }
                syncScreenWakeLock();
            }

            function restartGame() {
                resetGame();
                startGame();
            }

            function togglePause() {
                if (state.mode === "ready") {
                    startGame();
                    return;
                }
                if (state.mode === "gameover") {
                    restartGame();
                    return;
                }
                if (state.mode === "won") {
                    restartGame();
                    return;
                }
                if (state.mode === "reentry") return;
                if (state.mode === "paused") {
                    state.mode = "playing";
                    messagePanel.classList.remove("is-visible");
                    messagePanel.hidden = true;
                } else if (state.mode === "playing") {
                    state.mode = "paused";
                    showPausedMessage();
                }
                syncScreenWakeLock();
                updateHud();
            }

            function cloudDurationForLevel(level) {
                return Math.min(20.4, 11.6 + level * 0.35);
            }

            function calmDurationForLevel(level) {
                return Math.max(1.5, 3.1 - level * 0.062);
            }

            function spawnIntervalForLevel(level) {
                const progress = clamp((level - 1) / (MAX_LEVEL - 1), 0, 1);
                const latePressure = Math.max(0, (progress - 0.46) / 0.54);
                return Math.max(0.22, 0.84 - progress * 0.37 - latePressure * 0.2);
            }

            function showReadyMessage() {
                messagePanel.classList.remove("is-win");
                messagePanel.hidden = false;
                tiltControls.hidden = false;
                messageTitle.textContent = reviewMode === "late"
                    ? copy.reviewLateTitle
                    : reviewMode === "ending" ? copy.reviewEndingTitle : copy.readyTitle;
                messageCopy.textContent = reviewMode === "late"
                    ? copy.reviewLateCopy
                    : reviewMode === "ending" ? copy.reviewEndingCopy : copy.readyCopy;
                statA.textContent = reviewMode ? `${copy.level} ${state.level}` : copy.readyA;
                statB.textContent = reviewMode ? copy.reviewInvincible : copy.readyB;
                statC.textContent = reviewMode === "ending" ? copy.phaseReentry : reviewMode === "late" ? "21–25" : copy.readyC;
                messageStats.hidden = true;
                startButton.textContent = reviewMode ? copy.reviewStart : copy.start;
                updateTiltControls();
                messagePanel.classList.add("is-visible");
            }

            function showPausedMessage() {
                messagePanel.classList.remove("is-win");
                messagePanel.hidden = false;
                tiltControls.hidden = false;
                messageTitle.textContent = copy.pausedTitle;
                messageCopy.textContent = copy.pausedCopy;
                statA.textContent = `${Math.floor(state.score)}`;
                statB.textContent = `${copy.level} ${state.level}`;
                statC.textContent = `${state.shields}/${MAX_SHIELDS}`;
                messageStats.hidden = true;
                startButton.textContent = copy.resume;
                updateTiltControls();
                messagePanel.classList.add("is-visible");
            }

            function showGameOverMessage() {
                messagePanel.classList.remove("is-win");
                saveBest();
                messagePanel.hidden = false;
                tiltControls.hidden = false;
                messageTitle.textContent = copy.gameOverTitle;
                messageCopy.textContent = copy.gameOverCopy;
                statA.textContent = `${Math.floor(state.score)}`;
                statB.textContent = `${copy.level} ${state.level}`;
                statC.textContent = `${Math.floor(state.survivalTime)}s`;
                messageStats.hidden = false;
                startButton.textContent = copy.again;
                updateTiltControls();
                messagePanel.classList.add("is-visible");
            }

            function setWinStat(element, label, value) {
                const labelElement = document.createElement("small");
                const valueElement = document.createElement("strong");
                labelElement.textContent = label;
                valueElement.textContent = String(value);
                element.replaceChildren(labelElement, valueElement);
            }

            function showWinMessage() {
                messagePanel.hidden = false;
                tiltControls.hidden = false;
                messagePanel.classList.add("is-win");
                messageTitle.textContent = copy.wonTitle;
                messageCopy.textContent = copy.wonCopy(VICTORY_BONUS);
                setWinStat(statA, copy.score, Math.floor(state.score));
                setWinStat(statB, copy.highscore, Math.max(state.best, Math.floor(state.score)));
                setWinStat(statC, copy.rescued, state.astronautsRescued);
                messageStats.hidden = false;
                startButton.textContent = copy.againVictory;
                updateTiltControls();
                messagePanel.classList.add("is-visible");
            }

            function updateHud() {
                scoreValue.textContent = String(Math.floor(state.score));
                bestValue.textContent = String(Math.max(state.best, Math.floor(state.score)));
                levelValue.textContent = String(state.level);
                phasePill.textContent = state.mode === "reentry"
                    ? copy.phaseReentry
                    : state.mode === "won"
                        ? copy.phaseWon
                        : state.phase === "cloud" ? currentWaveName() : copy.phaseCalm;
                pauseButton.textContent = state.mode === "paused" ? "▶" : "Ⅱ";
                pauseButton.setAttribute("aria-label", state.mode === "paused" ? copy.resume : copy.pause);
                pauseButton.title = state.mode === "paused" ? copy.resume : copy.pause;
                [...shieldRow.children].forEach((dot, index) => {
                    dot.classList.toggle("is-live", index < state.shields);
                });
                const laser = state.laser;
                const cooling = !laser.active && laser.cooldown > 0;
                const charge = laser.active
                    ? laser.remaining / LASER_DURATION
                    : cooling ? 1 - laser.cooldown / LASER_COOLDOWN : 1;
                const seconds = Math.ceil(laser.active ? laser.remaining : laser.cooldown);
                const laserLabel = laser.active
                    ? copy.laserActive(seconds)
                    : cooling ? copy.laserCooldown(seconds) : copy.laserReady;
                laserButton.classList.toggle("is-active", laser.active);
                laserButton.classList.toggle("is-cooling", cooling);
                laserButton.style.setProperty("--laser-charge", `${clamp(charge, 0, 1)}turn`);
                laserButton.disabled = state.mode !== "playing" || laser.active || cooling;
                laserButton.setAttribute("aria-label", laserLabel);
                laserButton.title = laserLabel;
                laserTimer.textContent = cooling ? String(seconds) : "";
            }

            function applyLanguage(nextLanguage) {
                language = nextLanguage;
                copy = copyByLanguage[language];
                document.documentElement.lang = language;
                document.title = copy.documentTitle;
                shell.setAttribute("aria-label", copy.shellAria);
                document.querySelector(".topbar").setAttribute("aria-label", copy.controlsAria);
                document.querySelector(".hud").setAttribute("aria-label", copy.statusAria);
                backButton.href = localizedUrl("index.html", language);
                backButton.setAttribute("aria-label", copy.back);
                backButton.title = copy.back;
                restartButton.setAttribute("aria-label", copy.restart);
                restartButton.title = copy.restart;
                scoreLabel.textContent = copy.score;
                bestLabel.textContent = copy.best;
                levelLabel.textContent = copy.level;
                shieldRow.setAttribute("aria-label", copy.shieldAria);
                if (state.mode === "ready") showReadyMessage();
                if (state.mode === "paused") showPausedMessage();
                if (state.mode === "gameover") showGameOverMessage();
                if (state.mode === "won") showWinMessage();
                updateTiltControls();
                updateHud();
            }

            function spawnDebris(options = {}) {
                if (state.debris.length >= MAX_DEBRIS) return null;
                const level = state.level;
                const pattern = options.pattern || currentWavePattern();
                const kind = options.kind || chooseDebrisKind(pattern);
                const difficulty = difficultyForLevel(level);
                const size = options.size || (
                    kind === "shard" || kind === "battery" || kind === "foil" ? 1 :
                    kind === "panel" || kind === "antenna" || kind === "solarWing" ? 2 :
                    kind === "satellite" || kind === "cubesat" || kind === "operationalSatellite" || kind === "fuelTank" ? 3 :
                    rand() < Math.min(0.58, 0.34 + level * 0.018) ? 3 : 2
                );
                const radius = options.radius || (
                    kind === "shard" ? rand(5.5, 9.2) :
                    kind === "battery" ? rand(4.8, 7.2) :
                    kind === "foil" ? rand(11, 16) :
                    kind === "antenna" ? rand(10, 15) :
                    kind === "panel" ? rand(12, 18) :
                    kind === "solarWing" ? rand(14, 20) :
                    kind === "fuelTank" ? rand(14, 20) :
                    kind === "cubesat" ? rand(13, 18) :
                    kind === "satellite" ? rand(18, 24) :
                    kind === "operationalSatellite" ? rand(15, 20) :
                    size === 3 ? rand(18, 27) : rand(12, 18)
                );
                const speed = options.speed ?? (
                    kind === "operationalSatellite" ? rand(72 + level * 1.5, 96 + level * 2) :
                    kind === "shard" ? rand(144 + difficulty * 155, 216 + difficulty * 195) :
                    kind === "battery" ? rand(168 + difficulty * 172, 238 + difficulty * 210) :
                    kind === "foil" ? rand(64 + difficulty * 54, 104 + difficulty * 78) :
                    kind === "antenna" ? rand(118 + difficulty * 112, 176 + difficulty * 142) :
                    kind === "panel" ? rand(92 + difficulty * 86, 142 + difficulty * 118) :
                    kind === "solarWing" ? rand(80 + difficulty * 72, 128 + difficulty * 105) :
                    kind === "fuelTank" ? rand(106 + difficulty * 102, 156 + difficulty * 136) :
                    kind === "cubesat" ? rand(114 + difficulty * 114, 166 + difficulty * 144) :
                    kind === "satellite" ? rand(84 + difficulty * 92, 128 + difficulty * 122) :
                    rand(102 + difficulty * 108, 164 + difficulty * 140)
                );
                const drift = Math.sin(level * 1.83) * (18 + difficulty * 42);
                const fromSide = options.fromSide ?? (!SATELLITE_KINDS.has(kind) && rand() < pattern.sideChance);
                let x;
                let y;
                let vx;
                let vy;
                if (options.x !== undefined) {
                    x = options.x;
                    y = options.y;
                    vx = options.vx ?? 0;
                    vy = options.vy ?? speed;
                } else if (fromSide) {
                    const left = rand() < 0.5;
                    x = left ? -radius - 12 : WORLD.width + radius + 12;
                    y = rand(PLAY_TOP + 6, WORLD.height * 0.34);
                    vx = (left ? 1 : -1) * rand(44 + difficulty * 40, 92 + difficulty * 68);
                    vy = kind === "shard" || kind === "battery"
                        ? rand(142 + difficulty * 146, 218 + difficulty * 186)
                        : kind === "foil" || kind === "solarWing"
                            ? rand(78 + difficulty * 62, 132 + difficulty * 86)
                            : rand(90 + difficulty * 94, 154 + difficulty * 128);
                } else {
                    x = rand(28, WORLD.width - 28);
                    y = -radius - rand(8, 110);
                    vx = drift + rand(-42 - level * 2, 42 + level * 2);
                    vy = speed;
                    if (SATELLITE_KINDS.has(kind)) {
                        vx *= 0.28;
                    } else if (pattern.key === "shardRain") {
                        vx *= 0.42;
                    } else if (pattern.key === "crosswind") {
                        vx += rand() < 0.5 ? -rand(36, 80 + level * 4) : rand(36, 80 + level * 4);
                    } else if (pattern.key === "panelDrift") {
                        vx += Math.sin(x * 0.018) * 38;
                    } else if (pattern.key === "salvageStorm") {
                        vx += Math.sin(x * 0.03 + level) * 54;
                    }
                }

                const velocityScale = options.velocityScale ?? DEBRIS_SPEED_MULTIPLIER;
                const speedFactor = options.x === undefined
                    ? rand(level === 1 ? 0.68 : 0.5, level === 1 ? 1.34 : 1.62)
                    : 1;
                vx *= velocityScale * (0.78 + speedFactor * 0.22);
                vy *= velocityScale * speedFactor;

                const debris = {
                    kind,
                    waveKey: pattern.key,
                    x,
                    y,
                    vx,
                    vy,
                    speedFactor,
                    r: radius,
                    size,
                    age: 0,
                    hitScale: kind === "battery" || kind === "shard" ? 0.82 : kind === "antenna" || kind === "solarWing" ? 1.18 : kind === "operationalSatellite" ? 0.9 : 1,
                    spin: SATELLITE_KINDS.has(kind) ? 0 : kind === "panel" || kind === "solarWing" || kind === "foil" ? rand(-4.8, 4.8) : kind === "shard" || kind === "battery" ? rand(-2.2, 2.2) : rand(-3.2, 3.2),
                    rot: rand(0, Math.PI * 2),
                    satelliteVariant: SATELLITE_KINDS.has(kind) ? Math.floor(rand(0, 5)) : null,
                    seed: rand(0, 1000),
                    weave: kind === "panel" || kind === "solarWing" || kind === "foil" ? rand(0.7, 1.4) * (rand() < 0.5 ? -1 : 1) : 0,
                    flash: 0,
                    laserGlow: 0,
                    laserHeat: 0,
                    laserHeating: false,
                    collisionGrace: options.x !== undefined ? 0.22 : 0,
                    laserDeflected: 0,
                    laserHitCooldown: 0,
                    canCollide: options.canCollide ?? true,
                    canCascade: options.canCascade ?? (level >= 2 || SATELLITE_KINDS.has(kind)),
                    scoredNear: false
                };
                state.debris.push(debris);
                return debris;
            }

            function spawnFragment(source, angle, power, sizeOverride, kindOverride) {
                const size = sizeOverride || Math.max(1, source.size - 1);
                const radius = Math.max(4.5, source.r * rand(0.42, 0.62));
                const fragmentPower = power * DEBRIS_SPEED_MULTIPLIER;
                const vx = source.vx * 0.46 + Math.cos(angle) * fragmentPower;
                const vy = Math.max((54 + state.level * 5) * DEBRIS_SPEED_MULTIPLIER, source.vy * 0.5 + Math.sin(angle) * fragmentPower);
                const kind = kindOverride || (size <= 1 ? "shard" : source.kind === "satellite" || source.kind === "cubesat" ? "panel" : "chunk");
                return spawnDebris({
                    x: source.x + Math.cos(angle) * source.r * 0.34,
                    y: source.y + Math.sin(angle) * source.r * 0.34,
                    vx,
                    vy,
                    kind,
                    size,
                    radius,
                    speed: fragmentPower,
                    velocityScale: 1
                });
            }

            function explodeFuelTank(debris) {
                if (debris.remove) return 0;
                let clearedFragments = 0;
                for (const other of state.debris) {
                    if (other === debris || other.remove) continue;
                    const dx = other.x - debris.x;
                    const dy = other.y - debris.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance <= 0 || distance >= FUEL_BLAST_RADIUS) continue;
                    if (other.size <= 1 && distance < FUEL_FRAGMENT_CLEAR_RADIUS) {
                        other.remove = true;
                        clearedFragments += 1;
                        createBurst(other.x, other.y, "#ffd69a", 5, 76);
                        continue;
                    }
                    const impulse = (1 - distance / FUEL_BLAST_RADIUS) * 118;
                    other.vx += dx / distance * impulse;
                    other.vy += dy / distance * impulse;
                    other.flash = Math.max(other.flash, 0.22);
                    other.collisionGrace = Math.max(other.collisionGrace, 0.28);
                }

                const playerDistance = Math.hypot(state.player.x - debris.x, state.player.y - debris.y);
                if (playerDistance < FUEL_PLAYER_BLAST_RADIUS + PLAYER_RADIUS) {
                    applyShieldDamage("#ff8658", 0.52);
                }

                const shardCount = 2 + Math.floor(rand(0, 2));
                for (let index = 0; index < shardCount; index += 1) {
                    const angle = rand(0, Math.PI * 2);
                    const power = rand(94, 148);
                    const shard = spawnDebris({
                        x: debris.x + Math.cos(angle) * debris.r * 0.5,
                        y: debris.y + Math.sin(angle) * debris.r * 0.5,
                        vx: debris.vx * 0.5 + Math.cos(angle) * power,
                        vy: debris.vy * 0.5 + Math.sin(angle) * power,
                        kind: "shard",
                        size: 1,
                        radius: rand(4.8, 7.2),
                        velocityScale: 1,
                        canCascade: true
                    });
                    if (shard) shard.collisionGrace = 0.32;
                }
                createShockwave(debris.x, debris.y, "#ff8a55", FUEL_BLAST_RADIUS, 0.58);
                createShockwave(debris.x, debris.y, "#ffe2a1", FUEL_FRAGMENT_CLEAR_RADIUS, 0.42);
                createBurst(debris.x, debris.y, "#ff623f", 54, 270);
                createBurst(debris.x, debris.y, "#ffd88f", 30, 178);
                debris.remove = true;
                state.recentCascades += 1;
                state.score += clearedFragments;
                return shardCount;
            }

            function splitDebris(debris, reason = "cascade") {
                if (debris.kind === "fuelTank") return explodeFuelTank(debris);
                if (!debris.canCascade) {
                    createBurst(debris.x, debris.y, reason === "hit" ? "#ffcf6d" : "#a7ecff", 10, 92);
                    debris.remove = true;
                    return 0;
                }
                if (state.debris.length >= MAX_DEBRIS - 2 || debris.size <= 1) {
                    debris.flash = 0.22;
                    return 0;
                }
                const count = debris.kind === "satellite" || debris.kind === "operationalSatellite" ? 4 : debris.kind === "cubesat" ? 3 : debris.size === 3 ? 3 : 2;
                const base = Math.PI / 2 + rand(-0.26, 0.26);
                for (let i = 0; i < count; i += 1) {
                    const angle = base + (i - (count - 1) / 2) * rand(0.44, 0.84) + rand(-0.18, 0.18);
                    let fragmentKind;
                    if (SATELLITE_KINDS.has(debris.kind)) {
                        fragmentKind = i % 3 === 0 ? "panel" : "shard";
                    } else if (debris.kind === "solarWing") {
                        fragmentKind = i === 0 ? "panel" : "shard";
                    } else if (debris.kind === "antenna") {
                        fragmentKind = "shard";
                    }
                    spawnFragment(debris, angle, rand(72, 150 + state.level * 8), undefined, fragmentKind);
                }
                const burstColor = reason === "hit"
                    ? "#ffcf6d"
                    : SATELLITE_KINDS.has(debris.kind)
                        ? "#ff7d6e"
                        : "#a7ecff";
                createBurst(debris.x, debris.y, burstColor, 12 + count * 4, 120);
                debris.remove = true;
                state.recentCascades += 1;
                return count;
            }

            function createBurst(x, y, color, count, speed = 90) {
                for (let i = 0; i < count && state.particles.length < MAX_PARTICLES; i += 1) {
                    const angle = rand(0, Math.PI * 2);
                    const power = rand(speed * 0.25, speed);
                    state.particles.push({
                        x,
                        y,
                        vx: Math.cos(angle) * power,
                        vy: Math.sin(angle) * power,
                        r: rand(1.4, 4.8),
                        life: rand(0.32, 0.84),
                        maxLife: rand(0.5, 1.0),
                        color
                    });
                }
            }

            function createShockwave(x, y, color, radius, duration) {
                if (state.particles.length >= MAX_PARTICLES) return;
                state.particles.push({
                    type: "shockwave",
                    x,
                    y,
                    vx: 0,
                    vy: 0,
                    r: 8,
                    startR: 8,
                    targetR: radius,
                    life: duration,
                    maxLife: duration,
                    color
                });
            }

            function updateInput(dt) {
                let ax = 0;
                let ay = 0;
                if (keys.has("ArrowLeft") || keys.has("a")) ax -= 1;
                if (keys.has("ArrowRight") || keys.has("d")) ax += 1;
                if (keys.has("ArrowUp") || keys.has("w")) ay -= 1;
                if (keys.has("ArrowDown") || keys.has("s")) ay += 1;

                if (state.joystick.active) {
                    const dx = state.joystick.x - state.joystick.originX;
                    const dy = state.joystick.y - state.joystick.originY;
                    const length = Math.hypot(dx, dy);
                    const max = 84;
                    if (length > 4) {
                        ax += dx / Math.max(max, length);
                        ay += dy / Math.max(max, length);
                    }
                }

                if (!state.joystick.active) {
                    const tilt = currentTiltVector();
                    ax += tilt.x;
                    ay += tilt.y;
                }

                const mag = Math.hypot(ax, ay);
                if (mag > 1) {
                    ax /= mag;
                    ay /= mag;
                }
                state.lastInput.x = ax;
                state.lastInput.y = ay;

                const player = state.player;
                if (mag > 0.02) {
                    player.vx += ax * PLAYER_ACCEL * dt;
                    player.vy += ay * PLAYER_ACCEL * dt;
                    player.thrust = Math.min(1, player.thrust + dt * 7);
                    player.angle = Math.atan2(ay, ax);
                } else {
                    player.thrust = Math.max(0, player.thrust - dt * 4.5);
                }

                const speed = Math.hypot(player.vx, player.vy);
                if (speed > PLAYER_MAX_SPEED) {
                    player.vx = player.vx / speed * PLAYER_MAX_SPEED;
                    player.vy = player.vy / speed * PLAYER_MAX_SPEED;
                }

                const drag = Math.max(0, 1 - PLAYER_DRAG * dt);
                player.vx *= drag;
                player.vy *= drag;
                player.x += player.vx * dt;
                player.y += player.vy * dt;

                if (player.x < PLAY_LEFT + PLAYER_RADIUS) {
                    player.x = PLAY_LEFT + PLAYER_RADIUS;
                    player.vx = Math.max(0, player.vx) * 0.45;
                }
                if (player.x > PLAY_RIGHT - PLAYER_RADIUS) {
                    player.x = PLAY_RIGHT - PLAYER_RADIUS;
                    player.vx = Math.min(0, player.vx) * 0.45;
                }
                const topLimit = playerTopLimit();
                if (player.y < topLimit + PLAYER_RADIUS) {
                    player.y = topLimit + PLAYER_RADIUS;
                    player.vy = Math.max(0, player.vy) * 0.45;
                }
                if (player.y > PLAY_BOTTOM - PLAYER_RADIUS) {
                    player.y = PLAY_BOTTOM - PLAYER_RADIUS;
                    player.vy = Math.min(0, player.vy) * 0.45;
                }
            }

            function playerTopLimit() {
                const canvasRect = canvas.getBoundingClientRect();
                const hudRect = document.querySelector(".hud").getBoundingClientRect();
                if (!canvasRect.height) return PLAY_TOP;
                const hudBottomWorld = (hudRect.bottom - canvasRect.top) / canvasRect.height * WORLD.height;
                return Math.max(PLAY_TOP, hudBottomWorld + 28);
            }

            function updatePhase(dt) {
                state.phaseTimer += dt;
                if (state.phase === "cloud" && state.phaseTimer >= state.phaseDuration) {
                    if (state.level >= MAX_LEVEL) {
                        beginReentry();
                        return;
                    }
                    state.phase = "calm";
                    state.phaseTimer = 0;
                    state.phaseDuration = calmDurationForLevel(state.level);
                } else if (state.phase === "calm" && state.phaseTimer >= state.phaseDuration) {
                    state.level += 1;
                    configureCloudPhase(state.level);
                }
            }

            function updateSpawning(dt) {
                state.spawnTimer -= dt;
                const calmFactor = state.phase === "calm" ? 3.3 : 1;
                if (state.spawnTimer <= 0) {
                    const pattern = currentWavePattern();
                    spawnDebris({ pattern });
                    const burstPressure = Math.min(0.14, Math.max(0, state.level - 5) * 0.009);
                    if (pattern.key !== "orbitalTraffic" && rand() < pattern.burstChance + burstPressure) {
                        for (let i = 0; i < pattern.burstCount; i += 1) {
                            spawnDebris({
                                pattern,
                                fromSide: pattern.key === "crosswind" ? true : undefined
                            });
                        }
                    }
                    state.spawnTimer += spawnIntervalForLevel(state.level) * pattern.spawnScale * calmFactor * rand(0.74, 1.28);
                }
            }

            function activateLaser() {
                const laser = state.laser;
                if (state.mode !== "playing" || laser.active || laser.cooldown > 0) return false;
                laser.active = true;
                laser.remaining = LASER_DURATION;
                laser.sparkCooldown = 0;
                updateHud();
                return true;
            }

            function applyLaserToDebris(dt) {
                const beamX = state.player.x;
                const beamBottom = state.player.y - SHIP_SPRITE_HEIGHT * 0.42;
                const debrisCount = state.debris.length;
                for (let index = 0; index < debrisCount; index += 1) {
                    const debris = state.debris[index];
                    if (debris.remove || debris.y - debris.r > beamBottom) continue;
                    const hitWidth = LASER_HALF_WIDTH + debris.r * 0.72 * (debris.hitScale || 1);
                    const offsetX = debris.x - beamX;
                    if (Math.abs(offsetX) > hitWidth) continue;
                    if (debris.kind === "fuelTank") {
                        debris.laserHeating = true;
                        debris.laserHeat = Math.min(1, debris.laserHeat + dt / FUEL_LASER_DETONATION_TIME);
                        debris.flash = Math.max(debris.flash, 0.08);
                        debris.vy -= LASER_PUSH_FORCE * dt * 0.18;
                        if (debris.laserHitCooldown <= 0) {
                            debris.laserHitCooldown = LASER_SPARK_INTERVAL;
                            if (state.laser.sparkCooldown <= 0) {
                                createBurst(debris.x, debris.y, "#ff9a62", 1, 34);
                                state.laser.sparkCooldown = 0.055;
                            }
                        }
                        if (debris.laserHeat >= 1 - 1e-6) explodeFuelTank(debris);
                        continue;
                    }
                    if (debris.size <= 1) {
                        debris.remove = true;
                        state.laser.disintegrated += 1;
                        createBurst(debris.x, debris.y, "#b8f6ff", 6, 92);
                        continue;
                    }

                    const firstDeflection = debris.laserDeflected <= 0;
                    const side = Math.abs(offsetX) > 0.5 ? Math.sign(offsetX) : Math.sin(debris.seed) < 0 ? -1 : 1;
                    debris.laserDeflected = 0.58;
                    debris.collisionGrace = Math.max(debris.collisionGrace, 0.18);
                    debris.vy -= LASER_PUSH_FORCE * dt;
                    debris.vx += side * LASER_SIDE_FORCE * dt;
                    debris.flash = Math.max(debris.flash, 0.08);
                    debris.laserGlow = Math.max(debris.laserGlow, 0.28);
                    if (firstDeflection) state.laser.deflected += 1;
                    if (debris.laserHitCooldown <= 0) {
                        debris.laserHitCooldown = LASER_SPARK_INTERVAL;
                        if (state.laser.sparkCooldown <= 0) {
                            createBurst(debris.x, debris.y + debris.r * 0.38, "#8cecff", 2, 54);
                            state.laser.sparkCooldown = 0.055;
                        }
                    }
                }
            }

            function updateLaser(dt) {
                const laser = state.laser;
                laser.sparkCooldown = Math.max(0, laser.sparkCooldown - dt);
                if (laser.active) {
                    applyLaserToDebris(dt);
                    laser.remaining = Math.max(0, laser.remaining - dt);
                    if (laser.remaining <= 0.0001) {
                        laser.remaining = 0;
                        laser.active = false;
                        laser.cooldown = LASER_COOLDOWN;
                    }
                } else if (laser.cooldown > 0) {
                    laser.cooldown = Math.max(0, laser.cooldown - dt);
                }
            }

            function updateDebris(dt) {
                for (const debris of state.debris) {
                    if (debris.remove) continue;
                    if (debris.kind === "fuelTank") {
                        if (!debris.laserHeating) debris.laserHeat = Math.max(0, debris.laserHeat - dt * 0.62);
                        debris.laserHeating = false;
                    }
                    if (debris.kind === "panel" || debris.kind === "solarWing" || debris.kind === "foil") {
                        const weavePower = debris.kind === "foil" ? 34 : debris.kind === "solarWing" ? 26 : 22;
                        debris.vx += Math.sin(debris.age * 3.1 + debris.seed) * debris.weave * weavePower * DEBRIS_SPEED_MULTIPLIER * dt;
                    }
                    debris.x += debris.vx * dt;
                    debris.y += debris.vy * dt;
                    debris.age += dt;
                    debris.vx *= Math.max(0, 1 - 0.52 * dt);
                    debris.vy *= Math.max(0, 1 - 0.03 * dt);
                    debris.rot += debris.spin * dt;
                    debris.flash = Math.max(0, debris.flash - dt);
                    debris.laserGlow = Math.max(0, debris.laserGlow - dt * 0.72);
                    debris.collisionGrace = Math.max(0, debris.collisionGrace - dt);
                    debris.laserDeflected = Math.max(0, debris.laserDeflected - dt);
                    debris.laserHitCooldown = Math.max(0, debris.laserHitCooldown - dt);
                    if (
                        debris.y > WORLD.height + debris.r + DEBRIS_EXIT_MARGIN ||
                        debris.x < -debris.r - 100 ||
                        debris.x > WORLD.width + debris.r + 100 ||
                        (debris.age > 0.5 && debris.vy < 0 && debris.y < -debris.r - 140) ||
                        (debris.age > 11 && debris.y > PLAY_BOTTOM)
                    ) {
                        debris.remove = true;
                    }
                }
                handleDebrisCollisions();
                handlePlayerCollisions();
                state.debris = state.debris.filter((debris) => !debris.remove);
            }

            function resolveDebrisContact(a, b, dx, dy, rr) {
                const distance = Math.max(1, Math.hypot(dx, dy));
                const nx = dx / distance;
                const ny = dy / distance;
                const relativeNormal = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
                if (relativeNormal < 0) {
                    const impulse = -relativeNormal * 0.68;
                    const totalSize = Math.max(1, a.size + b.size);
                    a.vx += nx * impulse * b.size / totalSize;
                    a.vy += ny * impulse * b.size / totalSize;
                    b.vx -= nx * impulse * a.size / totalSize;
                    b.vy -= ny * impulse * a.size / totalSize;
                }
                const separation = Math.max(0, rr - distance) * 0.52;
                a.x += nx * separation;
                a.y += ny * separation;
                b.x -= nx * separation;
                b.y -= ny * separation;
                a.collisionGrace = Math.max(a.collisionGrace, 0.14);
                b.collisionGrace = Math.max(b.collisionGrace, 0.14);
                a.flash = Math.max(a.flash, 0.06);
                b.flash = Math.max(b.flash, 0.06);
            }

            function handleDebrisCollisions() {
                state.cascadeTimer -= FIXED_DT;
                if (state.cascadeTimer > 0 || state.debris.length < 2) return;
                const cellSize = 70;
                const grid = new Map();
                const debrisIndex = new Map(state.debris.map((debris, index) => [debris, index]));
                for (const debris of state.debris) {
                    if (debris.remove || !debris.canCollide || debris.collisionGrace > 0) continue;
                    const cellX = Math.floor(debris.x / cellSize);
                    const cellY = Math.floor(debris.y / cellSize);
                    const key = `${cellX},${cellY}`;
                    if (!grid.has(key)) grid.set(key, []);
                    grid.get(key).push(debris);
                }

                let checks = 0;
                const maxChecks = Math.min(1100, state.debris.length * 12);
                for (const [key, occupants] of grid) {
                    const [cellX, cellY] = key.split(",").map(Number);
                    for (let offsetY = -1; offsetY <= 1; offsetY += 1) {
                        for (let offsetX = -1; offsetX <= 1; offsetX += 1) {
                            const neighbours = grid.get(`${cellX + offsetX},${cellY + offsetY}`);
                            if (!neighbours) continue;
                            for (const a of occupants) {
                                for (const b of neighbours) {
                                    if (checks >= maxChecks) return;
                                    if (a === b || a.remove || b.remove || debrisIndex.get(a) >= debrisIndex.get(b)) continue;
                                    checks += 1;
                                    const dx = a.x - b.x;
                                    const dy = a.y - b.y;
                                    const rr = (a.r + b.r) * 0.78;
                                    if (dx * dx + dy * dy > rr * rr) continue;
                                    const rvx = a.vx - b.vx;
                                    const rvy = a.vy - b.vy;
                                    const relative = Math.hypot(rvx, rvy);
                                    const fuelTank = a.kind === "fuelTank" ? a : b.kind === "fuelTank" ? b : null;
                                    if (fuelTank) {
                                        const impactor = fuelTank === a ? b : a;
                                        explodeFuelTank(fuelTank);
                                        impactor.flash = Math.max(impactor.flash, 0.2);
                                        impactor.collisionGrace = Math.max(impactor.collisionGrace, 0.26);
                                        state.cascadeTimer = 0.075;
                                        return;
                                    }
                                    if (relative < 34) {
                                        resolveDebrisContact(a, b, dx, dy, rr);
                                        state.cascadeTimer = 0.035;
                                        return;
                                    }

                                    const cascadePossible = a.canCascade || b.canCascade;
                                    if (!cascadePossible) {
                                        resolveDebrisContact(a, b, dx, dy, rr);
                                        createBurst((a.x + b.x) * 0.5, (a.y + b.y) * 0.5, "#dbe7f2", 3, 42);
                                        state.cascadeTimer = 0.045;
                                        return;
                                    }
                                    const struckSatellites = [a, b].filter((debris) => SATELLITE_KINDS.has(debris.kind) && debris.canCascade && debris.size > 1);
                                    if (struckSatellites.length) {
                                        for (const satellite of struckSatellites) {
                                            if (satellite.remove) continue;
                                            if (state.debris.length < MAX_DEBRIS - 3) {
                                                splitDebris(satellite, "cascade");
                                            } else {
                                                satellite.remove = true;
                                                createBurst(satellite.x, satellite.y, "#a7ecff", 14, 110);
                                            }
                                        }
                                        const impactor = struckSatellites.includes(a) ? b : a;
                                        if (impactor.size <= 1) impactor.remove = true;
                                        else impactor.collisionGrace = Math.max(impactor.collisionGrace, 0.24);
                                        state.cascadeTimer = 0.075;
                                        return;
                                    }
                                    const collisionChance = 0.58 + difficultyForLevel() * 0.32;
                                    if (relative < 92 && rand() > collisionChance) {
                                        resolveDebrisContact(a, b, dx, dy, rr);
                                        state.cascadeTimer = 0.035;
                                        return;
                                    }
                                    if (a.size <= 1 && b.size <= 1) {
                                        a.remove = true;
                                        b.remove = true;
                                        createBurst((a.x + b.x) * 0.5, (a.y + b.y) * 0.5, "#c9efff", 8, 72);
                                        state.recentCascades += 1;
                                    } else {
                                        const candidates = [a, b]
                                            .filter((debris) => debris.canCascade && debris.size > 1)
                                            .sort((left, right) => right.size - left.size);
                                        if (!candidates.length) {
                                            const fragile = a.canCascade ? a : b;
                                            const solid = fragile === a ? b : a;
                                            resolveDebrisContact(a, b, dx, dy, rr);
                                            fragile.remove = true;
                                            solid.flash = Math.max(solid.flash, 0.12);
                                            createBurst(fragile.x, fragile.y, "#d9f5ff", 7, 74);
                                            state.recentCascades += 1;
                                            state.cascadeTimer = Math.max(0.035, 0.095 - state.level * 0.0022);
                                            return;
                                        }
                                        const primary = candidates[0];
                                        const secondary = primary === a ? b : a;
                                        splitDebris(primary, "cascade");
                                        if (secondary.size <= 1) {
                                            secondary.remove = true;
                                            createBurst(secondary.x, secondary.y, "#d9f5ff", 6, 68);
                                        } else if (secondary.canCascade && relative > 118 && state.debris.length < MAX_DEBRIS - 5 && rand() < 0.42) {
                                            splitDebris(secondary, "cascade");
                                        } else {
                                            resolveDebrisContact(a, b, dx, dy, rr);
                                            secondary.flash = Math.max(secondary.flash, 0.18);
                                            secondary.collisionGrace = Math.max(secondary.collisionGrace, 0.28);
                                        }
                                    }
                                    state.cascadeTimer = Math.max(0.035, 0.095 - state.level * 0.0022);
                                    return;
                                }
                            }
                        }
                    }
                }
            }

            function applyShieldDamage(color = "#61d8ff", shake = 0.36) {
                if (state.mode !== "playing" || state.reviewInvincible || state.player.invulnerable > 0) return false;
                state.shields -= 1;
                state.shake = Math.max(state.shake, shake);
                state.player.invulnerable = 1.35;
                createBurst(
                    state.player.x,
                    state.player.y,
                    state.shields <= 0 ? "#ff6969" : color,
                    state.shields <= 0 ? 58 : 34,
                    210
                );
                if (state.shields <= 0) {
                    state.mode = "gameover";
                    state.joystick.active = false;
                    state.laser.active = false;
                    state.laser.remaining = 0;
                    syncScreenWakeLock();
                    showGameOverMessage();
                }
                updateHud();
                return true;
            }

            function handlePlayerCollisions() {
                const player = state.player;
                player.invulnerable = Math.max(0, player.invulnerable - FIXED_DT);
                for (const debris of state.debris) {
                    if (debris.remove) continue;
                    const dx = player.x - debris.x;
                    const dy = player.y - debris.y;
                    const hitRadius = PLAYER_RADIUS + debris.r * 0.78 * (debris.hitScale || 1);
                    const distanceSq = dx * dx + dy * dy;
                    if (!debris.scoredNear && distanceSq < (hitRadius + 24) * (hitRadius + 24) && distanceSq > hitRadius * hitRadius) {
                        debris.scoredNear = true;
                        state.score += 2 + state.level * 0.35;
                    }
                    if (distanceSq > hitRadius * hitRadius) continue;
                    if (state.reviewInvincible) {
                        createBurst(player.x, player.y, "#b8f6ff", 12, 110);
                        if (debris.canCascade && debris.size > 1) {
                            splitDebris(debris, "hit");
                        } else {
                            debris.remove = true;
                        }
                        continue;
                    }
                    if (player.invulnerable > 0) {
                        debris.vx -= dx * 2.4;
                        debris.vy -= dy * 2.4;
                        continue;
                    }
                    applyShieldDamage();
                    splitDebris(debris, "hit");
                    debris.remove = true;
                    return;
                }
            }

            function spawnAstronaut() {
                if (state.astronautSpawned) return;
                state.astronautSpawned = true;
                state.collectibles.push({
                    x: rand(76, WORLD.width - 76),
                    y: -40,
                    vx: rand(-14, 14),
                    vy: rand(74, 94),
                    r: 15,
                    age: 0,
                    seed: rand(0, 1000),
                    spriteIndex: Math.floor(rand(0, ASTRONAUT_SPRITE_SOURCES.length)),
                    remove: false
                });
            }

            function updateAstronautSpawning(dt) {
                if (state.phase !== "cloud" || state.astronautSpawned || !Number.isFinite(state.astronautTimer)) return;
                state.astronautTimer -= dt;
                if (state.astronautTimer <= 0) spawnAstronaut();
            }

            function rescueAstronaut(astronaut) {
                const restored = state.shields < MAX_SHIELDS;
                state.shields = Math.min(MAX_SHIELDS, state.shields + 1);
                state.astronautsRescued += 1;
                state.score += 100;
                astronaut.remove = true;
                createBurst(astronaut.x, astronaut.y, "#8ef088", 28, 138);
                state.bannerTimer = 1.55;
                levelBanner.textContent = copy.bannerRescue(restored);
                levelBanner.classList.add("is-visible");
            }

            function updateCollectibles(dt) {
                const player = state.player;
                for (const astronaut of state.collectibles) {
                    astronaut.age += dt;
                    astronaut.vx += Math.sin(astronaut.age * 1.8 + astronaut.seed) * 14 * dt;
                    astronaut.vx *= Math.max(0, 1 - dt * 0.42);
                    astronaut.x += astronaut.vx * dt;
                    astronaut.y += astronaut.vy * dt;
                    if (astronaut.x < 34 || astronaut.x > WORLD.width - 34) astronaut.vx *= -0.75;
                    if (astronaut.y > PLAY_BOTTOM + astronaut.r + 28) {
                        astronaut.remove = true;
                        continue;
                    }
                    const radius = PLAYER_RADIUS + astronaut.r * 0.86;
                    const dx = player.x - astronaut.x;
                    const dy = player.y - astronaut.y;
                    if (dx * dx + dy * dy <= radius * radius) rescueAstronaut(astronaut);
                }
                state.collectibles = state.collectibles.filter((astronaut) => !astronaut.remove);
            }

            function beginReentry() {
                state.mode = "reentry";
                state.reentry.active = true;
                state.reentry.timer = 0;
                state.reentry.clearanceTimer = 0;
                state.reentry.stage = 0;
                state.reentry.startX = state.player.x;
                state.reentry.startY = state.player.y;
                for (const debris of state.debris) {
                    debris.canCollide = false;
                    debris.canCascade = false;
                    debris.collisionGrace = state.reentry.clearanceDuration + 1;
                    debris.laserHeating = false;
                }
                state.joystick.active = false;
                state.laser.active = false;
                state.laser.remaining = 0;
                syncScreenWakeLock();
                state.player.invulnerable = 0;
                state.lastInput.x = 0;
