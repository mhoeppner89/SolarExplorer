            function drawSlingshot() {
                const launch = currentLevel().launch;
                ctx.save();
                drawLaunchOrigin(launch);
                if (state.drag.active) {
                    const aimX = launch.x + (launch.x - state.drag.x);
                    const aimY = launch.y + (launch.y - state.drag.y);
                    const pull = length(launch.x - state.drag.x, launch.y - state.drag.y);

                    const pullRatio = pull / MAX_DRAG;
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.48)";
                    ctx.lineWidth = 7;
                    ctx.beginPath();
                    ctx.moveTo(launch.x, launch.y);
                    ctx.lineTo(state.drag.x, state.drag.y);
                    ctx.stroke();

                    ctx.strokeStyle = "rgba(119, 244, 255, 0.96)";
                    ctx.fillStyle = "rgba(119, 244, 255, 0.96)";
                    ctx.shadowColor = "#28e0ff";
                    ctx.shadowBlur = 16;
                    ctx.lineWidth = 5 + pullRatio * 2;
                    ctx.beginPath();
                    ctx.moveTo(launch.x, launch.y);
                    ctx.lineTo(aimX, aimY);
                    ctx.stroke();
                    const angle = Math.atan2(aimY - launch.y, aimX - launch.x);
                    ctx.beginPath();
                    ctx.moveTo(aimX, aimY);
                    ctx.lineTo(aimX - Math.cos(angle - 0.55) * 13, aimY - Math.sin(angle - 0.55) * 13);
                    ctx.lineTo(aimX - Math.cos(angle + 0.55) * 13, aimY - Math.sin(angle + 0.55) * 13);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = "rgba(247, 251, 255, 0.86)";
                    ctx.font = "700 13px Avenir Next Condensed, Trebuchet MS, sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(`${Math.round(pullRatio * 100)}%`, state.drag.x, state.drag.y - 24);
                }
                ctx.restore();
            }

            function drawTrail() {
                if (state.trail.length < 2) return;
                ctx.save();
                ctx.lineWidth = 5;
                ctx.lineCap = "round";
                for (let i = 1; i < state.trail.length; i += 1) {
                    const a = i / state.trail.length;
                    ctx.strokeStyle = `rgba(19, 215, 239, ${0.08 + a * 0.62})`;
                    ctx.beginPath();
                    ctx.moveTo(state.trail[i - 1].x, state.trail[i - 1].y);
                    ctx.lineTo(state.trail[i].x, state.trail[i].y);
                    ctx.stroke();
                }
                ctx.restore();
            }

            function drawPrediction() {
                const prediction = predictPath();
                const points = prediction.points;
                if (!points.length) return;
                ctx.save();
                const isWin = prediction.outcome === "target_reached";
                const isDanger = prediction.outcome && prediction.outcome !== "flight" && !isWin;
                const fill = isWin ? "#7cf238" : isDanger ? "#ff7f68" : "#13d7ef";
                ctx.fillStyle = fill;
                ctx.shadowColor = fill;
                ctx.shadowBlur = 12;
                for (let i = 0; i < points.length; i += 1) {
                    const p = points[i];
                    ctx.globalAlpha = clamp(1 - i / points.length, 0.2, 0.9);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, i === points.length - 1 ? 6.5 : 4.4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
                ctx.restore();
            }

            function drawShip() {
                ctx.save();
                ctx.translate(state.ship.x, state.ship.y);
                const angle = state.mode === "flying" ? Math.atan2(state.ship.vy, state.ship.vx) : -0.35;
                ctx.rotate(angle);
                ctx.scale(1.42, 1.42);

                const heatRatio = clamp((state.ship.heat || 0) / HEAT_LIMIT, 0, 1);
                if (heatRatio > 0.05) {
                    ctx.save();
                    ctx.globalAlpha = 0.28 + heatRatio * 0.45;
                    ctx.fillStyle = heatRatio > 0.72 ? "#ff563d" : "#ffb84a";
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.shadowBlur = 18 + heatRatio * 18;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 18 + heatRatio * 9, 12 + heatRatio * 6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                if (state.mode === "flying" || state.drag.active) {
                    const flame = state.mode === "flying" ? 1 : 0.65;
                    ctx.fillStyle = "rgba(255, 132, 28, 0.88)";
                    ctx.beginPath();
                    ctx.moveTo(-10, -5);
                    ctx.lineTo(-26 * flame, 0);
                    ctx.lineTo(-10, 5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = "rgba(255, 230, 79, 0.9)";
                    ctx.beginPath();
                    ctx.moveTo(-10, -3);
                    ctx.lineTo(-19 * flame, 0);
                    ctx.lineTo(-10, 3);
                    ctx.closePath();
                    ctx.fill();
                }

                const hull = ctx.createLinearGradient(-15, -10, 16, 9);
                hull.addColorStop(0, "#dff7ff");
                hull.addColorStop(0.48, "#ffffff");
                hull.addColorStop(1, "#bdd4ff");
                ctx.fillStyle = hull;
                ctx.strokeStyle = "rgba(5, 28, 58, 0.78)";
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(16, 0);
                ctx.bezierCurveTo(8, -11, -8, -11, -14, 0);
                ctx.bezierCurveTo(-8, 11, 8, 11, 16, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#ff4c2f";
                ctx.beginPath();
                ctx.moveTo(16, 0);
                ctx.lineTo(5, -7);
                ctx.lineTo(5, 7);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#ff4c2f";
                ctx.beginPath();
                ctx.moveTo(-8, -8);
                ctx.lineTo(-18, -14);
                ctx.lineTo(-14, -2);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-8, 8);
                ctx.lineTo(-18, 14);
                ctx.lineTo(-14, 2);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#7fc8ff";
                ctx.beginPath();
                ctx.arc(-1, 0, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "rgba(255,255,255,0.72)";
                ctx.beginPath();
                ctx.arc(0.8, -1.4, 1.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "rgba(5, 28, 58, 0.45)";
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();
            }

            function drawLevelLabels() {
                const level = currentLevel();
                ctx.save();
                ctx.fillStyle = "rgba(247, 251, 255, 0.78)";
                ctx.font = "700 18px Avenir Next Condensed, Trebuchet MS, sans-serif";
                ctx.fillStyle = "rgba(168, 189, 216, 0.72)";
                ctx.font = "14px Avenir Next Condensed, Trebuchet MS, sans-serif";
                ctx.fillText("Ziel", level.target.x - 12, level.target.y - level.target.r - 14);
                for (const planet of level.planets) {
                    ctx.fillText(planet.label || "Schwerkraft", planet.x - 22, planet.y + planet.r + 22);
                }
                const hazards = level.hazards || [];
                if (hazards.length <= 3) {
                    for (const hazard of hazards) {
                        ctx.fillText(hazard.label || "Gefahr", hazard.x - 22, hazard.y + hazard.r + 20);
                    }
                } else {
                    const center = hazards.reduce((acc, hazard) => ({
                        x: acc.x + hazard.x / hazards.length,
                        y: acc.y + hazard.y / hazards.length,
                    }), { x: 0, y: 0 });
                    ctx.fillText("Trümmerfeld", center.x - 42, center.y + 24);
                }
                ctx.restore();
            }

            function setWorldTransform() {
                ctx.setTransform(canvas.width / WORLD.width, 0, 0, canvas.height / WORLD.height, 0, 0);
            }

            function render() {
                setWorldTransform();
                drawBackground();
                const level = currentLevel();
                for (const planet of level.planets) drawHeatField(planet, level);
                for (const planet of level.planets) drawGravityField(planet);
                for (const planet of level.planets) drawAtmosphere(planet);
                drawTarget(level.target);
                for (const planet of level.planets) drawPlanet(planet);
                for (const hazard of level.hazards || []) drawHazard(hazard);
                drawSlingshot();
                drawTrail();
                drawPrediction();
                drawShip();
            }

            function readyMessageHtml(level) {
                const tutorial = mechanicTutorialForLevel(state.levelIndex);
                const tutorialHtml = tutorial
                    ? [
                        `<span class="message__mechanic">${escapeHtml(tutorial.title)}</span>`,
                        `<span class="message__copy">${escapeHtml(tutorial.copy)}</span>`,
                    ].join("")
                    : "";
                const nudge = state.message
                    ? `<span class="message__nudge">${escapeHtml(state.message)}</span>`
                    : "";
                const hint = state.hintVisible
                    ? `<div class="level-hint"><span class="level-hint__label">Level-Tipp</span>${escapeHtml(level.hint)}</div>`
                    : "";
                return [
                    tutorial ? "" : `<strong>${escapeHtml(level.name)}</strong>`,
                    tutorialHtml,
                    nudge,
                    hint,
                ].join("");
            }

            function updateUi() {
                ui.level.textContent = `${state.levelIndex + 1}/${levels.length}`;
                ui.score.textContent = String(state.levelScore);
                ui.best.textContent = String(state.highScores[state.levelIndex] || 0);
                ui.speed.textContent = String(Math.round(shipSpeed()));
                ui.speedFill.style.width = `${clamp(shipSpeed() / 520, 0, 1) * 100}%`;
                ui.time.textContent = `${timeRemaining().toFixed(1)}s`;
                const previousSolvedIndex = findSolvedMission(-1);
                const nextSolvedIndex = findSolvedMission(1);
                const navigationBlocked = state.mode === "flying" || state.drag.active;
                const hintAvailable = levelHintAvailable();
                const hintButtonVisible = hintAvailable && state.mode === "ready";
                ui.prevSolved.disabled = navigationBlocked || previousSolvedIndex === null;
                ui.nextSolved.disabled = navigationBlocked || nextSolvedIndex === null;
                ui.hint.hidden = !hintButtonVisible;
                ui.hint.disabled = !hintButtonVisible || navigationBlocked;
                ui.hint.classList.toggle("is-active", state.hintVisible && hintButtonVisible);
                ui.hint.setAttribute("aria-pressed", state.hintVisible && hintButtonVisible ? "true" : "false");
                ui.hint.title = state.hintVisible ? "Level-Tipp ausblenden" : "Level-Tipp anzeigen";
                ui.hint.setAttribute("aria-label", state.hintVisible ? "Level-Tipp ausblenden" : "Level-Tipp anzeigen");
                ui.prevSolved.title = previousSolvedIndex === null
                    ? "Keine frühere gelöste Mission"
                    : `Zu Mission ${previousSolvedIndex + 1}`;
                ui.nextSolved.title = nextSolvedIndex === null
                    ? "Keine spätere gelöste Mission"
                    : `Zu Mission ${nextSolvedIndex + 1}`;

                const labels = {
                    ready: "Bereit",
                    flying: "Flug",
                    won: "Geschafft",
                    crashed: "Kollision",
                    timeout: "Zeit aus",
                    flyaway: "Verloren",
                };
                ui.state.textContent = labels[state.mode] || state.mode;
                ui.hud.classList.toggle("is-aiming", state.drag.active);
                ui.hud.classList.toggle("is-active-flight", state.mode === "flying");
                ui.message.classList.toggle("is-ready", state.mode === "ready");
                ui.message.classList.toggle("is-launch-left", state.mode === "ready" && currentLevel().launch.x < WORLD.width / 2);
                ui.message.classList.toggle("is-launch-right", state.mode === "ready" && currentLevel().launch.x >= WORLD.width / 2);
                const title = state.mode === "won" ? "Mission geschafft" :
                    state.mode === "flying" ? "Sonde unterwegs" : "Nochmal versuchen";
                const retryButton = isFailureMode(state.mode)
                    ? `<button type="button" class="message-restart" data-message-restart>Mission neu starten</button>`
                    : "";
                ui.message.innerHTML = state.mode === "ready"
                    ? readyMessageHtml(currentLevel())
                    : `<strong>${escapeHtml(title)}</strong>${escapeHtml(state.message)}${retryButton}`;
                ui.next.classList.toggle("is-visible", state.mode === "won");
                ui.message.classList.toggle("has-cta", state.mode === "won");
                ui.message.classList.toggle("has-retry", isFailureMode(state.mode));
                ui.message.classList.toggle("has-hint", state.mode === "ready" && state.hintVisible);
                ui.message.classList.toggle("has-tutorial", state.mode === "ready" && Boolean(mechanicTutorialForLevel(state.levelIndex)));
                const hideReadyMessage = state.mode === "ready" && !readyPopupVisible();
                ui.message.hidden = hideReadyMessage;
                ui.message.classList.toggle("is-hidden", hideReadyMessage);
            }

            function fitShellToViewport() {
                const shell = canvas.parentElement;
                const stage = document.querySelector(".stage");
                const stageStyle = getComputedStyle(stage);
                const paddingX = parseFloat(stageStyle.paddingLeft) + parseFloat(stageStyle.paddingRight);
                const paddingY = parseFloat(stageStyle.paddingTop) + parseFloat(stageStyle.paddingBottom);
                const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
                const availableWidth = Math.max(180, window.innerWidth - paddingX);
                const availableHeight = Math.max(260, viewportHeight - paddingY);
                const maxShellWidth = Math.min(544, availableWidth);
                let shellWidth = maxShellWidth;
                let shellHeight = shellWidth * (WORLD.height / WORLD.width);

                if (shellHeight > availableHeight) {
                    shellHeight = availableHeight;
                    shellWidth = shellHeight * (WORLD.width / WORLD.height);
                }

                shell.style.width = `${Math.floor(shellWidth)}px`;
                shell.style.height = `${Math.floor(shellHeight)}px`;
            }

            function resizeCanvas() {
                fitShellToViewport();
                state.viewMode = "portrait";
                const shell = canvas.parentElement;
                const rect = shell.getBoundingClientRect();
                const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
                canvas.width = Math.round(rect.width * dpr);
                canvas.height = Math.round(rect.height * dpr);
                setWorldTransform();
                render();
            }

            function frame(now) {
                if (!frame.last) frame.last = now;
                const delta = Math.min(0.05, (now - frame.last) / 1000);
                frame.last = now;
                const playbackScale = state.mode === "flying" ? FLIGHT_PLAYBACK_SPEED : 1;
                state.accumulator += delta * playbackScale;
                while (state.accumulator >= FIXED_DT) {
                    step(FIXED_DT);
                    state.accumulator -= FIXED_DT;
                }
                render();
                requestAnimationFrame(frame);
            }

            function handleKey(event) {
                const key = event.key.toLowerCase();
                if (key === "r") resetLevel();
                if (key === "n" && state.mode === "won") nextLevel();
                if (key === "," || key === "arrowleft") goToSolvedMission(-1);
                if (key === "." || key === "arrowright") goToSolvedMission(1);
                if (key === "f") {
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    } else {
                        document.documentElement.requestFullscreen().catch(() => { });
                    }
                }
            }

            function renderGameToText() {
                const level = currentLevel();
                const previousSolvedIndex = findSolvedMission(-1);
                const nextSolvedIndex = findSolvedMission(1);
                const navigationBlocked = state.mode === "flying" || state.drag.active;
                const thermal = thermalAt(state.ship.x, state.ship.y, level);
                const tutorial = mechanicTutorialForLevel(state.levelIndex);
                const payload = {
                    coordinates: `world units; origin top-left; x right; y down; canvas world ${WORLD.width}x${WORLD.height}`,
                    mode: state.mode,
                    level: {
                        index: state.levelIndex,
                        number: state.levelIndex + 1,
                        count: levels.length,
                        name: level.name,
                    },
                    view: {
                        mode: state.viewMode,
                        width: WORLD.width,
                        height: WORLD.height,
                    },
                    ship: {
                        x: Number(state.ship.x.toFixed(1)),
                        y: Number(state.ship.y.toFixed(1)),
                        vx: Number(state.ship.vx.toFixed(1)),
                        vy: Number(state.ship.vy.toFixed(1)),
                        r: state.ship.r,
                    },
                    launch: level.launch,
                    target: level.target,
                    planets: level.planets.map((planet) => ({
                        label: planet.label || "",
                        x: planet.x,
                        y: planet.y,
                        r: planet.r,
                        mass: planet.mass,
                        heatSource: isHeatSource(planet),
                        heatRadius: heatRadiusFor(planet) || null,
                        heatRate: isHeatSource(planet) ? heatRateFor(planet) : null,
                        atmosphereRadius: planet.atmosphereRadius || null,
                        atmosphereDrag: planet.atmosphereDrag || null,
                        atmosphereStrength: Number(atmosphereStrengthAt(state.ship.x, state.ship.y, planet).toFixed(3)),
                    })),
                    hazards: (level.hazards || []).map((hazard) => ({
                        label: hazard.label || "",
                        x: hazard.x,
                        y: hazard.y,
                        r: hazard.r,
                    })),
                    speed: Number(shipSpeed().toFixed(1)),
                    launchSpeed: Number(state.launchSpeed.toFixed(1)),
                    maxLaunchSpeed: Number(MAX_LAUNCH_SPEED.toFixed(1)),
                    score: {
                        level: state.levelScore,
                        bestForLevel: state.highScores[state.levelIndex] || 0,
                        totalBest: totalHighScore(),
                        solvedLevels: state.highScores
                            .map((score, index) => score > 0 ? index + 1 : null)
                            .filter((levelNumber) => levelNumber !== null),
                    },
                    navigation: {
                        previousSolved: previousSolvedIndex === null ? null : previousSolvedIndex + 1,
                        nextSolved: nextSolvedIndex === null ? null : nextSolvedIndex + 1,
                        previousDisabled: navigationBlocked || previousSolvedIndex === null,
                        nextDisabled: navigationBlocked || nextSolvedIndex === null,
                    },
                    atmosphere: {
                        currentStrength: Number(state.currentAtmosphereStrength.toFixed(3)),
                        maxStrength: Number(state.maxAtmosphereStrength.toFixed(3)),
                        time: Number(state.atmosphereTime.toFixed(2)),
                    },
                    heat: {
                        level: Number((state.ship.heat || 0).toFixed(3)),
                        percent: Math.round(clamp((state.ship.heat || 0) / HEAT_LIMIT, 0, 1) * 100),
                        peak: Number(state.maxHeat.toFixed(3)),
                        exposure: Number((state.mode === "flying" ? state.currentHeatExposure : thermal.exposure).toFixed(3)),
                        inShadow: state.mode === "flying" ? state.heatInShadow : thermal.inShadow,
                        source: state.mode === "flying" ? state.heatSource : thermal.sourceLabel,
                        time: Number(state.heatTime.toFixed(2)),
                    },
                    drag: state.drag.active ? {
                        x: Number(state.drag.x.toFixed(1)),
                        y: Number(state.drag.y.toFixed(1)),
                    } : null,
                    shots: state.shots,
                    elapsed: Number(state.elapsed.toFixed(2)),
                    realElapsed: Number(realElapsed().toFixed(2)),
                    timeRemaining: Number(timeRemaining().toFixed(2)),
                    timeLimit: TIME_LIMIT,
                    realTimeLimit: REAL_TIME_LIMIT,
                    flightPlaybackSpeed: FLIGHT_PLAYBACK_SPEED,
                    messageRestartVisible: isFailureMode(state.mode),
                    hintVisible: state.mode === "ready" && state.hintVisible,
                    helperHidden: state.mode === "ready" && !state.hintVisible,
                    hintButtonVisible: levelHintAvailable() && state.mode === "ready",
                    readyPopupVisible: readyPopupVisible(),
                    tutorial: state.mode === "ready" && tutorial ? tutorial.title : null,
                    lastOutcome: state.lastOutcome,
                    message: state.message,
                };
                return JSON.stringify(payload);
            }

            window.render_game_to_text = renderGameToText;
            window.advanceTime = (ms) => {
                const steps = Math.max(1, Math.round(ms / (1000 / 60)));
                for (let i = 0; i < steps; i += 1) step(FIXED_DT);
                render();
                return renderGameToText();
            };

            canvas.addEventListener("pointerdown", onPointerDown);
            canvas.addEventListener("pointermove", onPointerMove);
            canvas.addEventListener("pointerup", onPointerUp);
            canvas.addEventListener("pointercancel", () => {
                if (state.drag.active) resetLevel();
            });
            ui.restart.addEventListener("click", () => resetLevel());
            ui.hint.addEventListener("click", () => {
                if (!levelHintAvailable() || state.mode !== "ready" || state.drag.active) return;
                state.hintVisible = !state.hintVisible;
                state.message = "";
                updateUi();
            });
            ui.prevSolved.addEventListener("click", () => goToSolvedMission(-1));
            ui.nextSolved.addEventListener("click", () => goToSolvedMission(1));
            ui.message.addEventListener("click", (event) => {
                if (event.target.closest("[data-message-restart]")) {
                    resetLevel();
                    return;
                }
            });
            ui.next.addEventListener("click", () => nextLevel());
            window.addEventListener("keydown", handleKey);
            window.addEventListener("resize", resizeCanvas);
            window.visualViewport?.addEventListener("resize", resizeCanvas);
            document.addEventListener("fullscreenchange", resizeCanvas);

            resetLevel();
            resizeCanvas();
            requestAnimationFrame(frame);
        })();
    </script>
</body>

</html>
