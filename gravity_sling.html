<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Solar Explorer - Gravitas</title>
    <link rel="icon" href="data:," />
    <style>
        :root {
            color-scheme: dark;
            --ink: #f8fdff;
            --muted: #a8d6e8;
            --line: rgba(101, 219, 255, 0.42);
            --panel: rgba(7, 38, 68, 0.9);
            --panel-strong: rgba(9, 43, 76, 0.96);
            --accent: #67e85c;
            --accent-strong: #20ba61;
            --gold: #ffd340;
            --danger: #ff7f68;
            --cyan: #28e0ff;
            --teal: #20d3c9;
            --shadow: rgba(0, 0, 0, 0.48);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Avenir Next Condensed", "Gill Sans", "Trebuchet MS", Arial, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 14% 14%, rgba(0, 181, 255, 0.34), transparent 30%),
                radial-gradient(circle at 88% 18%, rgba(175, 55, 210, 0.28), transparent 26%),
                radial-gradient(circle at 78% 86%, rgba(64, 221, 142, 0.18), transparent 28%),
                linear-gradient(150deg, #03091c 0%, #071b35 46%, #102c52 100%);
            touch-action: none;
        }

        .stage {
            position: relative;
            width: 100vw;
            height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding:
                max(0.35rem, env(safe-area-inset-top)) max(0.35rem, env(safe-area-inset-right)) max(0.35rem, env(safe-area-inset-bottom)) max(0.35rem, env(safe-area-inset-left));
        }

        .game-shell {
            position: relative;
            width: min(calc(100vw - 0.7rem), 34rem);
            height: auto;
            max-width: calc(100vw - 0.7rem);
            max-height: calc(100svh - 0.7rem);
            aspect-ratio: 9 / 16;
            border: 2px solid rgba(75, 205, 255, 0.38);
            border-radius: 1.1rem;
            overflow: hidden;
            background: rgba(3, 13, 31, 0.72);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.08),
                0 28px 72px var(--shadow);
        }

        .game-shell::before,
        .game-shell::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .game-shell::before {
            background:
                radial-gradient(circle at 50% 45%, transparent 0 52%, rgba(2, 8, 22, 0.12) 74%, rgba(1, 4, 12, 0.42) 100%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 18%, rgba(0, 0, 0, 0.08));
        }

        .game-shell::after {
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 80px rgba(6, 15, 34, 0.62);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        .hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            gap: clamp(0.34rem, 1vw, 0.66rem);
            padding: clamp(0.46rem, 1.1vw, 0.72rem);
        }

        .topbar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: start;
            gap: 0.4rem;
            min-height: 0;
            padding: 0;
        }

        .cluster {
            grid-column: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            justify-content: flex-start;
            gap: 0.28rem;
            min-width: 0;
        }

        .chip,
        button,
        .button {
            border: 1px solid rgba(109, 220, 255, 0.32);
            color: var(--ink);
            background:
                linear-gradient(180deg, rgba(18, 86, 125, 0.74), rgba(5, 25, 55, 0.76)),
                var(--panel);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.13),
                0 8px 18px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(12px);
        }

        .chip {
            min-height: 2rem;
            display: inline-flex;
            align-items: baseline;
            gap: 0.3rem;
            padding: 0.32rem 0.5rem;
            border-radius: 0.5rem;
            white-space: nowrap;
        }

        .chip span {
            color: var(--muted);
            font-size: 0.56rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .chip strong {
            font-size: 0.9rem;
            line-height: 1;
        }

        .status-chip {
            display: none;
        }

        .mission-chip {
            align-items: center;
            gap: 0.24rem;
            padding: 0.18rem 0.28rem;
            border-color: rgba(117, 232, 92, 0.46);
            background:
                linear-gradient(180deg, rgba(24, 103, 108, 0.82), rgba(7, 37, 61, 0.78)),
                rgba(3, 19, 36, 0.82);
        }

        .mission-nav-button {
            width: 1.56rem;
            min-width: 1.56rem;
            min-height: 1.56rem;
            padding: 0;
            border-radius: 999px;
            font-size: 1.12rem;
            line-height: 1;
            pointer-events: auto;
        }

        .mission-nav-button:disabled {
            opacity: 0.38;
            cursor: default;
            filter: saturate(0.6);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .speed-chip {
            min-width: 0;
            display: grid;
            grid-template-columns: auto auto;
            align-items: center;
            gap: 0.48rem;
        }

        .speed-meter {
            display: none;
            height: 0.52rem;
            border-radius: 999px;
            border: 1px solid rgba(136, 218, 255, 0.34);
            background: rgba(3, 18, 42, 0.82);
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.35);
        }

        .speed-meter__fill {
            display: block;
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #67e85c, #f8e64f, #ff9d30);
            box-shadow: 0 0 10px rgba(103, 232, 92, 0.4);
            transition: width 0.16s linear;
        }

        .speed-readout {
            min-width: 2.1rem;
            text-align: right;
        }

        .message {
            align-self: end;
            justify-self: start;
            max-width: min(31rem, calc(100% - 1rem));
            margin: 0 0 0.12rem;
            padding: 0.66rem 0.74rem;
            border: 1px solid rgba(98, 214, 255, 0.34);
            border-left: 4px solid rgba(117, 232, 92, 0.82);
            border-radius: 0.5rem;
            background:
                linear-gradient(180deg, rgba(8, 42, 75, 0.92), rgba(4, 18, 42, 0.84)),
                rgba(3, 12, 28, 0.86);
            color: var(--ink);
            font-size: 0.86rem;
            text-align: left;
            line-height: 1.24;
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.24);
            backdrop-filter: blur(12px);
            pointer-events: auto;
            transition: opacity 0.16s ease, transform 0.16s ease;
        }

        .message strong {
            display: block;
            margin-bottom: 0.18rem;
            color: #8ffb7a;
            font-size: 0.74rem;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }

        .message__copy {
            display: block;
        }

        .message__mechanic {
            display: block;
            margin-bottom: 0.12rem;
            color: #ffd978;
            font-size: 0.68rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .message__nudge {
            display: block;
            margin-top: 0.32rem;
            color: #ffd978;
            font-weight: 800;
        }

        .message-actions {
            display: flex;
            align-items: center;
            gap: 0.34rem;
            margin-top: 0.5rem;
        }

        #hintButton {
            font-size: 1.06rem;
        }

        #hintButton[hidden] {
            display: none;
        }

        #hintButton.is-active {
            border-color: rgba(255, 217, 120, 0.7);
            background:
                linear-gradient(180deg, rgba(214, 155, 42, 0.8), rgba(91, 51, 12, 0.8)),
                var(--panel);
            color: #fff2b8;
        }

        .hint-toggle {
            min-width: 0;
            min-height: 2rem;
            border-radius: 999px;
            padding: 0.26rem 0.66rem;
            color: #f8fdff;
            font-size: 0.78rem;
            letter-spacing: 0.02em;
        }

        .hint-toggle::before {
            content: "?";
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.05rem;
            height: 1.05rem;
            margin-right: 0.32rem;
            border-radius: 999px;
            background: rgba(117, 232, 255, 0.18);
            color: #8ffbff;
            font-size: 0.7rem;
        }

        .level-hint {
            margin-top: 0.46rem;
            padding: 0.48rem 0.56rem;
            border-radius: 0.48rem;
            border: 1px solid rgba(255, 217, 120, 0.26);
            background: rgba(58, 38, 12, 0.35);
            color: #ffe7a3;
        }

        .level-hint__label {
            display: block;
            margin-bottom: 0.12rem;
            color: #ffd45c;
            font-size: 0.68rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .message.has-cta {
            margin-bottom: 4.55rem;
        }

        .message.is-hidden {
            opacity: 0;
            transform: translateY(0.9rem);
            pointer-events: none;
        }

        .message.is-ready {
            align-self: center;
            max-width: min(12.5rem, calc(58% - 0.5rem));
            margin: 0;
        }

        .message.is-ready.has-tutorial {
            max-width: min(16.5rem, calc(72% - 0.5rem));
        }

        .message.is-ready.has-hint {
            max-width: min(18rem, calc(76% - 0.5rem));
        }

        .message.is-ready.is-launch-left {
            justify-self: end;
        }

        .message.is-ready.is-launch-right {
            justify-self: start;
        }

        .message-restart {
            width: 100%;
            min-height: 2.55rem;
            margin-top: 0.46rem;
            border-radius: 0.78rem;
            border-color: rgba(255, 231, 138, 0.78);
            background: linear-gradient(180deg, #ffd55a, #ff983b);
            color: #162139;
            font-size: 0.98rem;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.28);
            letter-spacing: 0.02em;
            gap: 0.36rem;
            box-shadow:
                inset 0 3px 0 rgba(255, 255, 255, 0.26),
                0 12px 24px rgba(255, 125, 58, 0.24);
        }

        .message-restart::before {
            content: "↻";
            font-size: 1.08em;
        }

        .hud.is-aiming .message,
        .hud.is-active-flight .message {
            opacity: 0;
            transform: translateY(0.9rem);
        }

        .actions {
            grid-column: 2;
            pointer-events: auto;
            display: flex;
            flex-wrap: nowrap;
            align-items: flex-start;
            gap: 0.22rem;
            justify-content: flex-end;
        }

        button,
        .button {
            min-width: 2.42rem;
            min-height: 2.42rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 0.34rem 0.58rem;
            text-decoration: none;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover,
        button:focus-visible,
        .button:hover,
        .button:focus-visible {
            border-color: rgba(255, 213, 122, 0.55);
            outline: none;
        }

        #nextButton {
            position: absolute;
            left: 50%;
            bottom: clamp(0.9rem, 3vw, 1.6rem);
            min-width: clamp(8rem, 20vw, 12rem);
            min-height: clamp(3rem, 6vw, 4rem);
            border-radius: 1rem;
            border-color: rgba(215, 255, 219, 0.7);
            background: linear-gradient(180deg, #75ec58, #2bbc48);
            color: #fafff7;
            font-size: clamp(1.18rem, 2.3vw, 1.9rem);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
            box-shadow:
                inset 0 3px 0 rgba(255, 255, 255, 0.24),
                0 12px 28px rgba(18, 181, 82, 0.32);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 0.75rem) scale(0.98);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        #nextButton.is-visible {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, 0) scale(1);
        }

        #nextButton::after {
            content: ">";
            margin-left: 0.65rem;
            font-size: 0.88em;
        }

        @media (max-height: 430px) {
            .hud {
                padding: 0.34rem;
            }

            .topbar {
                grid-template-columns: minmax(0, 1fr) auto;
                align-items: center;
                gap: 0.24rem;
            }

            .cluster {
                justify-content: flex-start;
                overflow: hidden;
            }

            .cluster .chip:nth-child(n+2) {
                display: none;
            }

            .chip {
                min-height: 1.7rem;
                padding: 0.22rem 0.44rem;
            }

            .chip span {
                display: none;
                font-size: 0.52rem;
            }

            .chip strong {
                font-size: 0.78rem;
            }

            .status-chip {
                display: none;
            }

            .speed-chip {
                min-width: 0;
                grid-template-columns: auto auto;
            }

            .speed-meter {
                display: none;
            }

            .actions {
                gap: 0.18rem;
            }

            button,
            .button {
                min-width: 2.25rem;
                min-height: 2.25rem;
                padding: 0.15rem 0.25rem;
            }

            .message {
                max-width: min(22rem, 54vw);
                padding: 0.4rem 0.5rem;
                font-size: 0.78rem;
            }

            .message.is-ready {
                max-width: min(12rem, 46vw);
            }

            .message.is-ready.has-tutorial {
                max-width: min(15.5rem, 58vw);
            }

        }

        @media (max-width: 380px),
        (max-height: 680px) {
            .hud {
                gap: 0.28rem;
                padding: 0.36rem;
            }

            .message {
                max-width: calc(100% - 0.75rem);
                max-height: none;
                padding: 0.44rem 0.5rem;
                border-width: 1px;
                border-radius: 0.55rem;
                font-size: 0.72rem;
                line-height: 1.14;
                overflow: visible;
                opacity: 0.94;
            }

            .message.is-ready {
                max-width: min(12rem, 52vw);
            }

            .message.is-ready.has-tutorial {
                max-width: min(15.25rem, 62vw);
            }

            .message.is-ready.has-hint {
                max-width: min(16.5rem, 70vw);
            }

            .message strong {
                display: block;
                margin: 0 0 0.12rem;
            }

            .message-actions {
                margin-top: 0.36rem;
            }

            .hint-toggle {
                min-height: 1.9rem;
                padding: 0.22rem 0.54rem;
                font-size: 0.72rem;
            }

            .level-hint {
                margin-top: 0.36rem;
                padding: 0.4rem 0.44rem;
            }

            .message.has-cta,
            .message.has-retry {
                max-height: none;
                margin-bottom: 4.2rem;
                opacity: 1;
            }
        }

        @media (max-width: 380px) {
            .topbar {
                grid-template-columns: minmax(0, 1fr) auto;
                align-items: center;
                gap: 0.22rem;
            }

            .cluster {
                grid-column: 1;
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.14rem;
            }

            .actions {
                grid-column: 2;
                gap: 0.18rem;
            }

            .chip {
                min-width: 0;
                min-height: 1.48rem;
                justify-content: center;
                gap: 0.16rem;
                padding: 0.1rem 0.2rem;
                border-radius: 0.45rem;
            }

            .chip span {
                font-size: 0.48rem;
                letter-spacing: 0.05em;
            }

            .chip strong {
                font-size: 0.82rem;
            }
        }
    </style>
</head>

<body>
    <main class="stage">
        <section class="game-shell" aria-label="Gravitas Spiel">
            <canvas id="game" width="540" height="960"></canvas>
            <div class="hud" aria-hidden="true">
                <div class="topbar">
                    <div class="cluster">
                        <div class="chip mission-chip">
                            <button id="prevSolvedButton" class="mission-nav-button" title="Vorherige gelöste Mission"
                                aria-label="Vorherige gelöste Mission">‹</button>
                            <span>Mission</span><strong id="levelLabel">1</strong>
                            <button id="nextSolvedButton" class="mission-nav-button" title="Nächste gelöste Mission"
                                aria-label="Nächste gelöste Mission">›</button>
                        </div>
                        <div class="chip score-chip"><span>Punkte</span><strong><span id="scoreLabel">0</span>/<span
                                    id="bestLabel">0</span></strong></div>
                        <div class="chip status-chip"><span>Status</span><strong id="stateLabel">Bereit</strong></div>
                        <div class="chip"><span>Restzeit</span><strong id="timeLabel">10.0s</strong></div>
                        <div class="chip speed-chip">
                            <span>Tempo</span>
                            <span class="speed-meter"><span id="speedFill" class="speed-meter__fill"></span></span>
                            <strong id="speedLabel" class="speed-readout">0</strong>
                        </div>
                    </div>
                    <div class="actions">
                        <a class="button" href="index.html" title="Zurück zur Spielstation"
                            aria-label="Zurück zur Spielstation">←</a>
                        <button id="hintButton" title="Level-Tipp anzeigen" aria-label="Level-Tipp anzeigen"
                            aria-pressed="false" hidden>?</button>
                        <button id="restartButton" title="Mission neu starten"
                            aria-label="Mission neu starten">↻</button>
                    </div>
                </div>
                <div id="message" class="message">
                    <strong>Gravitas</strong>
                    <span class="message__mechanic">Start</span>
                    <span class="message__copy">Ziehe vom Startpunkt weg, lass los und erreiche die grüne
                        Zielzone.</span>
                </div>
                <button id="nextButton" title="Nächste Mission">Weiter</button>
            </div>
        </section>
    </main>

    <script>
        (() => {
            "use strict";

            const WORLD = { width: 540, height: 960 };
            const SHIP_RADIUS = 10;
            const MAX_DRAG = 118;
            const LAUNCH_POWER = 1.675;
            const MAX_LAUNCH_SPEED = MAX_DRAG * LAUNCH_POWER;
            const FIXED_DT = 1 / 60;
            const FLIGHT_PLAYBACK_SPEED = 3;
            const TIME_LIMIT = 30;
            const REAL_TIME_LIMIT = TIME_LIMIT / FLIGHT_PLAYBACK_SPEED;
            const PREDICTION_TIME_RATIO = 0.10;
            const FLY_MARGIN = 180;
            const GRAVITY_SCALE = 2900000;
            const HEAT_LIMIT = 1;
            const SUN_HEAT_GAIN_RATE = 0.42;
            const HEAT_COOL_RATE = 0.18;
            const SHADOW_COOL_RATE = 0.34;
            const DEFAULT_HEAT_RADIUS_MULTIPLIER = 2.35;
            const SCORE_STORAGE_KEY = "gravity-sling-high-scores-v1";
            const HINT_UNLOCK_LEVEL_INDEX = 4;
            const MECHANIC_TUTORIALS = [
                {
                    title: "Start",
                    copy: "Ziehe die Rakete vom Startpunkt weg, lass los und erreiche die grüne Zielzone. Je weniger Schub du gibst, desto mehr Punkte kannst du erreichen.",
                },
                {
                    title: "Schwerkraft",
                    copy: "Massen biegen deine Flugbahn. Ziele nicht nur direkt auf das Ziel, sondern plane die Gravitation der Planeten ein.",
                },
                {
                    title: "Atmosphäre",
                    copy: "Ein Flug durch die Atmosphäre bremst die Rakete. Streife sie, wenn du sonst zu schnell ins Ziel kommst.",
                },
                {
                    title: "Hitze",
                    copy: "Achtung, die Sonne ist heiß! Suche Schutz hinter anderen Himmelskörpern",
                },
                {
                    title: "Level-Tipps",
                    copy: "Optionale Tipps findest du auf dem ? oben rechts.",
                },
            ];

            const canvas = document.getElementById("game");
            const ctx = canvas.getContext("2d");
            const ui = {
                hud: document.querySelector(".hud"),
                level: document.getElementById("levelLabel"),
                state: document.getElementById("stateLabel"),
                score: document.getElementById("scoreLabel"),
                best: document.getElementById("bestLabel"),
                speed: document.getElementById("speedLabel"),
                speedFill: document.getElementById("speedFill"),
                time: document.getElementById("timeLabel"),
                message: document.getElementById("message"),
                hint: document.getElementById("hintButton"),
                restart: document.getElementById("restartButton"),
                prevSolved: document.getElementById("prevSolvedButton"),
                nextSolved: document.getElementById("nextSolvedButton"),
                next: document.getElementById("nextButton"),
            };

            const levels = [
                {
                    name: "Direkter Flug", // level 1
                    launch: { x: 142, y: 800 },
                    target: { x: 406, y: 214, r: 40 },
                    planets: [],
                    hazards: [
                        { label: "Asteroid", x: 330, y: 505, r: 22, color: "#9c8b7a" },
                    ],
                    hint: "Ziehen, zielen, loslassen. Ohne Schwerkraft fliegt die Sonde geradeaus - aber nicht durch den Brocken.",
                },
                {
                    name: "Erste Ablenkung", // level 2
                    launch: { x: 142, y: 800 },
                    target: { x: 410, y: 240, r: 60 },
                    planets: [
                        { label: "Merkur", x: 300, y: 600, r: 54, mass: 0.95, softening: 168, color: "#b9aba0", ring: false },
                    ],
                    hazards: [
                        { label: "Asteroid", x: 188, y: 686, r: 20, color: "#9c8b7a" },
                        { label: "Asteroid", x: 382, y: 482, r: 24, color: "#8d817c" },
                    ],
                    hint: "Ziehe mittelstark nach links unten. Merkur zieht die Bahn zwischen den Brocken ins Ziel.",
                },
                {
                    name: "Atmosphären-Fenster", // level 3
                    launch: { x: 106, y: 720 },
                    target: { x: 422, y: 275, r: 34 },
                    planets: [
                        { label: "Mars", x: 274, y: 384, r: 36, mass: 0.76, softening: 96, color: "#ff8e68", ring: false, atmosphereRadius: 86, atmosphereDrag: 0.72, atmosphereColor: "#ffb07e" },
                    ],
                    hazards: [
                        { label: "Asteroid", x: 386, y: 618, r: 22, color: "#9c8b7a" },
                        { label: "Asteroid", x: 190, y: 492, r: 22, color: "#8d817c" },

            function loadHighScores() {
                try {
                    const parsed = JSON.parse(localStorage.getItem(SCORE_STORAGE_KEY) || "[]");
                    return levels.map((_, index) => Math.max(0, Number(parsed[index]) || 0));
                } catch {

                }

            function saveHighScores() {
                try {
                    localStorage.setItem(SCORE_STORAGE_KEY, JSON.stringify(state.highScores));
                } catch {
                    // Storage can be unavailable in private contexts; scoring still works for the session.
                }
            }

            const state = {
                levelIndex: 0,
                mode: "ready",
                ship: { x: 0, y: 0, vx: 0, vy: 0, r: SHIP_RADIUS, heat: 0 },
                drag: { active: false, x: 0, y: 0 },
                trail: [],
                shots: 0,
                launchSpeed: 0,
                levelScore: 0,
                highScores: loadHighScores(),
                atmosphereTime: 0,
                currentAtmosphereStrength: 0,
                maxAtmosphereStrength: 0,
                heatTime: 0,
                currentHeatExposure: 0,
                maxHeat: 0,
                heatInShadow: false,
                heatSource: "",
                elapsed: 0,
                message: "",
                hintVisible: false,

            function currentLevel() {
                return levels[state.levelIndex];
            }

            function mechanicTutorialForLevel(levelIndex) {
                return MECHANIC_TUTORIALS[levelIndex] || null;
            }

            function levelHintAvailable() {
                return state.levelIndex >= HINT_UNLOCK_LEVEL_INDEX;
            }

            function readyPopupVisible() {
                return state.mode === "ready" && (
                    Boolean(mechanicTutorialForLevel(state.levelIndex)) ||
                    Boolean(state.hintVisible && levelHintAvailable())
                );
            }

            function isSolvedMission(index) {
                return (state.highScores[index] || 0) > 0;
            }

            function findSolvedMission(direction) {
                const step = direction < 0 ? -1 : 1;
                for (let index = state.levelIndex + step; index >= 0 && index < levels.length; index += step) {
                    if (isSolvedMission(index)) return index;
                }
                return null;
            }

            function goToSolvedMission(direction) {
                if (state.mode === "flying" || state.drag.active) return;
                const targetIndex = findSolvedMission(direction);
                if (targetIndex === null) return;
                state.levelIndex = targetIndex;
                resetLevel();
            }

            function resetLevel(keepMessage = false) {
                const level = currentLevel();
                state.mode = "ready";
                state.ship.x = level.launch.x;
                state.ship.y = level.launch.y;
                state.ship.vx = 0;
                state.ship.vy = 0;
                state.ship.heat = 0;
                state.drag.active = false;
                state.trail = [];
                state.shots = 0;
                state.launchSpeed = 0;
                state.levelScore = 0;
                state.atmosphereTime = 0;
                state.currentAtmosphereStrength = 0;
                state.maxAtmosphereStrength = 0;
                state.heatTime = 0;
                state.currentHeatExposure = 0;
                state.maxHeat = 0;
                state.heatInShadow = false;
                state.heatSource = "";
                state.elapsed = 0;
                state.lastOutcome = "none";
                state.hintVisible = false;
                state.message = keepMessage ? state.message : "";
                updateUi();
                render();
            }

            function nextLevel() {
                state.levelIndex = (state.levelIndex + 1) % levels.length;
                resetLevel();
            }

            function length(x, y) {
                return Math.hypot(x, y);
            }

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function escapeHtml(value) {
                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function colorWithAlpha(color, alpha) {
                if (!color || !color.startsWith("#")) return `rgba(117, 232, 255, ${alpha})`;
                const hex = color.slice(1);
                const fullHex = hex.length === 3
                    ? hex.split("").map((char) => char + char).join("")
                    : hex;
                const value = Number.parseInt(fullHex, 16);
                if (Number.isNaN(value)) return `rgba(117, 232, 255, ${alpha})`;
                const r = (value >> 16) & 255;
                const g = (value >> 8) & 255;
                const b = value & 255;
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            function totalHighScore() {
                return state.highScores.reduce((sum, score) => sum + score, 0);
            }

            function scoreForLaunchSpeed(launchSpeed, levelIndex) {
                const speedRatio = clamp(launchSpeed / MAX_LAUNCH_SPEED, 0, 1);
                const efficiency = Math.pow(1 - speedRatio, 1.35);
                const levelBonus = (levelIndex + 1) * 100;
                return Math.round(levelBonus + 1200 * efficiency);
            }

            function recordLevelScore() {
                const score = scoreForLaunchSpeed(state.launchSpeed, state.levelIndex);
                state.levelScore = score;
                const previousBest = state.highScores[state.levelIndex] || 0;
                const isNewBest = score > previousBest;
                if (isNewBest) {
                    state.highScores[state.levelIndex] = score;
                    saveHighScores();
                }
                return {
                    score,
                    best: state.highScores[state.levelIndex] || score,
                    isNewBest,
                    totalBest: totalHighScore(),
                };
            }

            function clampDrag(point) {
                const launch = currentLevel().launch;
                const dx = point.x - launch.x;
                const dy = point.y - launch.y;
                const d = length(dx, dy);
                if (d <= MAX_DRAG) return { x: point.x, y: point.y };
                const scale = MAX_DRAG / d;
                return { x: launch.x + dx * scale, y: launch.y + dy * scale };
            }

            function screenToWorld(event) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (event.clientX - rect.left) * (WORLD.width / rect.width),
                    y: (event.clientY - rect.top) * (WORLD.height / rect.height),
                };
            }

            function setMode(mode, message, outcome = mode) {
                state.mode = mode;
                state.message = message;
                state.hintVisible = false;
                state.lastOutcome = outcome;
                updateUi();
            }

            function shipSpeed() {
                return length(state.ship.vx, state.ship.vy);
            }

            function realElapsed() {
                return state.elapsed / FLIGHT_PLAYBACK_SPEED;
            }

            function timeRemaining() {
                return Math.max(0, REAL_TIME_LIMIT - realElapsed());
            }

            function isFailureMode(mode) {
                return mode === "crashed" || mode === "timeout" || mode === "flyaway";
            }

            function softeningFor(planet) {
                return planet.softening || Math.max(72, planet.r * 1.8);
            }

            function atmosphereStrengthAt(x, y, planet) {
                if (!planet.atmosphereRadius || !planet.atmosphereDrag) return 0;
                const distance = length(x - planet.x, y - planet.y);
                if (distance >= planet.atmosphereRadius) return 0;
                const innerEdge = planet.r + SHIP_RADIUS;
                const width = Math.max(1, planet.atmosphereRadius - innerEdge);
                return Math.pow(clamp((planet.atmosphereRadius - distance) / width, 0, 1), 1.35);
            }

            function isHeatSource(planet) {
                return Boolean(planet.heatRadius || planet.hotRadius || planet.label === "Sonne");
            }

            function heatRadiusFor(planet) {
                if (!isHeatSource(planet)) return 0;
                return planet.heatRadius || Math.max(planet.r * 2.8, (planet.hotRadius || planet.r * 2.2) * DEFAULT_HEAT_RADIUS_MULTIPLIER);
            }

            function heatRateFor(planet) {
                return planet.heatRate || SUN_HEAT_GAIN_RATE;
            }

            function heatOccluders(level, source) {
                return [
                    ...level.planets.filter((body) => body !== source),
                    ...(level.hazards || []),
                ];
            }

            function isCoveredFromHeatSource(x, y, source, level) {
                const rayX = x - source.x;
                const rayY = y - source.y;
                const rayLengthSq = rayX * rayX + rayY * rayY;
                if (rayLengthSq <= 1) return false;

                for (const body of heatOccluders(level, source)) {
                    const bodyX = body.x - source.x;
                    const bodyY = body.y - source.y;
                    const t = (bodyX * rayX + bodyY * rayY) / rayLengthSq;
                    if (t <= 0 || t >= 1) continue;
                    const closestX = source.x + rayX * t;
                    const closestY = source.y + rayY * t;
                    const coverRadius = body.coverRadius || body.r + SHIP_RADIUS * 0.8;
                    if (length(body.x - closestX, body.y - closestY) <= coverRadius) {
                        return true;
                    }
                }

                return false;
            }

            function thermalAt(x, y, level) {
                let strongest = {
                    exposure: 0,
                    heatRate: 0,
                    rawExposure: 0,
                    inShadow: false,
                    sourceLabel: "",
                };

                for (const source of level.planets) {
                    const heatRadius = heatRadiusFor(source);
                    if (!heatRadius) continue;
                    const distance = length(x - source.x, y - source.y);
                    if (distance >= heatRadius) continue;
                    const innerEdge = source.r + SHIP_RADIUS;
                    const width = Math.max(1, heatRadius - innerEdge);
                    const rawExposure = Math.pow(clamp((heatRadius - distance) / width, 0, 1), 1.2);
                    const inShadow = isCoveredFromHeatSource(x, y, source, level);
                    const heatRate = inShadow ? 0 : rawExposure * heatRateFor(source);

                    if (heatRate > strongest.heatRate || (!strongest.heatRate && rawExposure > strongest.rawExposure)) {
                        strongest = {
                            exposure: inShadow ? 0 : rawExposure,
                            heatRate,
                            rawExposure,
                            inShadow,
                            sourceLabel: source.label || "Sonne",
                        };
                    }
                }

                return strongest;
            }

            function updateProbeHeat(probe, level, dt) {
                const thermal = thermalAt(probe.x, probe.y, level);
                const currentHeat = probe.heat || 0;
                if (thermal.heatRate > 0) {
                    probe.heat = clamp(currentHeat + thermal.heatRate * dt, 0, HEAT_LIMIT);
                } else {
                    const coolingRate = thermal.inShadow ? SHADOW_COOL_RATE : HEAT_COOL_RATE;
                    probe.heat = clamp(currentHeat - coolingRate * dt, 0, HEAT_LIMIT);
                }
                return {
                    ...thermal,
                    heat: probe.heat,
                };
            }

            function gravityAt(x, y, level) {
                let ax = 0;
                let ay = 0;
                for (const planet of level.planets) {
                    const dx = planet.x - x;
                    const dy = planet.y - y;
                    const rawDistance = Math.max(1, length(dx, dy));
                    const softening = softeningFor(planet);
                    const softenedDistanceSq = dx * dx + dy * dy + softening * softening;
                    const force = GRAVITY_SCALE * planet.mass / softenedDistanceSq;
                    ax += (dx / rawDistance) * force;
                    ay += (dy / rawDistance) * force;
                }
                return { ax, ay };
            }

            function applyGravity(entity, level, dt) {
                const gravity = gravityAt(entity.x, entity.y, level);
                let strongestAtmosphere = 0;
                entity.vx += gravity.ax * dt;
                entity.vy += gravity.ay * dt;
                for (const planet of level.planets) {
                    const strength = atmosphereStrengthAt(entity.x, entity.y, planet);
                    if (strength <= 0) continue;
                    strongestAtmosphere = Math.max(strongestAtmosphere, strength);
                    const damping = Math.exp(-planet.atmosphereDrag * strength * dt);
                    entity.vx *= damping;
                    entity.vy *= damping;
                }
                entity.x += entity.vx * dt;
                entity.y += entity.vy * dt;
                return { atmosphereStrength: strongestAtmosphere };
            }

            function checkProbeOutcome(probe, level, elapsed) {
                for (const planet of level.planets) {
                    if (length(probe.x - planet.x, probe.y - planet.y) <= SHIP_RADIUS + planet.r) {
                        return { mode: "crashed", message: "Zu nah dran. Beim nächsten Start etwas mehr Abstand halten.", outcome: "planet_collision" };
                    }
                }

                for (const hazard of level.hazards || []) {
                    if (length(probe.x - hazard.x, probe.y - hazard.y) <= SHIP_RADIUS + hazard.r) {
                        return { mode: "crashed", message: "Kollision mit Trümmern. Neue Flugbahn?", outcome: "hazard_collision" };
                    }
                }

                if ((probe.heat || 0) >= HEAT_LIMIT) {
                    return { mode: "crashed", message: "Überhitzt. Suche Schatten oder verlasse die Sonnennähe früher.", outcome: "overheated" };
                }

                const target = level.target;
                if (length(probe.x - target.x, probe.y - target.y) <= SHIP_RADIUS + target.r) {
                    if (target.maxSpeed && length(probe.vx, probe.vy) > target.maxSpeed) {
                        return { mode: "crashed", message: "Zu schnell am Ziel. Nutze die Schwerkraft zum Abbremsen.", outcome: "too_fast" };
                    }
                    return {
                        mode: "won",
                        message: state.levelIndex === levels.length - 1
                            ? "Letzte Bahn erreicht. Alle Missionen geschafft."
                            : "Mission geschafft. Bereit für den nächsten Kurs?",
                        outcome: "target_reached"
                    };
                }

                if (elapsed >= TIME_LIMIT) {
                    return { mode: "timeout", message: "Das Signal ist abgelaufen. Die Sonde war zu lange unterwegs.", outcome: "timeout" };
                }

                const flyMargin = Math.max(FLY_MARGIN, Math.min(WORLD.width, WORLD.height) * 0.32);
                if (probe.x < -flyMargin || probe.x > WORLD.width + flyMargin ||
                    probe.y < -flyMargin || probe.y > WORLD.height + flyMargin) {
                    return { mode: "flyaway", message: "Die Sonde verlässt den Sektor.", outcome: "flyaway" };
                }

                return null;
            }

            function launchFromDrag() {
                const launch = currentLevel().launch;
                const dx = launch.x - state.drag.x;
                const dy = launch.y - state.drag.y;
                const pull = length(dx, dy);
                state.drag.active = false;
                if (pull < 12) {
                    state.ship.x = launch.x;
                    state.ship.y = launch.y;
                    state.launchSpeed = 0;
                    state.message = "Ziehe etwas weiter zurück, damit die Sonde genug Starttempo bekommt.";
                    updateUi();
                    return;
                }
                state.ship.x = launch.x;
                state.ship.y = launch.y;
                state.ship.vx = dx * LAUNCH_POWER;
                state.ship.vy = dy * LAUNCH_POWER;
                state.launchSpeed = pull * LAUNCH_POWER;
                state.levelScore = 0;
                state.atmosphereTime = 0;
                state.currentAtmosphereStrength = 0;
                state.maxAtmosphereStrength = 0;
                state.ship.heat = 0;
                state.heatTime = 0;
                state.currentHeatExposure = 0;
                state.maxHeat = 0;
                state.heatInShadow = false;
                state.heatSource = "";
                state.mode = "flying";
                state.elapsed = 0;
                state.shots += 1;
                state.trail = [{ x: state.ship.x, y: state.ship.y }];
                state.hintVisible = false;
                state.message = "Sonde unterwegs.";
                updateUi();
            }

            function onPointerDown(event) {
                if (state.mode !== "ready") return;
                const point = screenToWorld(event);
                const launch = currentLevel().launch;
                if (length(point.x - state.ship.x, point.y - state.ship.y) > 48 &&
                    length(point.x - launch.x, point.y - launch.y) > 60) {
                    return;
                }
                state.drag.active = true;
                const clamped = clampDrag(point);
                state.drag.x = clamped.x;
                state.drag.y = clamped.y;
                canvas.setPointerCapture(event.pointerId);
                updateUi();
                render();
            }

            function onPointerMove(event) {
                if (!state.drag.active) return;
                const clamped = clampDrag(screenToWorld(event));
                state.drag.x = clamped.x;
                state.drag.y = clamped.y;
                render();
            }

            function onPointerUp(event) {
                if (!state.drag.active) return;
                canvas.releasePointerCapture(event.pointerId);
                launchFromDrag();
                render();
            }

            function step(dt) {
                if (state.mode !== "flying") return;
                const level = currentLevel();
                state.elapsed += dt;

                const environment = applyGravity(state.ship, level, dt);
                state.currentAtmosphereStrength = environment.atmosphereStrength;
                if (environment.atmosphereStrength > 0) {
                    state.atmosphereTime += dt;
                    state.maxAtmosphereStrength = Math.max(state.maxAtmosphereStrength, environment.atmosphereStrength);
                }
                const thermal = updateProbeHeat(state.ship, level, dt);
                state.currentHeatExposure = thermal.exposure;
                state.heatInShadow = thermal.inShadow;
                state.heatSource = thermal.sourceLabel;
                state.maxHeat = Math.max(state.maxHeat, state.ship.heat);
                if (thermal.heatRate > 0) state.heatTime += dt;

                if (state.trail.length === 0 ||
                    length(state.ship.x - state.trail[state.trail.length - 1].x, state.ship.y - state.trail[state.trail.length - 1].y) > 6) {
                    state.trail.push({ x: state.ship.x, y: state.ship.y });
                    if (state.trail.length > 170) state.trail.shift();
                }

                const outcome = checkProbeOutcome(state.ship, level, state.elapsed);
                if (outcome) {
                    if (outcome.outcome === "target_reached") {
                        const score = recordLevelScore();
                        const bestText = score.isNewBest ? " Neuer Bestwert!" : ` Best: ${score.best}.`;
                        outcome.message = state.levelIndex === levels.length - 1
                            ? `+${score.score} Punkte.${bestText} Alle Missionen geschafft.`
                            : `+${score.score} Punkte.${bestText} Bereit für den nächsten Kurs?`;
                    }
                    setMode(outcome.mode, outcome.message, outcome.outcome);
                    return;
                }

                updateUi();
            }

            function predictPath() {
                if (!state.drag.active) return { points: [], outcome: "idle" };
                const level = currentLevel();
                const launch = level.launch;
                const sim = {
                    x: launch.x,
                    y: launch.y,
                    vx: (launch.x - state.drag.x) * LAUNCH_POWER,
                    vy: (launch.y - state.drag.y) * LAUNCH_POWER,
                    heat: 0,
                };
                const points = [];
                let outcome = null;
                const predictionSteps = Math.ceil((TIME_LIMIT * PREDICTION_TIME_RATIO) / FIXED_DT);
                for (let i = 0; i < predictionSteps; i += 1) {
                    applyGravity(sim, level, FIXED_DT);
                    updateProbeHeat(sim, level, FIXED_DT);
                    if (i % 5 === 0) points.push({ x: sim.x, y: sim.y });
                    outcome = checkProbeOutcome(sim, level, i * FIXED_DT);
                    if (outcome) break;
                }
                return { points, outcome: outcome ? outcome.outcome : "flight" };
            }

            function drawDistantBody(body, time) {
                const x = body.nx * WORLD.width;
                const y = body.ny * WORLD.height;
                const r = body.r * 0.86;
                ctx.save();
                ctx.globalAlpha = body.kind === "asteroid" ? 0.52 : 0.66;
                ctx.translate(x, y);
                ctx.rotate(Math.sin(time * 0.15 + body.nx * 9) * 0.08);

                if (body.kind === "asteroid") {
                    ctx.beginPath();
                    for (let i = 0; i < 12; i += 1) {
                        const angle = (i / 12) * Math.PI * 2;
                        const wobble = 0.76 + ((i * 31) % 29) / 95;
                        const px = Math.cos(angle) * r * wobble;
                        const py = Math.sin(angle) * r * (0.78 + wobble * 0.22);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    const rock = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
                    rock.addColorStop(0, "#d1c0b8");
                    rock.addColorStop(0.42, body.color);
                    rock.addColorStop(1, "#242233");
                    ctx.fillStyle = rock;
                    ctx.fill();
                    ctx.strokeStyle = "rgba(255,255,255,0.16)";
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                } else {
                    const planet = ctx.createRadialGradient(-r * 0.35, -r * 0.42, r * 0.1, 0, 0, r);
                    planet.addColorStop(0, "#fff7e7");
                    planet.addColorStop(0.22, body.color);
                    planet.addColorStop(1, "#17284f");
                    ctx.shadowColor = body.color;
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = planet;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.clip();
                    ctx.globalAlpha *= 0.68;
                    ctx.fillStyle = body.kind === "mars" ? "rgba(93,36,39,0.34)" : "rgba(40,35,48,0.28)";
                    for (let i = 0; i < 4; i += 1) {
                        ctx.beginPath();
                        ctx.ellipse(
                            -r * 0.35 + i * r * 0.28,
                            -r * 0.12 + Math.sin(i + time) * r * 0.18,
                            r * (0.15 + i * 0.025),
                            r * 0.08,
                            i * 0.5,
                            0,
                            Math.PI * 2
                        );
                        ctx.fill();
                    }
                }
                ctx.restore();
            }

            function drawBackground() {
                const time = performance.now() / 1000;
                const gradient = ctx.createLinearGradient(0, 0, WORLD.width, WORLD.height);
                gradient.addColorStop(0, "#04081f");
                gradient.addColorStop(0.38, "#061b3b");
                gradient.addColorStop(0.72, "#112855");
                gradient.addColorStop(1, "#06122c");
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, WORLD.width, WORLD.height);

                const nebulaA = ctx.createRadialGradient(WORLD.width * 0.18, WORLD.height * 0.27, 10, WORLD.width * 0.18, WORLD.height * 0.27, WORLD.width * 0.42);
                nebulaA.addColorStop(0, "rgba(0, 209, 255, 0.28)");
                nebulaA.addColorStop(0.38, "rgba(19, 112, 198, 0.13)");
                nebulaA.addColorStop(1, "rgba(42, 93, 164, 0)");
                ctx.fillStyle = nebulaA;
                ctx.fillRect(0, 0, WORLD.width, WORLD.height);

                const nebulaB = ctx.createRadialGradient(WORLD.width * 0.82, WORLD.height * 0.72, 16, WORLD.width * 0.82, WORLD.height * 0.72, WORLD.height * 0.42);
                nebulaB.addColorStop(0, "rgba(238, 74, 210, 0.18)");
                nebulaB.addColorStop(0.48, "rgba(76, 222, 170, 0.1)");
                nebulaB.addColorStop(1, "rgba(93, 58, 148, 0)");
                ctx.fillStyle = nebulaB;
                ctx.fillRect(0, 0, WORLD.width, WORLD.height);

                ctx.save();
                ctx.globalAlpha = 0.34;
                ctx.lineWidth = 18;
                for (let band = 0; band < 3; band += 1) {
                    ctx.strokeStyle = band === 0 ? "rgba(36, 210, 255, 0.18)" : band === 1 ? "rgba(165, 95, 255, 0.13)" : "rgba(74, 255, 170, 0.11)";
                    ctx.beginPath();
                    const yBase = WORLD.height * (0.2 + band * 0.23);
                    ctx.moveTo(-60, yBase);
                    for (let x = -60; x <= WORLD.width + 80; x += 90) {
                        const y = yBase + Math.sin(x * 0.012 + time * 0.18 + band) * WORLD.height * 0.08;
                        ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
                ctx.restore();

                for (const body of distantBodies) drawDistantBody(body, time);

                for (const star of stars) {
                    const x = star.nx * WORLD.width;
                    const y = (star.ny * WORLD.height + Math.sin(time * star.drift + star.nx * 10) * 2.2 + WORLD.height) % WORLD.height;
                    ctx.globalAlpha = star.a;
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(x, y, star.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                for (const sparkle of sparkles) {
                    const x = sparkle.nx * WORLD.width;
                    const y = sparkle.ny * WORLD.height;
                    const pulse = 0.78 + Math.sin(time * 1.4 + sparkle.nx * 12) * 0.22;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.strokeStyle = sparkle.hue;
                    ctx.globalAlpha = 0.42 + pulse * 0.22;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-sparkle.r * pulse, 0);
                    ctx.lineTo(sparkle.r * pulse, 0);
                    ctx.moveTo(0, -sparkle.r * pulse);
                    ctx.lineTo(0, sparkle.r * pulse);
                    ctx.stroke();
                    ctx.fillStyle = sparkle.hue;
                    ctx.globalAlpha = 0.22;
                    ctx.beginPath();
                    ctx.arc(0, 0, sparkle.r * 0.32, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            function drawGravityField(planet) {
                const fieldRadius = Math.max(planet.r * 3.4, softeningFor(planet) * 1.55);
                ctx.save();
                ctx.translate(planet.x, planet.y);
                ctx.strokeStyle = "rgba(19, 215, 239, 0.2)";
                ctx.fillStyle = "rgba(19, 215, 239, 0.05)";
                ctx.lineWidth = 2;
                for (let i = 3; i >= 1; i -= 1) {
                    const r = fieldRadius * (i / 3);
                    ctx.globalAlpha = 0.18 + (4 - i) * 0.12;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    if (i === 3) ctx.fill();
                    ctx.stroke();
                }
                ctx.globalAlpha = 0.35;
                ctx.setLineDash([7, 11]);
                ctx.beginPath();
                ctx.arc(0, 0, fieldRadius * 0.66, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            function drawAtmosphere(planet) {
                if (!planet.atmosphereRadius) return;
                const color = planet.atmosphereColor || "#75e8ff";
                const time = performance.now() / 1000;
                const pulse = 1 + Math.sin(time * 1.7 + planet.x * 0.02) * 0.025;
                const radius = planet.atmosphereRadius * pulse;
                ctx.save();
                ctx.translate(planet.x, planet.y);

                const haze = ctx.createRadialGradient(0, 0, planet.r * 0.9, 0, 0, radius);
                haze.addColorStop(0, colorWithAlpha(color, 0.24));
                haze.addColorStop(0.62, colorWithAlpha(color, 0.13));
                haze.addColorStop(1, colorWithAlpha(color, 0.02));
                ctx.fillStyle = haze;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.lineWidth = 4;
                ctx.strokeStyle = colorWithAlpha(color, 0.82);
                ctx.setLineDash([12, 7]);
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.lineWidth = 2.5;
                ctx.strokeStyle = colorWithAlpha(color, 0.42);
                for (let i = 0; i < 3; i += 1) {
                    const arcRadius = radius * (0.52 + i * 0.15);
                    const start = time * (0.32 + i * 0.08) + i * 1.75;
                    ctx.beginPath();
                    ctx.arc(0, 0, arcRadius, start, start + Math.PI * 0.58);
                    ctx.stroke();
                }
                ctx.restore();
            }

            function drawHeatField(source, level) {
                const heatRadius = heatRadiusFor(source);
                if (!heatRadius) return;
                const time = performance.now() / 1000;
                const pulse = 1 + Math.sin(time * 1.6 + source.x * 0.01) * 0.018;
                const radius = heatRadius * pulse;

                ctx.save();
                const glow = ctx.createRadialGradient(source.x, source.y, source.r * 0.9, source.x, source.y, radius);
                glow.addColorStop(0, "rgba(255, 213, 92, 0.28)");
                glow.addColorStop(0.42, "rgba(255, 125, 64, 0.13)");
                glow.addColorStop(1, "rgba(255, 74, 54, 0.018)");
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(source.x, source.y, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = "rgba(255, 180, 90, 0.38)";
                ctx.lineWidth = 2;
                ctx.setLineDash([9, 13]);
                ctx.beginPath();
                ctx.arc(source.x, source.y, radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                for (const body of heatOccluders(level, source)) {
                    const dx = body.x - source.x;
                    const dy = body.y - source.y;
                    const distance = length(dx, dy);
                    if (distance <= 1 || distance > radius + body.r) continue;
                    const ux = dx / distance;
                    const uy = dy / distance;
                    const px = -uy;
                    const py = ux;
                    const nearWidth = body.r + 12;
                    const farDistance = Math.max(80, radius - distance + 70);
                    const farWidth = nearWidth + farDistance * 0.34;
                    const nearX = body.x;
                    const nearY = body.y;
                    const farX = body.x + ux * farDistance;
                    const farY = body.y + uy * farDistance;

                    ctx.fillStyle = "rgba(5, 18, 38, 0.34)";
                    ctx.beginPath();
                    ctx.moveTo(nearX + px * nearWidth, nearY + py * nearWidth);
                    ctx.lineTo(farX + px * farWidth, farY + py * farWidth);
                    ctx.lineTo(farX - px * farWidth, farY - py * farWidth);
                    ctx.lineTo(nearX - px * nearWidth, nearY - py * nearWidth);
                    ctx.closePath();
                    ctx.fill();

                    ctx.strokeStyle = "rgba(116, 230, 255, 0.16)";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(nearX + px * nearWidth, nearY + py * nearWidth);
                    ctx.lineTo(farX + px * farWidth, farY + py * farWidth);
                    ctx.moveTo(nearX - px * nearWidth, nearY - py * nearWidth);
                    ctx.lineTo(farX - px * farWidth, farY - py * farWidth);
                    ctx.stroke();
                }

                ctx.restore();
            }

            function drawPlanet(planet) {
                ctx.save();
                if (planet.ring) {
                    ctx.translate(planet.x, planet.y);
                    ctx.rotate(-0.28);
                    ctx.strokeStyle = "rgba(232, 219, 255, 0.58)";
                    ctx.lineWidth = 7;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, planet.r * 1.55, planet.r * 0.42, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                    ctx.save();
                }
                const g = ctx.createRadialGradient(
                    planet.x - planet.r * 0.32,
                    planet.y - planet.r * 0.36,
                    planet.r * 0.15,
                    planet.x,
                    planet.y,
                    planet.r
                );
                g.addColorStop(0, "#ffffff");
                g.addColorStop(0.16, planet.color);
                g.addColorStop(0.74, planet.color);
                g.addColorStop(1, "#10366f");
                ctx.fillStyle = g;
                ctx.shadowColor = planet.color;
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(planet.x, planet.y, planet.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.26)";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.clip();
                if (planet.label === "Erde") {
                    ctx.fillStyle = "rgba(76, 205, 86, 0.72)";
                    [
                        [-16, -12, 18, 9, -0.4],
                        [18, -4, 22, 10, 0.2],
                        [-2, 18, 25, 11, 0.4],
                        [28, 19, 12, 6, -0.2],
                    ].forEach(([x, y, rx, ry, rot]) => {
                        ctx.beginPath();
                        ctx.ellipse(planet.x + x, planet.y + y, rx, ry, rot, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
                    [
                        [-28, 7, 15, 5, 0.2],
                        [24, 13, 17, 5, -0.25],
                        [5, -22, 13, 4, 0.15],
                    ].forEach(([x, y, rx, ry, rot]) => {
                        ctx.beginPath();
                        ctx.ellipse(planet.x + x, planet.y + y, rx, ry, rot, 0, Math.PI * 2);
                        ctx.fill();
                    });
                } else if (planet.label === "Mond" || planet.label === "Pluto") {
                    ctx.fillStyle = "rgba(34, 30, 44, 0.22)";
                    [
                        [-0.26, -0.18, 0.16],
                        [0.24, 0.08, 0.13],
                        [-0.06, 0.3, 0.11],
                        [0.18, -0.34, 0.08],
                    ].forEach(([x, y, r]) => {
                        ctx.beginPath();
                        ctx.arc(planet.x + x * planet.r, planet.y + y * planet.r, planet.r * r, 0, Math.PI * 2);
                        ctx.fill();
                    });
                } else if (planet.label === "Mars") {
                    ctx.fillStyle = "rgba(132, 42, 40, 0.32)";
                    [
                        [-0.22, -0.2, 0.18, 0.08, 0.25],
                        [0.2, 0.2, 0.24, 0.1, -0.15],
                        [0.08, -0.38, 0.12, 0.05, 0.4],
                    ].forEach(([x, y, rx, ry, rot]) => {
                        ctx.beginPath();
                        ctx.ellipse(planet.x + x * planet.r, planet.y + y * planet.r, planet.r * rx, planet.r * ry, rot, 0, Math.PI * 2);
                        ctx.fill();
                    });
                } else if (planet.label === "Sonne") {
                    ctx.globalAlpha = 0.36;
                    ctx.strokeStyle = "#fff4a8";
                    ctx.lineWidth = Math.max(2, planet.r * 0.08);
                    for (let y = -planet.r * 0.54; y <= planet.r * 0.54; y += planet.r * 0.28) {
                        ctx.beginPath();
                        ctx.ellipse(planet.x, planet.y + y, planet.r * 0.82, planet.r * 0.09, 0.18, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                } else {
                    ctx.globalAlpha = planet.label === "Jupiter" || planet.label === "Saturn" ? 0.34 : 0.22;
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = Math.max(2, planet.r * 0.08);
                    for (let y = -planet.r * 0.65; y <= planet.r * 0.65; y += planet.r * 0.36) {
                        ctx.beginPath();
                        ctx.ellipse(planet.x, planet.y + y, planet.r * 0.88, planet.r * 0.12, -0.18, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
                ctx.restore();

                ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
                ctx.beginPath();
                ctx.arc(planet.x + planet.r * 0.33, planet.y - planet.r * 0.38, planet.r * 0.14, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawHazard(hazard) {
                ctx.save();
                const points = 11;
                ctx.beginPath();
                for (let i = 0; i < points; i += 1) {
                    const angle = (i / points) * Math.PI * 2;
                    const wobble = 0.78 + ((i * 37) % 23) / 80;
                    const x = hazard.x + Math.cos(angle) * hazard.r * wobble;
                    const y = hazard.y + Math.sin(angle) * hazard.r * wobble;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                const g = ctx.createRadialGradient(
                    hazard.x - hazard.r * 0.3,
                    hazard.y - hazard.r * 0.35,
                    hazard.r * 0.1,
                    hazard.x,
                    hazard.y,
                    hazard.r
                );
                g.addColorStop(0, "#f0dcc7");
                g.addColorStop(0.28, hazard.color || "#9c8b7a");
                g.addColorStop(1, "#3a312e");
                ctx.fillStyle = g;
                ctx.strokeStyle = "rgba(255, 230, 200, 0.28)";
                ctx.lineWidth = 2;
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = "rgba(20, 15, 18, 0.38)";
                [[-0.25, -0.2, 0.22], [0.28, 0.08, 0.18], [-0.02, 0.32, 0.12]].forEach(([x, y, r]) => {
                    ctx.beginPath();
                    ctx.arc(hazard.x + x * hazard.r, hazard.y + y * hazard.r, hazard.r * r, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();
            }

            function drawTargetIcon(target, pulse) {
                ctx.save();
                ctx.translate(target.x, target.y);
                ctx.scale(pulse, pulse);
                ctx.fillStyle = "#72f45e";
                ctx.beginPath();
                ctx.moveTo(9, -1);
                ctx.lineTo(-8, -11);
                ctx.lineTo(-3, 0);
                ctx.lineTo(-8, 11);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = "#073d2a";
                ctx.beginPath();
                ctx.arc(-1, 0, 2.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function drawTarget(target) {
                ctx.save();
                const pulse = 1 + Math.sin(performance.now() / 260) * 0.06;
                const glow = ctx.createRadialGradient(target.x, target.y, target.r * 0.2, target.x, target.y, target.r * 2.1);
                glow.addColorStop(0, "rgba(124, 242, 56, 0.34)");
                glow.addColorStop(0.5, "rgba(124, 242, 56, 0.12)");
                glow.addColorStop(1, "rgba(124, 242, 56, 0)");
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.r * 2.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = "rgba(124, 242, 56, 0.88)";
                ctx.lineWidth = 7;
                ctx.setLineDash([24, 9]);
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.r * pulse, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = "rgba(215, 255, 219, 0.7)";
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.r * 0.62, 0, Math.PI * 2);
                ctx.stroke();
                drawTargetIcon(target, pulse);
                if (target.maxSpeed) {
                    const label = `Tempo < ${target.maxSpeed}`;
                    const labelY = target.y > WORLD.height * 0.72
                        ? target.y - target.r - 18
                        : target.y + target.r + 20;
                    ctx.fillStyle = "rgba(247, 251, 255, 0.78)";
                    ctx.font = "700 13px Avenir Next Condensed, Trebuchet MS, sans-serif";
                    ctx.textAlign = "center";
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = "rgba(2, 8, 22, 0.72)";
                    ctx.strokeText(label, target.x, labelY);
                    ctx.fillText(label, target.x, labelY);
                }
                ctx.restore();
            }

            function drawLaunchOrigin(launch) {

                ctx.save();
                ctx.translate(launch.x, launch.y);
                const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 52);

                glow.addColorStop(0.52, "rgba(30, 222, 255, 0.13)");
                glow.addColorStop(1, "rgba(30, 222, 255, 0)");
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(0, 0, 54, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = "rgba(255, 226, 92, 0.72)";
                ctx.lineWidth = 3;
                ctx.setLineDash([9, 8]);
                ctx.beginPath();
                ctx.arc(0, 0, 27 * pulse, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = "rgba(103, 232, 92, 0.36)";
                ctx.lineWidth = 7;
                ctx.beginPath();
                ctx.arc(0, 0, 38, -0.8, 1.5);
                ctx.stroke();
                ctx.strokeStyle = "rgba(40, 224, 255, 0.38)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 44, 1.9, 5.4);
